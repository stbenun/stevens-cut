<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171915">
<title>The Cut</title>
</head>
<body style="margin:0">

<style>
  /* ============ THE CUT v14 · design tokens ============ */
  :root{
    --ink:#15170f; --ink2:#101208;
    --panel:#20231b; --panel2:#292c22; --panel3:#31342a; --line:#363a2e; --line2:#42462f;
    --text:#ece8db; --muted:#a09d8e; --faint:#6f6d60;
    --brass:#d9a441; --brass-hi:#ecc06a; --brass-dim:#8a6a2e; --brass-ink:#241c08;
    --meat:#c4674f; --dairy:#7fa8c9; --pareve:#8faa72;
    --ok:#8faa72; --warn:#d9a441; --danger:#c4674f;
    --disp:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
    --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
    --r-card:16px; --r-ctl:11px;
    --card-grad:linear-gradient(180deg,#23261d 0%,#1e211a 100%);
    --card-hi:inset 0 1px 0 rgba(255,255,255,.045);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{background:
        radial-gradient(1200px 400px at 50% -100px, #1d2016 0%, var(--ink) 60%);
       background-color:var(--ink);color:var(--text);font-family:var(--body);
       font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
       -webkit-tap-highlight-color:transparent}
  .app{max-width:520px;margin:0 auto;padding:0 14px 118px}

  /* ---- header ---- */
  header.top{padding:calc(12px + env(safe-area-inset-top,0px)) 2px 8px;
       display:flex;flex-direction:column;gap:10px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:19px;margin:0;letter-spacing:.4px}
  .brand h1 span{color:var(--brass)}
  .brand .coach{font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
  .macrostrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mcell{background:var(--card-grad);border:1px solid var(--line);border-radius:12px;
         box-shadow:var(--card-hi);padding:8px 10px;text-align:center}
  .mcell .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;
            font-size:17px;color:var(--brass)}
  .mcell .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:1px}

  /* ---- zone bar (sticky chip subnav, lives outside #view) ---- */
  .zonebar{position:sticky;top:0;z-index:9;margin:0 -14px;padding:8px 14px;
       background:color-mix(in srgb,var(--ink) 82%,transparent);
       backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;
       border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
  .zonebar::-webkit-scrollbar{display:none}
  .zonebar:empty{display:none}
  .zchip{flex-shrink:0;border:1px solid var(--line);background:var(--panel);color:var(--muted);
       border-radius:99px;padding:6px 12px;font-size:12px;font-weight:650;letter-spacing:.02em}
  .zchip.hot{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
  .zbrest{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-variant-numeric:tabular-nums;
       font-size:12.5px;font-weight:700;color:var(--brass);padding:6px 10px;border-radius:99px;
       border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);display:none}
  .zbrest.live{display:inline-block}
  .zbrest.go{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .zonebar input.zsearch{flex:1;min-width:120px;font-family:var(--body);font-size:15px;
       border-radius:99px;padding:7px 14px}

  /* ---- section & zone headers ---- */
  h2.sec{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
         margin:22px 2px 8px;font-weight:650;display:flex;align-items:baseline;gap:8px}
  .zone{margin:0}
  .zhead{display:flex;align-items:center;gap:8px;margin:26px 2px 10px}
  .zhead .zt{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.02em}
  .zhead::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--line) 70%,transparent)}
  .zhead .zn{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* ---- cards ---- */
  .card{background:var(--card-grad);border:1px solid var(--line);border-radius:var(--r-card);
        box-shadow:var(--card-hi);padding:14px 16px;margin-bottom:12px}
  .card h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
  .card .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .statline{display:flex;align-items:center;gap:8px;color:var(--muted);
        font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;margin-left:auto;
        flex-shrink:0;padding-right:2px}
  details.acc summary .statline b{color:var(--brass);font-weight:700}

  /* ---- chips ---- */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
        letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;
        border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--muted)}
  .chip.meat{color:var(--meat);border-color:color-mix(in srgb,var(--meat) 45%,transparent)}
  .chip.meat::before{background:var(--meat)}
  .chip.dairy{color:var(--dairy);border-color:color-mix(in srgb,var(--dairy) 45%,transparent)}
  .chip.dairy::before{background:var(--dairy)}
  .chip.pareve{color:var(--pareve);border-color:color-mix(in srgb,var(--pareve) 45%,transparent)}
  .chip.pareve::before{background:var(--pareve)}
  .chip.time{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 40%,transparent);
             white-space:normal;overflow-wrap:anywhere;max-width:100%}
  .chip.time::before{display:none}
  .chip.notetag::before{display:none}
  .chip.off{color:var(--meat);border-color:color-mix(in srgb,var(--meat) 45%,transparent)}
  .chip.hw{color:var(--dairy);border-color:color-mix(in srgb,var(--dairy) 45%,transparent)}
  .chip.kf{cursor:pointer}
  .chip.kf.on{background:var(--panel3);color:var(--text)}

  /* ---- meal options / ingredients ---- */
  .opt{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .opt:first-of-type{border-top:none;margin-top:8px;padding-top:0}
  .opt .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .opt .head b{font-size:15px;font-weight:650}
  .varlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-top:8px}
  .ing{margin:8px 0 0;padding:0;list-style:none}
  .ing li{display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;font-size:14px}
  .ing li .q{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);
             font-size:12.5px;text-align:right;max-width:58%;overflow-wrap:anywhere}
  .totals{display:flex;gap:14px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
          font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
  .totals b{color:var(--brass);font-weight:700}
  .budget{display:flex;gap:14px;font-family:var(--mono);font-variant-numeric:tabular-nums;
          font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
  .budget b{color:var(--text);font-weight:600}

  /* ---- today: hero + strip + timeline ---- */
  .today-date{font-family:var(--disp);font-weight:800;font-size:26px;margin:4px 0 0;letter-spacing:.2px}
  .today-sub{color:var(--brass);font-weight:600;font-size:14px;margin-top:2px;display:flex;
             justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .hero{display:flex;align-items:stretch;gap:14px;margin-top:12px}
  .hero .hleft{flex:1;min-width:0}
  .hero-num{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.05;
        font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .hero-num small{font-size:14px;font-weight:650;color:var(--muted);letter-spacing:0}
  .depbars{display:flex;flex-direction:column;gap:5px;margin-top:9px}
  .dep{display:grid;grid-template-columns:16px 1fr 74px;gap:8px;align-items:center}
  .dep .dl{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em}
  .dep .dt{height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;display:block}
  .dep .df{display:block;height:100%;border-radius:99px;background:var(--brass)}
  .dep .df.p{background:var(--pareve)} .dep .df.c{background:var(--dairy)} .dep .df.f{background:var(--meat)}
  .dep .dv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10.5px;
        color:var(--muted);text-align:right;white-space:nowrap}
  .glance{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;
        border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);flex-wrap:wrap}
  .glance .gslots{display:flex;gap:5px;align-items:center}
  .gdot{width:17px;height:17px;border-radius:99px;border:1.5px solid var(--line);
        background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;
        font-size:9px;color:var(--faint);font-weight:700}
  .gdot.on{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
  .gdot.skip{border-style:dashed;color:var(--muted)}
  .gstat{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
        font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
  .gwater{width:44px;height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;display:inline-block}
  .gwater i{display:block;height:100%;background:var(--dairy);border-radius:99px}
  .wins{color:var(--faint);font-size:11.5px;margin-top:10px;letter-spacing:.02em}

  .nowstrip{border-left:3px solid var(--brass);padding-left:13px}
  .ns-cur{font-family:var(--disp);font-weight:750;font-size:16.5px}
  .ns-next{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
  .ns-next b{color:var(--brass);font-family:var(--mono);font-weight:700;font-size:12.5px}
  .nact{margin-top:10px;display:inline-flex;align-items:center;gap:7px;
        background:var(--brass);color:var(--brass-ink);border:none;border-radius:99px;
        padding:9px 16px;font-weight:750;font-size:13.5px}
  .nact.ghosted{background:transparent;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 50%,transparent)}
  .nudge{margin-top:9px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
  .nudge .nx{color:var(--faint);background:none;border:none;font-size:14px;padding:0 4px}
  .dayprog{height:3px;border-radius:99px;background:var(--panel3);overflow:hidden;margin-top:12px}
  .dayprog i{display:block;height:100%;background:color-mix(in srgb,var(--brass) 65%,transparent)}

  .sched{margin:10px 0 0;padding:0;list-style:none}
  .sched li{display:flex;gap:10px;padding:4px 0;font-size:14.5px;align-items:baseline}
  .sched li .t{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass);
               font-size:12.5px;min-width:64px;flex-shrink:0}
  .sched li.past{opacity:.42}
  #dayTL:not(.showpast) li.past{display:none}
  #dayTL li.tlpast{cursor:pointer;font-size:12.5px;opacity:.55;user-select:none;-webkit-user-select:none}
  .sched li.cur{position:relative;opacity:1}
  .sched li.cur::before{content:"";position:absolute;left:-13px;top:4px;bottom:4px;width:3px;
        border-radius:2px;background:var(--brass)}
  .sched li.cur .t{color:var(--brass-hi);font-weight:700}
  .sched li.rem .t{color:var(--dairy)}
  .note{background:color-mix(in srgb,var(--brass) 10%,transparent);
        border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);
        color:var(--text);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}

  /* ---- meal tiles ---- */
  .mtiles{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;
        scroll-snap-type:x proximity;scrollbar-width:none}
  .mtiles::-webkit-scrollbar{display:none}
  .mtile{flex:0 0 108px;scroll-snap-align:start;text-align:left;
        background:var(--panel2);border:1px solid var(--line);border-radius:13px;
        padding:9px 10px;color:var(--text);display:flex;flex-direction:column;gap:3px;min-height:78px}
  .mtile .mt-t{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:.04em}
  .mtile .mt-n{font-size:12px;font-weight:650;line-height:1.25;overflow:hidden;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mtile .mt-m{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:auto}
  .mtile.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .mtile.done .mt-n{color:var(--muted)}
  .mtile.done .mt-t::after{content:" ✓";color:var(--ok)}
  .mtile.next{border-color:var(--brass);box-shadow:0 0 0 1px color-mix(in srgb,var(--brass) 35%,transparent)}
  .mtile.exp{background:var(--panel3)}

  .timer-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  input,textarea,select{
        background:var(--panel2);border:1px solid var(--line);color:var(--text);
        border-radius:var(--r-ctl);padding:8px 10px;font-family:var(--mono);font-size:16px;
        color-scheme:dark}
  textarea{font-family:var(--body);width:100%;min-height:64px;resize:vertical}
  button{font-family:var(--body);cursor:pointer}
  .btn{background:var(--brass);color:var(--brass-ink);border:none;border-radius:var(--r-ctl);
       padding:10px 15px;font-weight:700;font-size:14px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,
  .suppitem:focus-visible,.buyitem:focus-visible,input:focus-visible,textarea:focus-visible,
  select:focus-visible,.xdel:focus-visible,.pgrid button:focus-visible,.mealpick:focus-visible,
  .step:focus-visible,.zchip:focus-visible,.mtile:focus-visible,.tooltile:focus-visible,
  .setdot:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* ---- lift layer (dimensions FROZEN — keypad-stability contract) ---- */
  .setdot{width:26px;height:26px;border-radius:99px;border:1.5px solid var(--line);
       background:var(--panel2);padding:0;flex-shrink:0;transition:background .15s,border-color .15s}
  .setdot.on{background:var(--brass);border-color:var(--brass)}
  input.repin{width:52px;text-align:center;padding:7px 2px;font-size:16px}
  input.prw2{width:72px;text-align:center;padding:6px 2px;font-size:16px}
  .coachline{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
       color:var(--brass);text-align:right;margin-top:6px;line-height:1.5}
  .setrow{display:grid;grid-template-columns:24px 88px 14px 60px;gap:7px;align-items:center;
       justify-content:end;margin-top:6px}
  .setrow.noreps{grid-template-columns:24px 88px}
  .setrow .slab{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
  .setrow .x{color:var(--muted);font-size:11px;text-align:center}
  input.wti{width:88px;text-align:center;padding:7px 2px;font-size:16px}
  input.rpi{width:60px;text-align:center;padding:7px 2px;font-size:16px;
       border-color:color-mix(in srgb,var(--brass) 55%,var(--line))}
  select.exsel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:5px 8px;font-size:16px;font-family:var(--body)}
  .restchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
       font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--brass);
       border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:99px;
       padding:5px 12px}
  .restchip:empty{display:none}
  .restchip.go{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  body.sesh-on .zone:not(#z-lift){opacity:.35;transition:opacity .25s}
  body.sesh-on .zonebar .zchip:not([data-jump="z-lift"]){opacity:.5}
  .seshsum{border-left:3px solid var(--ok);padding-left:13px}

  /* ---- hydration / dials / stack ---- */
  .water-label{font-size:12px;color:var(--muted);margin-top:8px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);
       border-radius:12px;padding:3px;gap:3px;margin:4px 0 14px}
  .seg button{border:none;background:transparent;color:var(--muted);border-radius:9px;
       padding:9px 0;font-weight:650;font-size:14px}
  .seg button.on{background:var(--brass);color:var(--brass-ink)}
  .seg.mini{margin:0;display:inline-grid;grid-auto-flow:column}
  .seg.mini button{padding:6px 12px;font-size:12px}
  .rules{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 14px;letter-spacing:.02em}
  .ex{margin:8px 0 0;padding:0;list-style:none}
  .ex li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14.5px;
         border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);align-items:center}
  .ex li:first-child{border-top:none}
  .ex li .r{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass);
            font-size:12.5px;flex-shrink:0;text-align:right}
  .daytag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .upflag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brass-ink);background:var(--pareve);
          border-radius:6px;padding:2px 6px;margin-left:6px;text-transform:uppercase;white-space:nowrap}

  .suppitem,.buyitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
            background:transparent;border:none;color:var(--text);font-size:15px;min-height:44px;
            padding:9px 2px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .suppitem:first-of-type,.buyitem:first-of-type{border-top:none}
  .suppitem .box,.buyitem .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
            flex-shrink:0;display:flex;align-items:center;justify-content:center;
            font-size:14px;color:var(--brass-ink);background:var(--panel2)}
  .suppitem.done .box,.buyitem.done .box{background:var(--pareve);border-color:var(--pareve)}
  .suppitem.done .nm,.buyitem.done .nm{color:var(--muted);text-decoration:line-through}
  .suppitem .when,.buyitem .q{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.06em;
            text-transform:uppercase;flex-shrink:0;font-family:var(--mono)}
  .xdel{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px;flex-shrink:0}

  /* ---- menu builder + pickers ---- */
  .mrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px;min-height:44px;
        border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .mrow:first-of-type{border-top:none}
  .mrow .nm{flex:1}
  .stepper{display:flex;align-items:center;gap:2px}
  .step{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
        color:var(--text);font-size:17px;font-weight:700;padding:0;line-height:1}
  .stepn{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:26px;text-align:center;
         font-size:15px;font-weight:700;color:var(--brass)}
  .slotlbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
           margin:12px 0 4px;font-weight:600}
  .slotlbl:first-of-type{margin-top:2px}
  .pickrow{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 2px}
  .mealpick{border:1px solid var(--line);background:var(--panel2);color:var(--text);
        border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;min-height:34px}
  .mealpick .rem{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}

/* rep-scheme parsing + double-progression verdicts */
function parseTargets(r){
  if(/failure/i.test(r)) return null;
  const parts = r.replace('×','x').split('x');
  const sets = parseInt(parts[0])||3;
  const nums = ((parts[1]||'').match(/\d+/g)||[]).map(Number);
  if(!nums.length) return null;
  if(nums.length>=3 || (nums.length===2 && nums[0]>nums[1]))
    return {sets, per:nums, type:'ladder'};
  if(nums.length===2) return {sets, lo:nums[0], hi:nums[1], type:'range'};
  return {sets, lo:nums[0], hi:nums[0], type:'range'};
}
function verdict(reps, t){
  if(!t) return null;
  const rs = (reps||[]).slice(0,t.sets);
  if(rs.filter(v=>v!=null).length < t.sets) return null;
  if(t.type==='ladder')
    return rs.every((v,i)=>v >= (t.per[i]!=null?t.per[i]:t.per[t.per.length-1])) ? 'up' : 'hold';
  if(rs.every(v=>v>=t.hi)) return 'up';
  if(rs.every(v=>v<t.lo)) return 'down';
  return 'hold';
}

function plateCombo(v){
  let rem = v; const out = [];
  for(const p of [45,35,25,10,5]){ while(rem >= p-0.01){ out.push(p); rem -= p; } }
  return out.length? out.join('+') + (rem>0.01? ` +${rem.toFixed(1)}`:'') : 'empty';
}
function prescribe(lv, baseVals, curVals, sets){
  const cur = (curVals||[]).slice(0,sets);
  const base = (baseVals&&baseVals.length? baseVals : cur).slice(0,sets);
  const nums = base.map(x=>parseFloat(x));
  const hasNums = nums.some(n=>!isNaN(n));
  const fmt = f => base.map((x,i)=> isNaN(nums[i])? (x||'?') : String(r25(f(nums[i])))).join(' / ');
  if(lv==='up'){
    const curN = cur.map(x=>parseFloat(x)).filter(n=>!isNaN(n));
    const baseN = nums.filter(n=>!isNaN(n));
    const already = curN.length && baseN.length && Math.min(...curN) > Math.min(...baseN)+0.01;
    if(already) return `GO UP — already loaded: ${cur.filter(x=>x).join(' / ')} ✓ hit the rep targets with 1–2 in the tank`;
    return `GO UP → load ${hasNums? fmt(n=>n+jumpFor(n)) : 'the smallest jump on every set'} · same rep targets`;
  }
  if(lv==='down') return `LIGHTEN → ${hasNums? fmt(n=>n*0.9) : '~10% down'}`;
  return `SAME weight → ${cur.filter(x=>x).join(' / ')||base.filter(x=>x).join(' / ')||'repeat last loads'} · beat last week’s reps`;
}

  const reps = hasReps? ((store.get('qpcut.reps.'+dkey(o.rd),{}))[o.ex]||[]) : [];
  /* effort feedback: reps left in the tank on the LAST set (RP-style autoregulation) */
  const rir = hasReps? (store.get('qpcut.rir.'+dkey(o.rd),{}))[o.ex] : undefined;
  const rows = Array.from({length:o.sets},(_,s)=>{
    const ph = o.t? (o.t.type==='ladder'? (o.t.per[s]!=null?o.t.per[s]:o.t.per[o.t.per.length-1]) : o.t.hi) : '·';
    return `<div class="setrow${hasReps?'':' noreps'}">
      <span class="slab">S${s+1}</span>
      ${prId?`<input class="prw2 wti" inputmode="decimal" data-pr="${prId}" data-set="${s}" value="${esc(vals[s]!=null?vals[s]:'')}" placeholder="wt" aria-label="set ${s+1} weight">`:'<span></span>'}
      ${hasReps?`<span class="x">×</span>
      <input class="repin rpi" inputmode="numeric" data-rd="${o.rd}" data-ex="${o.ex}" data-set="${s}" value="${reps[s]!=null?reps[s]:''}" placeholder="${ph}" aria-label="set ${s+1} reps">`:''}
    </div>`;
  }).join('');
  /* ⚖ optional right-arm rows for single-arm movements */
  let armHTML = '';
  if(prId && ARM_EX.has(prId)){
    const armOn = store.get('qpcut.armmode',{})[prId];
    const limb = LEG_EX.has(prId)? 'leg' : 'arm';
    armHTML = `<div style="display:flex;justify-content:flex-end;margin-top:6px">
      <button class="btn ghost" style="padding:4px 10px;font-size:11px" data-arm="${prId}">${armOn?`✕ hide right-${limb} rows`:`⚖ log ${limb}s separately`}</button></div>`;
    if(armOn){
      const rVals = pset[prId+'__R']||[];
      const rReps = hasReps? ((store.get('qpcut.reps.'+dkey(o.rd),{}))[o.ex+'R']||[]) : [];
      armHTML += `<div class="ingmac" style="text-align:right;margin-top:4px">rows above = LEFT ${limb} · below = RIGHT (leave blank if same)</div>`;
      armHTML += Array.from({length:o.sets},(_,s)=>`
        <div class="setrow${hasReps?'':' noreps'}">
          <span class="slab">R${s+1}</span>
          <input class="prw2 wti" inputmode="decimal" data-pr="${prId}__R" data-set="${s}" value="${esc(rVals[s]!=null?rVals[s]:'')}" placeholder="wt" aria-label="right arm set ${s+1} weight">
          ${hasReps?`<span class="x">×</span>
          <input class="repin rpi" inputmode="numeric" data-rd="${o.rd}" data-ex="${o.ex}R" data-set="${s}" value="${rReps[s]!=null?rReps[s]:''}" placeholder="·" aria-label="right arm set ${s+1} reps">`:''}
        </div>`).join('');
      const lTot = reps.slice(0,o.sets).filter(x=>x!=null).reduce((a,b)=>a+b,0);
      const rTot = rReps.slice(0,o.sets).filter(x=>x!=null).reduce((a,b)=>a+b,0);
      if(lTot && rTot && lTot!==rTot){
        const weak = rTot<lTot? 'RIGHT':'LEFT';
        armHTML += `<div class="coachline" style="color:var(--meat)">⚖ ${weak} ${limb} behind (${Math.min(lTot,rTot)} vs ${Math.max(lTot,rTot)} total reps). Protocol: start every set with the ${weak} ${limb} · strong ${limb} only MATCHES the weak side’s reps · finish with 1 extra back-off set weak-side only.</div>`;
      }
    }
  }
  /* live guidance is delegated to exGuideHTML via a registry so it can refresh IN PLACE
     (full re-renders while typing destroy the focused input and kill the iOS keyboard) */
  const egi = (o.t && prId && hasReps)? EG_REG.push({sets:o.sets, t:o.t, rd:o.rd, ex:o.ex, day:o.day, prId})-1 : -1;
  const guideWrap = egi>=0? `<div class="exguide" id="eg-${egi}">${exGuideHTML(EG_REG[egi])}</div>` : '';
  const legNote = (prId && !vals.some(x=>x) && leg)? `<div class="ingmac" style="text-align:right;margin-top:3px">was ${esc(String(leg))}</div>`:'';
  /* 🧮 plate math for flagged exercises */
  let pmLine = '';
  const pm = prId? PLATEMATH[prId] : null;
  if(pm){
    const parts = vals.slice(0,o.sets).map((x,i)=>{
      const n = parseFloat(x); if(isNaN(n)) return null;
      if(pm==='db') return `S${i+1}: ${Math.round(n/5)*5}s`;
      const side = pm==='bar'? (n-45)/2 : n;
      return side<=0? `S${i+1}: bar only` : `S${i+1}: ${plateCombo(side)}`;
    }).filter(Boolean);
    if(parts.length) pmLine = `<div class="ingmac" style="text-align:right;margin-top:4px">🧮 ${pm==='db'?'DBs':pm==='bar'?'45-lb bar · per side':'per side'} → ${parts.join(' · ')}</div>`;
  }
  return selHTML + legNote + rows + armHTML + pmLine + guideWrap;
}
/* ---- ONE voice: target (pre-session) → live call (mid-session) → verdict (done). Never two at once.
   Reads the store FRESH each call so refreshGuides() can update panels without a full render. ---- */
let EG_REG = [];
function exGuideHTML(p){
  const prId = p.prId;
  const vals = (store.get('qpcut.prset',{}))[prId]||[];
  const reps = (store.get('qpcut.reps.'+dkey(p.rd),{}))[p.ex]||[];
  const rir = (store.get('qpcut.rir.'+dkey(p.rd),{}))[p.ex];
  const o = p;
  const v = verdict(reps, o.t);
  let guide = '';
  const doneCount = reps.slice(0,o.sets).filter(x=>x!=null).length;
  {
    const ls = (o.day!=null)? lastSessionInfo(o.day, o.ex) : null;
    const lv = ls? verdict(ls.reps, o.t) : null;
    const wlLast = ls? (store.get('qpcut.wlog.'+dkey(ls.date),{}))[prId] : null;
    const lsRir = ls? (store.get('qpcut.rir.'+dkey(ls.date),{}))[o.ex] : undefined;
    const lastLine = ls? `<div class="coachline" style="opacity:.85">📜 Last ${ls.date.slice(5).replace('-','/')}: ${ls.reps.slice(0,o.sets).map(x=>x==null?'·':x).join('/')} reps${wlLast&&wlLast.some(x=>x)?` @ ${wlLast.filter(x=>x).join('/')}`:''}${lsRir!=null?` · RIR ${lsRir===3?'3+':lsRir}`:''}</div>` : '';
    if(doneCount===0){
      guide = `<div class="coachline">🎯 ${lv? prescribe(lv, wlLast, vals, o.sets)
        : (vals.some(x=>x)? `Plan: ${vals.filter(x=>x).join(' / ')} · ${o.t.type==='ladder'?'climb the boxes':`${o.t.lo}–${o.t.hi} reps every set`} · finish each set with 1–2 in the tank`
        : 'No weight yet — 📖 calibration guide is at the top of Train → PRs')}</div>`;
      if(o.day!=null){
        const past3 = lastSessions(o.day, o.ex, 3);
        if(past3.length===3 && past3.every(s=>verdict(s.reps, o.t)==='hold'))
          guide += `<div class="coachline" style="color:var(--meat)">⚠ 3 sessions stalled at this weight — today: drop ~10%, rebuild a rep per week. Stalls break from behind, not from pushing the same wall.</div>`;
      }
    } else if(v===null){
      let idx = -1;
      for(let s=1;s<o.sets;s++){ if(reps[s]==null && reps[s-1]!=null){ idx = s; break; } }
      if(idx>0){
        const prev = reps[idx-1];
        const wNum = parseFloat(vals[idx-1]);
        const j = isNaN(wNum)? null : jumpFor(wNum);
        let msg;
        if(o.t.type==='ladder'){
          const tPrev = o.t.per[idx-1]!=null? o.t.per[idx-1] : o.t.per[o.t.per.length-1];
          const tNext = o.t.per[idx]!=null? o.t.per[idx] : o.t.per[o.t.per.length-1];
          if(prev>=tPrev) msg = `${prev} ✓. Ladder climbs — set ${idx+1}: next box up${vals[idx]?` (${esc(String(vals[idx]))})`:''} · target ${tNext} · 1–2 in the tank.`;
          else if(prev>=tPrev-2) msg = `${prev} vs ${tPrev} — close. HOLD this weight for set ${idx+1} instead of climbing; get ${tNext}+ clean reps. The ladder waits for the reps.`;
          else msg = `${prev} vs ${tPrev} — the climb died. Go BACK to your set-1 weight for the rest. Reps first, weight later — that’s the plan, trust it.`;
        } else {
          if(idx===1 && prev>=o.t.hi+3) msg = `Way too light (${prev} vs ${o.t.hi}) — add ${j?`${j} lb (${r25(wNum+j)})`:'the smallest jump'} NOW and call this set 1.`;
          else if(prev>=o.t.hi+3) msg = `${prev} reps — you’ve outgrown this weight, and the GO UP is already locked for next session. DON’T jump mid-exercise (it costs your remaining sets): set ${idx+1} at the SAME weight, cap it at ${o.t.hi}, slow every rep to 3–5 s. Make it hard the honest way.`;
          else if(prev>=o.t.hi) msg = `${prev} ✓ top of range. Set ${idx+1}: SAME weight — do it again. Every set at ${o.t.hi}+ locks the GO UP. 1–2 in the tank.`;
          else if(prev>=o.t.lo) msg = `${prev} in range. Set ${idx+1}: SAME weight — beat ${Math.min(prev+1,o.t.hi)} if it’s there, ${o.t.lo} is the floor. Fatigue pushes back now; brace and grind. Staying at this weight IS the plan — chasing more mid-exercise costs sets.`;
          else if(prev>=o.t.lo-2) msg = `${prev} — just under range. One more set at the SAME weight, fight for ${o.t.lo}+. If it lands under ${o.t.lo} again → drop ~10%${isNaN(wNum)?'':` (${r25(wNum*0.9)})`} for the last set.`;
          else msg = `${prev} vs ${o.t.lo}–${o.t.hi} — too heavy today. Drop ~10%${isNaN(wNum)?'':` (${r25(wNum*0.9)})`} for the remaining sets and log honest reps. A bad day isn’t a bad plan.`;
        }
        guide = `<div class="coachline">▶ ${msg}</div>`;
      }
    } else {
      const nums = vals.slice(0,o.sets).map(x=>parseFloat(x));
      const hasNums = nums.some(n=>!isNaN(n));
      const fmt = f => vals.slice(0,o.sets).map((x,i)=> isNaN(nums[i])? (x||'?') : String(r25(f(nums[i])))).join(' / ');
      if(v==='up'){
        guide = rir===0
          ? `<div class="coachline">🎉 GO UP — but that was failure (0 in the tank), so next session take the SMALLEST jump only${hasNums?`: ${fmt(n=>n+5)}`:''}.</div>`
          : `<div class="coachline">🎉 GO UP next session → ${hasNums? fmt(n=>n+jumpFor(n)) : 'smallest solid jump every set'}. Update the boxes at the gym next time, not now.</div>`;
      } else if(v==='down'){
        guide = `<div class="coachline">⬇ LIGHTEN next session → ${hasNums? fmt(n=>n*0.9) : '~10% down'}, rebuild from there.</div>`;
      } else {
        guide = (rir!=null && rir>=3)
          ? `<div class="coachline">HOLD — but 3+ in the tank means the reps are there. Same weight next session, take every set to 1–2 left. Then it’s a GO UP.</div>`
          : `<div class="coachline">HOLD — same weight next session, beat today by one rep anywhere. That’s the whole game.</div>`;
      }
    }
    guide = lastLine + guide; /* last session stays visible in every state — that's the reference point */
  }
  /* RIR chips — tap after the final set */
  let rirHTML = '';
  if(doneCount>0){
    rirHTML = `<div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px">
      <span class="ingmac">last set — reps left in tank:</span>
      ${[0,1,2,3].map(n=>`<button class="mealpick${rir===n?' on':''}" style="padding:3px 10px;font-size:12px" data-rir="${o.rd}|${o.ex}|${n}">${n===3?'3+':n}</button>`).join('')}
    </div>`;
  }
  return guide + rirHTML;
}

/* full render only once no weight/rep box is focused — keeps the keyboard alive between taps */
let idleTimer = null;
function renderWhenIdle(){
  clearTimeout(idleTimer);
  const tick = ()=>{
    const a = document.activeElement;
    /* any focused field defers the re-render — lift boxes, meal search, note boxes all keep their keyboard */
    if(a && a.tagName && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ idleTimer = setTimeout(tick, 400); return; }
    render();
  };
  idleTimer = setTimeout(tick, 300);
}

function wireReps(){
  /* [data-rir] chips are bound by DELEGATION at boot (see v14 boot block) — refreshGuides()
     swaps the guide innerHTML, so per-element bindings here would die after the first tap */
  document.querySelectorAll('input.repin').forEach(inp=>inp.addEventListener('change',()=>{

    const rp = store.get(key,{});

    arr[+inp.dataset.set] = isNaN(v)? null : v;
    store.set(key,rp);
    /* logging a real set TODAY auto-starts the rest clock — compounds get 120 s.
       parseInt strips the 'R' off right-arm ids so both arms rest the same. */
    if(!isNaN(v) && inp.dataset.rd===isoToday() && !/^core/.test(String(inp.dataset.ex))){
      const wd = new Date().getDay();
      const wo = workoutFor(wd, store.get('qpcut.loc','deal'));
      const exIdx = parseInt(String(inp.dataset.ex),10);
      const nm = wo && wo.ex[exIdx]? wo.ex[exIdx][0] : '';
      armRest(/squat|press|row|deadlift|thrust|dip|pull/i.test(nm)? 120 : 90);
    }
    refreshGuides(); renderWhenIdle();
  }));
}
function workoutFor(dayIdx, loc){
  const plan = loc==='deal' ? GYM : HOME;
  if(dayIdx===1) return plan.mon;
  if(dayIdx===2) return plan.tue;
  if(dayIdx===3) return plan.wed;
  if(dayIdx===5) return plan.fri;
  if(dayIdx===6) return loc==='deal' ? SAT_GRANDMA : SAT_HOME;
  return null;
}

/* feast defrost tracks the dish's cook day: Shawarma weeks = Friday-fresh, others = Thursday night */
function feastDefrostLine(day){
  const f = weekPick(SHABBAT_FEAST);
  const friFresh = /Shawarma/i.test(f.n);
  if(friFresh && day===5) return ['6:45 AM',`🧊 Feast chicken out — ${f.n} cooks TONIGHT after the gym`];
  if(!friFresh && day===4) return ['7:05 AM',`🧊 Feast protein out — ${f.n} cooks tonight`];
  return null;
}

/* auto run-coaching banners from the Runna plan; manual EVENTS for the day take priority */
function runCoaching(){
  if(EVENTS.some(e=>e.d===isoToday())) return [];
  const out = [];
  const now = new Date(), day = now.getDay();
  const rw = runnaWeek(now);
  if(!rw) return out;
  const miles = s => { const m = /([\d.]+)\s*mi/.exec(s); return m? parseFloat(m[1]) : null; };
  const thuMi = miles(rw[2]), sunDesc = rw[3], sunMi = miles(sunDesc);
  if(day===4 && thuMi){
    if(thuMi>=14) out.push({title:`🏃 Long run today — ${thuMi} mi · ~${Math.round(thuMi*10)}–${Math.round(thuMi*11.5)} min. Fueled run.`,
      msg:`<b>Pace: 9:45–10:30 /mi, HR ≤ 155 the whole way</b> — at this distance a fast start ends the run early. <b>1:30 lunch:</b> Chicken Meal, pick RICE over sweet potato. <b>4:45 PM (or 45–60 min before a morning run):</b> Ezekiel + SF jelly AND 1 banana (~290 cal / 65 C) + 16–24 oz water with a hydration stick. <b>Carry:</b> ${thuMi>=18?'3':'2'} kosher gels or ${thuMi>=18?'7-8':'5-6'} Medjool dates + the stick bottle. <b>During:</b> first fuel at minute 45, then every 30–35 min — never wait to feel bad. <b>Within 45 min after:</b> Fairlife 320 mL + ½ scoop as a shake, then dinner ~1 hr later (Poke Bowl if it’s in the menu). The mid-run fuel is EXTRA on top of 2,220 — mandatory, and it goes in the Sunday report to coach.`});
    else if(thuMi>=8) out.push({title:`🏃 Long run today — ${thuMi} mi · ~${Math.round(thuMi*10)}–${Math.round(thuMi*11.5)} min`,
      msg:`<b>Pace: 9:45–10:30 /mi, HR ≤ 155.</b> If HR passes 160, slow down or walk 60 sec — walking counts, blowing up doesn’t. Speed lives on Sunday, not today. <b>Fuel 45–60 min before</b> (morning or evening run): Ezekiel + SF jelly (180 cal / 40 C) + 16 oz water with a hydration stick. <b>Carry:</b> 1 kosher gel or 2–3 Medjool dates — take at minute 45 if you’ll pass 90 minutes. <b>After:</b> eat the snack or dinner within 45 min of finishing — carbs + protein first, don’t wait until 10 PM starving. Any mid-run fuel is extra by design; log it in a note.`});
    else out.push({title:`🏃 Long run today — ${thuMi} mi · easy ~${Math.round(thuMi*10)} min`,
      msg:`<b>~5:00 PM:</b> Yogurt + Banana (Oikos + 1 banana, 200 cal) + 8–16 oz water. <b>Run:</b> conversational pace the whole way — if you can’t talk, slow down. No mid-run fuel needed. <b>After:</b> normal snack and dinner, nothing changes.`});
  }
  if(day===3 && thuMi>=10) out.push({title:`🏃 ${thuMi} mi long run tomorrow — set it up today`,
    msg:`<b>Eat every carb in the plan today — especially the 10 PM dinner carbs (they’re tomorrow’s fuel).</b> Add one extra 30 oz bottle to today’s gallon. Check you have gels/dates + 2 hydration sticks for tomorrow. Lights out by 11:30 — the run is only as good as tonight’s sleep.`});
  if(day===0 && sunDesc){
    if(sunDesc.includes('RACE')) out.push({title:'🏁 RACE DAY — 26.2', msg:'Full race-day plan comes from Claude race week — fueling schedule, breakfast timing, pacing. Nothing new today. Trust the taper.'});
    else if(sunMi) out.push({title:`🏃 Quality run this morning — ${sunDesc}`,
      msg:`<b>45–60 min before:</b> Yogurt + Banana (200 cal) + 8–16 oz water. <b>Warm up:</b> 5 min easy jog + 4 strides before the hard stuff — speed work on cold legs is how hamstrings pop. <b>Hit Runna’s paces, not faster.</b> After: breakfast as normal, then weigh-in report + prep day.`});
  }
  if(day===5 && thuMi>=12) out.push({title:`⚠️ Recovery watch — ${thuMi} mi yesterday`,
    msg:`Legs #2 on tired legs today. <b>Breakfast: pick Bagel w/ Berries</b> (72 C, the biggest-carb option). Longer warmup; drop the last set of anything that gets ugly. Front-load water before Shabbat.`});
  return out;
}

function buildGrocery(counts){
  const agg = new Map();
  Object.entries(counts).forEach(([id,n])=>{
    if(!n || !GROC[id]) return;
    GROC[id].forEach(([grp,item,q,u])=>{
      const key = grp+'|'+item+'|'+u;
      agg.set(key,(agg.get(key)||0)+q*n);
    });
  });
  const out = {};
  [...agg.entries()].forEach(([key,q])=>{
    const [grp,item,u] = key.split('|');
    let disp;
    if(u==='oz') disp = q>=16? `${q} oz (~${(q/16).toFixed(1)} lb)` : `${q} oz`;
    else if(u==='g') disp = `${q} g`;
    else if(u==='ml') disp = `${q} mL (~${Math.ceil(q/1500)} bottle${q>1500?'s':''})`;
    else if(u==='slices') disp = `${q} slices`;
    else if(u==='serving') disp = `${q} serving${q>1?'s':''}`;
    else disp = `× ${q}`;
    (out[grp]=out[grp]||[]).push([item,disp]);
  });
  Object.values(out).forEach(list=>list.sort((a,b)=>a[0]<b[0]?-1:1));
  return out;
}

/* weekly recipe sets — full recipes, spice amounts scale with the menu.
   s = scale source: 'chix' = all chicken meals, 'l1' = sweet-potato chicken meals, null = per portion */
function tspF(x){
  if(x<0.2) return 'pinch';
  const q = Math.round(x*4)/4, w = Math.floor(q), r = +(q-w).toFixed(2);
  const f = {0:'',0.25:'¼',0.5:'½',0.75:'¾'}[r]||'';
  return `${w||''}${f} tsp`.trim();
}
function recipeCount(s,counts){
  if(s==='chix') return (counts.l1||0)+(counts.l1r||0);
  return s? (counts[s]||0) : 0;
}
function qtyF(q,u,n){
  const m = q*n;
  if(u==='tsp') return tspF(m);
  if(u==='oz') return `${m} oz${m>=16?` (~${(m/16).toFixed(1)} lb)`:''}`;
  if(u==='ct') return m===1?'1':`× ${m}`;
  if(u==='lemon') return m<=0.5?'squeeze':m<=1?'1':Math.ceil(m)+'';
  return `${Math.round(m)} ${u}`;
}

/* ---------- cloud sync · phone ↔ computer via a secret GitHub gist ----------
   Every localStorage write stamps a per-key clock (qpcut.syncmeta). Sync pulls the
   gist, merges per key by newest stamp (deletes carry tombstones), and pushes back
   only when this device holds something newer. Photos live in IndexedDB — not synced. */
const SYNC_FILE = 'thecut-data.json', SYNC_DESC = 'the-cut-sync';
const RAWSET = localStorage.setItem.bind(localStorage), RAWRM = localStorage.removeItem.bind(localStorage);
function syncable(k){ return !!k && k.startsWith('qpcut.') && !k.startsWith('qpcut.sync'); }
function syncCfg(){ return { token: localStorage.getItem('qpcut.sync.token')||'', gist: localStorage.getItem('qpcut.sync.gist')||'' }; }
function syncMeta(){ try{ const m = JSON.parse(localStorage.getItem('qpcut.syncmeta')); return (m && m.w && m.t)? m : {w:{},t:{}}; }catch(e){ return {w:{},t:{}}; } }
function syncSaveMeta(m){ RAWSET('qpcut.syncmeta', JSON.stringify(m)); }
let syncTimer = null, SYNC_BUSY = false;
function syncTouch(k, dead){
  if(!syncable(k)) return;
  const m = syncMeta();
  if(dead){ delete m.w[k]; m.t[k] = Date.now(); }
  else { delete m.t[k]; m.w[k] = Date.now(); }
  syncSaveMeta(m);
  if(syncCfg().gist){ clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(), 8000); }
}
if(typeof Storage !== 'undefined'){
  const _set = Storage.prototype.setItem, _rm = Storage.prototype.removeItem;
  Storage.prototype.setItem = function(k,v){ _set.apply(this,arguments); try{ if(this===window.localStorage) syncTouch(String(k)); }catch(e){} };
  Storage.prototype.removeItem = function(k){ _rm.apply(this,arguments); try{ if(this===window.localStorage) syncTouch(String(k), true); }catch(e){} };
}
function syncLocalKeys(){
  const out = [];
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(syncable(k)) out.push(k); }
  return out;
}
function syncPayload(){
  const m = syncMeta(), data = {};
  syncLocalKeys().forEach(k=>{ data[k] = localStorage.getItem(k); });
  return JSON.stringify({v:1, at:Date.now(), data, w:m.w, t:m.t});
}
async function ghApi(path, opts){
  opts = opts || {};
  const r = await fetch('https://api.github.com'+path, Object.assign({}, opts, {
    headers: Object.assign({'Authorization':'token '+syncCfg().token, 'Accept':'application/vnd.github+json'}, opts.headers||{})
  }));
  if(!r.ok) throw new Error('GitHub said '+r.status);
  return r.json();
}
/* merge a remote payload into localStorage — per key, the newest stamp wins */
function syncMerge(remote){
  const m = syncMeta();
  const rd = remote.data||{}, rw = remote.w||{}, rt = remote.t||{};
  let changed = 0, dirty = false;
  const keys = new Set([].concat(Object.keys(rd), Object.keys(rt), syncLocalKeys(), Object.keys(m.w), Object.keys(m.t)));
  keys.forEach(k=>{
    if(!syncable(k)) return;
    const lS = Math.max(m.w[k]||0, m.t[k]||0), rS = Math.max(rw[k]||0, rt[k]||0);
    const lVal = localStorage.getItem(k), rHas = Object.prototype.hasOwnProperty.call(rd, k);
    if(rS > lS){
      if((rt[k]||0) >= (rw[k]||0)){            /* newer remote delete */
        if(lVal!==null){ RAWRM(k); changed++; }
        m.t[k] = rt[k]; delete m.w[k];
      } else if(rHas){                          /* newer remote write */
        if(lVal !== rd[k]){ RAWSET(k, rd[k]); changed++; }
        m.w[k] = rw[k]; delete m.t[k];
      }
    } else if(rS < lS){
      dirty = true;                             /* this device is newer — push after merge */
    } else {                                    /* tie — usually both unstamped legacy data */
      if(rHas && lVal===null){ RAWSET(k, rd[k]); changed++; if(rw[k]) m.w[k] = rw[k]; }
      else if(rHas && lVal!==rd[k]){
        if(!m.w[k]){ RAWSET(k, rd[k]); changed++; if(rw[k]) m.w[k] = rw[k]; }
        else dirty = true;
      }
      else if(!rHas && lVal!==null){ dirty = true; }
    }
  });
  syncSaveMeta(m);
  return {changed, dirty};
}
function syncStatus(msg){ const el = document.getElementById('syState'); if(el) el.textContent = msg; }
async function syncNow(){
  const cfg = syncCfg(); if(!cfg.token || !cfg.gist || SYNC_BUSY) return;
  SYNC_BUSY = true; syncStatus('⏳ syncing…');
  try{
    const g = await ghApi('/gists/'+cfg.gist);
    const f = g.files && g.files[SYNC_FILE];
    let remote = {};
    if(f){
      const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      try{ remote = JSON.parse(txt)||{}; }catch(e){}
    }
    const res = syncMerge(remote);
    if(res.dirty || !f){
      await ghApi('/gists/'+cfg.gist, {method:'PATCH', body: JSON.stringify({files:{[SYNC_FILE]:{content: syncPayload()}}})});
    }
    RAWSET('qpcut.sync.last', String(Date.now()));
    syncStatus('✓ synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
    if(res.changed){ (typeof renderWhenIdle==='function') ? renderWhenIdle() : render(); }
  }catch(e){
    syncStatus('⚠ sync failed — check internet; it retries on the next edit or app-open');
  }
  SYNC_BUSY = false;
}
async function syncConnect(token){
  RAWSET('qpcut.sync.token', token.trim());
  const mine = await ghApi('/gists?per_page=100');
  let g = (mine||[]).find(x => x.description===SYNC_DESC && x.files && x.files[SYNC_FILE]);
  if(!g){
    /* first device in — stamp everything it holds so this copy wins on every other device */
    const m = syncMeta(), now = Date.now();
    syncLocalKeys().forEach(k=>{ if(!m.w[k]) m.w[k] = now; });
    syncSaveMeta(m);
    g = await ghApi('/gists', {method:'POST', body: JSON.stringify({description:SYNC_DESC, public:false, files:{[SYNC_FILE]:{content: syncPayload()}}})});
  }
  RAWSET('qpcut.sync.gist', g.id);
  await syncNow();
}
function syncDisconnect(){ RAWRM('qpcut.sync.token'); RAWRM('qpcut.sync.gist'); RAWRM('qpcut.sync.last'); }

/* ============ v14 live engine ============
   Contract: tickers NEVER call render(). tickNow patches #nowStrip (zero inputs inside)
   + toggles classes on timeline rows; tickRest patches textContent on chips. The lift
   card (.prw2/.repin/EG_REG) is a sealed component — nothing here touches its DOM. */
const PLAN_T = [2220,187,227,64];
function fmtMin(t){ t=((t%1440)+1440)%1440; let h=Math.floor(t/60), mm=t%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(mm).padStart(2,'0')} ${ap}`; }
function parseClock(s){ const m=/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(String(s).trim()); if(!m) return null; let h=(+m[1])%12; if(/pm/i.test(m[3])) h+=12; return h*60+(+m[2]); }
/* loose parser for OVERRIDES schedule time labels: "1:30", "~2:30", "7:00", "11:00", "AM", "After", "—".
   Returns {m:minutes, timed:true} for real clock rows, or {m:anchor, timed:false} for text rows that
   should sort into place but NEVER get hidden as "past". Bare H:MM with no AM/PM is AMBIGUOUS — resolved
   against prevMin (the previous timed row): pick the AM-or-PM reading that keeps the day moving forward,
   since these lists are chronological. So 9:00 first → AM, 7:00 after 3:00 → PM, 11:00 after 7 PM → PM.
   "AM" anchors to 6:00 so it collapses once the day's rolling; "After"/"—" stay unhidden forever. */
function ovMin(s, prevMin){
  const raw = String(s||'').trim();
  /* "AM" = a done-this-morning status row; treat as timed at 6:00 so it folds into "N done" after dawn */
  if(/^am$/i.test(raw)) return {m:360, timed:true};
  const hm = /^~?\s*(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(raw);
  if(hm){
    const hRaw=+hm[1], h12=hRaw%12, mm=+hm[2], ap=hm[3];
    if(ap){ const h=/pm/i.test(ap)? h12+12 : h12; return {m:h*60+mm, timed:true}; }
    /* bare hour, no AM/PM — AMBIGUOUS. Resolve CHRONOLOGICALLY so the list stays ordered whether the day
       starts in the morning or the afternoon: pick the reading (AM or PM) that is >= the previous timed
       row and closest to it. First row (prev<0): a bare 7-12 defaults to AM (mornings start early); a bare
       1-6 defaults to PM (his day has nothing 1-6 AM — minyan/gym own that window). Best practice for NEW
       overrides: write an explicit "AM"/"PM" and skip the guessing entirely. */
    const am=h12*60+mm, pm=(h12+12)*60+mm;
    const prev = (typeof prevMin==='number')? prevMin : -1;
    let m;
    if(prev<0){ m = (hRaw>=1&&hRaw<=6)? pm : am; }
    else if(am>=prev) m=am;      // earliest reading that doesn't go backwards
    else if(pm>=prev) m=pm;
    else m=am;
    return {m, timed:true};
  }
  return {m:1441, timed:false}; // "After", "—", anything untimed → sorts last, never hidden
}
const nowMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };

/* -- rest timer: absolute deadline, patched by a 1 s ticker, never re-renders -- */
const REST = {end:0, wasLive:false};
let AC = null; /* shared AudioContext, primed inside the user-gesture arm so iOS lets it sound later */
function armRest(sec){
  REST.end = Date.now()+sec*1000;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  tickRest();
}
function stopRest(){ REST.end = 0; tickRest(); }
function tickRest(){
  const chips = [document.getElementById('restChip'), document.getElementById('zbRest'), document.getElementById('timerDisp')];
  const remS = Math.ceil((REST.end - Date.now())/1000);
  const live = REST.end>0 && remS>-25;
  if(REST.end>0 && remS<=0 && REST.wasLive){ REST.wasLive=false; beep(); }
  if(REST.end>0 && remS>0) REST.wasLive = true;
  if(REST.end>0 && remS<=-25) REST.end = 0;
  chips.forEach(c=>{
    if(!c) return;
    const isDisp = c.id==='timerDisp';
    if(!live){ c.textContent = isDisp? '--:--' : ''; c.classList.remove('go','live','done'); return; }
    c.classList.add('live');
    if(remS<=0){ c.textContent = isDisp? 'GO' : 'GO — lift'; c.classList.add(isDisp?'done':'go'); }
    else { c.textContent = `${Math.floor(remS/60)}:${String(remS%60).padStart(2,'0')}`; c.classList.remove('go','done'); }
  });
}

/* -- time-aware zone order: the hour decides what sits under the NOW hero -- */
function zoneOrder(){
  const m = nowMin(), wd = new Date().getDay();
  const glM = gymLeaveMin(wd);
  const lift = glM!=null? glM+15 : null;
  const wo = workoutFor(wd, store.get('qpcut.loc','deal'));
  const sesh = seshGet(isoToday());
  const liftLive = sesh && sesh.start && !sesh.end;
  const inLiftWindow = wo && lift!=null && wd!==6 && m>=lift-75 && m<=lift+150;
  const eating = (m>=560&&m<=720) || (m>=770&&m<=930) || (m>=1140&&m<=1380); /* bf · lunch · dinner+snack */
  const dinnerPrep = m>=960 && m<1140;
  if(liftLive || inLiftWindow) return ['lift','log','food','tools'];
  if(eating)                   return ['log','food','lift','tools'];
  if(dinnerPrep)               return ['food','log','lift','tools'];
  return ['lift','food','log','tools'];
}

/* -- tiny sparkline -- */
function sparkHTML(vals, w, h, color){
  w=w||96; h=h||30; color=color||'var(--brass)';
  const v = vals.filter(x=>x!=null);
  if(v.length<2) return '';
  const min = Math.min(...v), max = Math.max(...v), span = (max-min)||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-3-(x-min)/span*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}

      <span class="sub" style="display:block;margin-top:4px">Optional swaps (pick one, or neither):<br>• Want a full extra slice? Fine — but leave ¼ of the rice/potatoes on the pot.<br>• Skipping the half-slice? You earned +2 oz extra protein or +17 g rice (dry) — add it when the feast is cooked… or <b>2 level Tbsp of hummus instead of 1</b>.<br>• <b>Pita night instead?</b> Hamotzi piece + <b>one FULL pita (your 190-cal ones)</b> — it replaces the half-slice AND the feast’s pita slot. No other challah. (Sticking with challah? Then it’s ½ pita at the feast.)</span></span></li>

  </details>`:''}

  /* ---- LOG zone (super-card: tiles + hydration + dials + stack) ---- */
  const logZone = (()=>{
    const tiles = SLOTS.map(s=>{
      const pickedId = todayEaten[s.key];

    const firstOpen = tiles.find(t=>!t.picked && !t.skip);
    const tileHTML = tiles.map(({s,picked,skip,time})=>`
      <button class="mtile${picked?' done':''}${skip?' done':''}${(!picked&&!skip&&firstOpen&&firstOpen.s.key===s.key)?' next':''}${expandSlot===s.key?' exp':''}" data-mtile="${s.key}">
        <span class="mt-t">${time} · ${s.slot}</span>
        <span class="mt-n">${skip?'Skipped → feast':picked?picked.name:'—'}</span>
        <span class="mt-m">${picked?`${picked.vars[0].t[0]} · ${picked.vars[0].t[1]}P`:`${s.b[0]} budget`}</span>
      </button>`).join('');
    const panel = expandSlot? (()=>{
      const s = SLOTS.find(x=>x.key===expandSlot);
      if(!s) return '';
      const noMeat = isNoMeat(ld);
      const pill = oo=>{
        const rem = Math.max(0,(counts[oo.id]||0) - eatenCountThisWeek(oo.id,s.key));
        const on = todayEaten[s.key]===oo.id;
        const meatBlock = noMeat && isMeatOpt(oo) && !on;
        return `<button class="mealpick${on?' on':''}${meatBlock?' nomeat':''}" data-slot="${s.key}" data-opt="${oo.id}">
          ${meatBlock?'🚫 ':''}${oo.name}${meatBlock?'<span class="rem">Nine Days</span>':counts[oo.id]?`<span class="rem">${on?'✓':rem+' left'}</span>`:''}</button>`;
      };
      const picks = s.opts.filter(oo=>(counts[oo.id]||0)>0 || todayEaten[s.key]===oo.id);
      const list = (picks.length?picks:s.opts).map(pill).join('');
      /* lunch ⇄ dinner run near-identical budgets — a skipped dinner can be logged as lunch */
      const sib = expandSlot==='lu'? 'di' : expandSlot==='di'? 'lu' : null;
      let swapRow = '';
      if(sib){
        const s2 = SLOTS.find(x=>x.key===sib);
        const picks2 = s2.opts.filter(oo=>((counts[oo.id]||0)>0 || todayEaten[s.key]===oo.id) && !s.opts.some(x=>x.id===oo.id));
        if(picks2.length) swapRow = `<div class="slotlbl" style="margin-top:8px">↔ ${s2.slot.toLowerCase()} swaps · same budget</div><div class="pickrow">${picks2.map(pill).join('')}</div>`;
      }
      /* off-menu FRESH options (no weekly count, not already eaten) — cook-tonight one-offs still need a tap */
      const freshRow = (()=>{
        const fresh = s.opts.filter(oo=>!(counts[oo.id]||0) && todayEaten[s.key]!==oo.id && !picks.includes(oo) && /fresh/i.test(oo.name));
        return fresh.length? `<div class="slotlbl" style="margin-top:8px">🍳 fresh tonight · off the weekly menu</div><div class="pickrow">${fresh.map(pill).join('')}</div>` : '';
      })();
      return `<div class="slotlbl" style="margin-top:10px">${s.slot} — tap what you ate</div><div class="pickrow">${list}</div>${freshRow}${swapRow}`;
    })() : '';
    return `
  <section class="zone" id="z-log">
  <div class="zhead"><span class="zt">✏️ Log</span><span class="zn">${backfill?`backfill ${ld}`:'today'}</span></div>
  <div class="card" id="mealLog">
    <div class="pickrow" style="margin:0">
      ${menuWeekDates().filter(dd=>dd<=isoToday()).map(dd=>{
        const wd2 = new Date(dd+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
        return `<button class="mealpick${dd===ld?' on':''}" data-ld="${dd}">${wd2} ${+dd.slice(8)}</button>`;
      }).join('')}
      <input type="date" id="ldPick" value="${ld}" max="${isoToday()}" style="padding:6px 8px;font-size:13px" aria-label="Log a different date">
    </div>
    ${backfill?`<div class="note" style="margin:10px 0 0">Backfill mode — everything below saves to <b>${ld}</b>.</div>`:''}
    <div class="mtiles">${tileHTML}</div>
    ${panel}
    <details class="acc innerrow" data-acc="log-hydr"${openAcc.has('log-hydr')?' open':''}>
      <summary><span>💧 Hydration</span><span class="statline"><span class="pbar mini"><span class="pfill" style="width:${Math.min(100,oz/128*100)}%"></span></span><b>${oz}</b>/128 oz</span></summary>
      ${DRINKS.map(([id,name,size])=>`
        <div class="mrow"><span class="nm">${name} <span class="daytag">${size}</span></span>
          <span class="stepper">

      <div class="water-label">${oz} / 128 oz${oz>=128?' · 🎉 gallon done':''} · plus 10k steps minimum</div>
    </details>
    <details class="acc innerrow" data-acc="log-dials"${openAcc.has('log-dials')?' open':''}>
      <summary><span>🎛 Daily dials</span><span class="statline">⚡${dl.e||'–'} · 🍽${dl.h||'–'} · 🩹${dl.s||'–'}</span></summary>
      <div id="dialCard">
      ${[['e','⚡ Energy'],['h','🍽 Hunger'],['s','🩹 Soreness']].map(([k,lbl])=>`
        <div class="mrow"><span class="nm">${lbl}</span>
          <span style="display:flex;gap:6px">${[1,2,3,4,5].map(v=>`<button class="setdot${(dl[k]||0)>=v?' on':''}" data-dial="${k}" data-v="${v}" aria-label="${lbl} ${v}"></button>`).join('')}</span>
        </div>`).join('')}
      <div class="sub" style="margin-top:8px">1 low · 5 high — feeds Sunday’s analysis.</div>
      </div>
    </details>
    <details class="acc innerrow" data-acc="log-stack"${openAcc.has('log-stack')?' open':''}>
      <summary><span>💊 Stack</span><span class="statline"><b>${done.length}</b>/${SUPPS.length}</span></summary>
      <div id="suppList">
      ${SUPPS.map(([n,w],i)=>`
        <button class="suppitem${done.includes(i)?' done':''}" data-i="${i}">
          <span class="box">${done.includes(i)?'✓':''}</span>
          <span class="nm">${n}</span><span class="when">${w}</span>
        </button>`).join('')}
      </div>
    </details>
  </div>
  </section>`;
  })();

  /* ---- TOOLS zone ---- */
  const toolsZone = (()=>{
    const eo = (store.get('qpcut.eatout',{}))[ld];
    const ops = (store.get('qpcut.offplan',{}))[ld]||[];
    const qs = store.get('qpcut.askq',[]);
    const todos = store.get('qpcut.todos',[]);
    const buys = store.get('qpcut.buytoday',[]);
    const gLeft = stillToBuyItems().length;
    const doneN = todos.filter(x=>x.done).length;
    let eoBlock = '';
    if(eo){
      const v = EATOUT[eo.v]||EATOUT.restdairy;
      const banks = eo.banks || [...(eo.bankL?['lu']:[]), ...(eo.bankS?['sn']:[]), 'di'];
      const budget = banks.reduce((a,k)=>a+(SLOT_BUDGET[k]?SLOT_BUDGET[k][0]:0),0);
      const bankNames = banks.map(k=>SLOT_BUDGET[k]?SLOT_BUDGET[k][1]:k).join(' + ');
      eoBlock = `
  <div class="card" style="border-color:color-mix(in srgb,var(--brass) 40%,transparent)">
    <div class="slotlbl" style="margin-top:0">🍽 Tonight’s plan: ${v.name}</div>
    <div class="budget"><span>Budget: <b>${budget}</b> kcal <span class="daytag">(${bankNames})</span></span></div>
    ${budget>700?'<div class="note" style="margin-top:8px">Bridge shake ~3 hrs before: Fairlife 320 mL + 1 FULL scoop (45P) — never arrive starving.</div>':''}
    <ul class="sched" style="margin-top:8px">${v.rules.map((r,i)=>`<li><span class="t">${i+1}</span><span>${r}</span></li>`).join('')}</ul>
    <div class="formrow"><button class="btn ghost" id="eoClear">Clear</button></div>
  </div>`;
    }
    return `
  <section class="zone" id="z-tools">
  <div class="zhead"><span class="zt">🧰 Tools</span></div>
  ${eoBlock}
  ${eo?'':`
  <details class="card acc" data-acc="eatout"${openAcc.has('eatout')?' open':''} id="eoCard">
    <summary><h3 style="display:inline;font-size:16px">🍽 Eating out / special meal?</h3> ${tchip('tap to plan it')}</summary>
    <div class="formrow" style="margin-top:10px">
      <select id="eoVenue">${Object.entries(EATOUT).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select>
    </div>
    <div class="slotlbl" style="margin-top:10px">Which meals am I skipping for it?</div>
    <div class="pickrow">
      ${Object.entries(SLOT_BUDGET).map(([k,[cal,nm]])=>`
        <button class="mealpick${k==='di'?' on':''}" data-bank="${k}">skipping ${nm}</button>`).join('')}
    </div>
    <div class="formrow"><button class="btn" id="eoGo">Build my plan</button></div>
  </details>`}

  ${(()=>{
    const sel = store.get('qpcut.draftsel','');
    const sm = DRAFT_SLOT_MEALS[sel];
    return `
  <details class="card acc" data-acc="draftmeal"${openAcc.has('draftmeal')?' open':''} id="draftCard">
    <summary><h3 style="display:inline;font-size:16px">✏️ Draft me a meal</h3> ${tchip('15 min · exact slot macros')}</summary>
    <div class="slotlbl" style="margin-top:10px">Which meal?</div>
    <div class="pickrow">
      ${Object.entries(SLOT_BUDGET).map(([k,[cal,nm]])=>`
        <button class="mealpick${sel===k?' on':''}" data-dbank="${k}">${nm}</button>`).join('')}
    </div>
    ${sm? `
    <div class="budget" style="margin-top:8px"><span><b>${sm.t}</b></span></div>
    ${Object.entries(sm.lanes).map(([lane,arr])=>{
      const t = Array.isArray(arr)? weekPick(arr) : arr;
      return `
      <details class="acc" data-acc="draft-${lane}"${openAcc.has('draft-'+lane)?' open':''} style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
        <summary><b>${t.n}</b> <span class="ingmac">${t.mac}</span></summary>
        <ul class="ing">${t.ing.map(([n,q])=>`<li><span>${n}</span><span class="q">${q}</span></li>`).join('')}</ul>
        <ul class="sched" style="margin-top:6px">${t.st.map((s,i)=>`<li><span class="t">${i+1}</span><span>${s}</span></li>`).join('')}</ul>
      </details>`;
    }).join('')}
    <div class="sub" style="margin-top:8px">Options rotate every Sunday. Want something else? Copy this straight to Claude:</div>
    ${(()=>{
      const lanes = Object.keys(sm.lanes).map(l=>l==='dairy'?'dairy':l==='meat'?'meat':'pareve').join(' or ');
      const prompt = `Draft me a ${SLOT_BUDGET[sel][1]} — ${sm.t.split('· ').slice(1).join(' / ').replace('target ','')}. Kosher (${lanes}), no nuts except almonds, ready in 15 min, exact brands + gram weights per your usual standard. I'm in the mood for: `;
      return `
    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px;font-size:13px;font-family:var(--mono)" id="draftPrompt">${esc(prompt)}___</div>
    <div class="formrow"><button class="btn ghost" id="cpPrompt" data-prompt="${esc(prompt)}">📋 Copy prompt</button></div>`;
    })()}` : '<div class="sub" style="margin-top:8px">Pick the slot — recipes appear matched to its exact macros.</div>'}
  </details>`;
  })()}

  <details class="card acc" data-acc="offplan"${openAcc.has('offplan')?' open':''} id="opCard">
    <summary><h3 style="display:inline;font-size:16px">🍪 Snacked off-plan?</h3>${ops.length?`<span class="statline"><b>${ops.length}</b> today</span>`:` ${tchip('log it, fix it')}`}</summary>
    ${(()=>{
      return `
    ${ops.map((o,i)=>{
      if(!o.cal || o.cal<=40){
        return `
      <div class="noteitem"><div class="meta"><span class="chip notetag">~${o.cal||'?'} cal</span>
        <span class="d">🟢 noise — nothing to offset</span>
        <button class="xdel" data-opx="${i}" aria-label="delete">×</button></div>
        <p>${esc(o.text)}</p>
        <div class="sub">Under ~40 cal doesn’t move the needle. Logged for the record, carry on.</div>
      </div>`;
      }
      const chosen = o.fixes||[];
      const covered = FIXPOOL.filter(([l])=>chosen.includes(l)).reduce((a,[,c])=>a+c,0);
      return `
      <div class="noteitem"><div class="meta"><span class="chip notetag off">~${o.cal} cal</span>
        <span class="d">${chosen.length? `offset −${covered}${covered>=o.cal?' ✓ covered':` (need ~${o.cal-covered} more)`}`:'pick where it comes off ↓'}</span>
        <button class="xdel" data-opx="${i}" aria-label="delete">×</button></div>
        <p>${esc(o.text)}</p>
        <div class="pickrow" style="margin-top:6px">
          ${FIXPOOL.map(([l,c],fi)=>`<button class="mealpick${chosen.includes(l)?' on':''}" data-opfix="${i}|${fi}">${l} <span class="rem">−${c}</span></button>`).join('')}
        </div>
        ${chosen.length && covered<o.cal? `<div class="coachline" style="text-align:left">→ still ~${o.cal-covered} short — pick another, or tell Claude to trim tomorrow</div>`:''}
      </div>`;
    }).join('')}
    <div class="formrow" style="margin-top:8px">
      <input type="text" id="opText" placeholder="What was it?" style="flex:1;font-family:var(--body)">
      <input type="number" id="opCal" placeholder="~cal" inputmode="numeric" style="width:84px">
    </div>
    <div class="formrow"><button class="btn" id="opAdd">Log it</button>
      <span class="sub">No idea on calories? Ask Claude first.</span></div>`;
    })()}
  </details>

  <details class="card acc" data-acc="askq"${openAcc.has('askq')?' open':''} id="askqCard">
    <summary><h3 style="display:inline;font-size:16px">💬 Ask Q</h3><span class="statline">${qs.length?`<b>${qs.length}</b> queued`:'nothing queued'}</span></summary>
    ${(qs.length? qs.map((q,i)=>`
      <div class="noteitem"><div class="meta"><span class="d">${q.d.slice(5)}</span>
        <button class="xdel" data-qx="${i}" aria-label="delete">×</button></div>
        <p>${esc(q.text)}</p></div>`).join('') : '<div class="sub" style="margin-top:8px">Anything you want to ask Q this week — jot it the second you think of it. It lands in Sunday’s report automatically.</div>')}
    <div class="formrow">
      <input type="text" id="askqText" placeholder="Question for Q…" style="flex:1;font-family:var(--body)">
      <button class="btn" id="askqAdd">Add</button>
    </div>
  </details>

  <div class="card" id="errCard">
    <div class="slotlbl" style="margin-top:0">✅ To-dos & quick buys</div>
    ${todos.map((b,i)=>`
      <button class="buyitem${b.done?' done':''}" data-todi="${i}">
        <span class="box">${b.done?'✓':''}</span><span class="nm">${esc(b.t)}</span>
        <span class="xdel" data-todx="${i}" role="button" aria-label="delete">×</span>
      </button>`).join('')}
    ${buys.map((b,i)=>`
      <button class="buyitem${b.done?' done':''}" data-ti="${i}">
        <span class="box">${b.done?'✓':''}</span><span class="nm">🛒 ${esc(b.name)}</span>
        <span class="xdel" data-tx="${i}" role="button" aria-label="delete">×</span>
      </button>`).join('')}
    <div class="formrow">
      <input type="text" id="errText" placeholder="Add a to-do or an item…" style="flex:1;font-family:var(--body)">
      <button class="btn ghost" id="todoAdd">To-do</button>
      <button class="btn ghost" id="tbuyAdd">Buy</button>
      <button class="btn" id="gbuyAdd">🔄 Grocery</button>
    </div>
    <div class="formrow" style="margin-top:6px">
      ${doneN?`<button class="btn ghost" id="todoClear" style="padding:6px 10px;font-size:12px">clear done (${doneN})</button>`:''}
      ${gLeft?`<span class="sub">🛒 <b>${gLeft}</b> unchecked on the grocery list — full list lives in Prep</span>`:''}
    </div>
    <div class="sub" style="margin-top:6px"><b>To-do</b> = task · <b>Buy</b> = today’s errand · <b>🔄 Grocery</b> = onto the Sunday shopping list. Synced phone ↔ computer.</div>
  </div>
  ${(now.getDay()===5||now.getDay()===4)?`<div style="display:flex;justify-content:flex-end;margin-top:2px"><button class="btn ghost" id="printSat" style="font-size:12.5px">🖨 Print Saturday card</button></div>`:''}
  </section>`;
  })();

  /* zones reorder with the clock — lift hours put Lift on top, meal windows put Log/Food up.
     NOW always leads; backfill keeps the neutral order. Order refreshes on every render
     (any tap, tab switch, or return to foreground). */
  const Z = {lift:liftZone, food:foodZone, log:logZone, tools:toolsZone};
  const order = backfill? ['lift','food','log','tools'] : zoneOrder();
  return `
  <div class="today-sub"><span>${d.sub} · ${dateStr}</span>
    ${daysToRace>0?tchip(`🏁 race in ${daysToRace}d`):''}</div>
  <div class="today-date">${dTitle}</div>
  ${nowZone}
  ${order.map(k=>Z[k]).join('\n')}`;
}
function ingRow([n,q,m]){
  return `<li style="display:block;padding:5px 0">
    <div style="display:flex;justify-content:space-between;gap:12px"><span>${n}</span><span class="q">${q}</span></div>
    ${m?`<div class="ingmac">${m[0]} cal · ${m[1]}P · ${m[2]}C · ${m[3]}F</div>`:''}
  </li>`;
}
function viewMeals(){
  return `<h2 class="sec" style="margin-top:14px">The cookbook · tap any meal — ingredients, macros &amp; method inside · all weights RAW / dry</h2>` +
  SLOTS.map(s=>`
   <section data-slotsec="${s.key}">
   <h2 class="sec" style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
     <span>${s.slot} <span style="text-transform:none;letter-spacing:0;color:var(--muted)">· ${s.time}</span></span>
     <span style="font-weight:400;color:var(--muted);white-space:nowrap">${s.b[0]} · ${s.b[1]}P budget</span>

/* ---------- chart ---------- */
function drawTrack(){
  const entries = allWeights();
  const c = $('#wchart'); if(!c||!entries.length) return;
  const dpr = window.devicePixelRatio||1;
  const W = c.clientWidth||460, H = 170;
  c.width = W*dpr; c.height = H*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const withW = entries.filter(e=>e.w!=null);
  const ws = withW.map(e=>e.w);
  const min = ws.length? Math.min(...ws)-1 : 170, max = ws.length? Math.max(...ws)+1 : 190;
  const sVals = entries.filter(e=>e.s!=null).map(e=>e.s);
  const sMax = Math.max(10, ...(sVals.length?sVals:[10]))+2;
  const L=34,R=34,T=8,B=18;
  const x = i => L + i*(W-L-R)/Math.max(entries.length-1,1);
  const y = v => T + (max-v)*(H-T-B)/(max-min);
  const ys = v => T + (sMax-v)*(H-T-B)/sMax;
  ctx.font = '10px ui-monospace,monospace';
  ctx.strokeStyle = 'rgba(155,152,139,.18)';
  for(let g=0; g<4; g++){
    const v = min + (max-min)*g/3, gy = y(v);
    ctx.beginPath(); ctx.moveTo(L,gy); ctx.lineTo(W-R,gy); ctx.stroke();
    ctx.fillStyle = '#d9a441'; ctx.fillText(v.toFixed(1), 2, gy+3);
    const sv = sMax*g/3;
    ctx.fillStyle = '#7fa8c9'; ctx.fillText(sv.toFixed(0)+'k', W-R+4, ys(sv)+3);
  }
  /* steps line (right axis) */
  ctx.strokeStyle = 'rgba(127,168,201,.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); let pen=false;
  entries.forEach((e,i)=>{
    if(e.s==null){ pen=false; return; }
    pen ? ctx.lineTo(x(i),ys(e.s)) : ctx.moveTo(x(i),ys(e.s));
    pen = true;
  });
  ctx.stroke(); ctx.setLineDash([]);
  /* daily weight (skips days logged without a weight) */
  ctx.strokeStyle = 'rgba(155,152,139,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); let pw=false;
  entries.forEach((e,i)=>{
    if(e.w==null){ pw=false; return; }
    pw?ctx.lineTo(x(i),y(e.w)):ctx.moveTo(x(i),y(e.w)); pw=true;
  });
  ctx.stroke();
  /* 7-entry rolling avg over weighted days */
  ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2;
  ctx.beginPath(); let pa=false;
  entries.forEach((e,i)=>{
    const s7 = entries.slice(Math.max(0,i-6),i+1).filter(q=>q.w!=null);
    if(!s7.length){ pa=false; return; }
    const avg = s7.reduce((a,b)=>a+b.w,0)/s7.length;
    pa?ctx.lineTo(x(i),y(avg)):ctx.moveTo(x(i),y(avg)); pa=true;
  });
  ctx.stroke();
  const last = withW[withW.length-1];
  if(last){
    const li = entries.indexOf(last);
    ctx.fillStyle = '#d9a441';
    ctx.beginPath(); ctx.arc(x(li),y(last.w),3,0,7); ctx.fill();
    ctx.fillText(last.w.toFixed(1), Math.min(x(li)-14,W-64), y(last.w)-7);
  }

  /* weekly averages — current week included (his call, July 9) */
  const wk = new Map();
  entries.forEach(e=>{ const k=weekOf(e.d); if(!wk.has(k)) wk.set(k,[]); wk.get(k).push(e); });
  const rows = [...wk.entries()].sort((a,b)=>a[0]-b[0]).map(([k,es])=>{
    const wv = es.filter(e=>e.w!=null);
    const avg = wv.length? wv.reduce((a,b)=>a+b.w,0)/wv.length : null;
    const st = es.filter(e=>e.s!=null);
    const sAvg = st.length? (st.reduce((a,b)=>a+b.s,0)/st.length):null;
    return {k,avg,sAvg};
  });
  $('#wkTable').innerHTML = `<tr><th>Week</th><th>avg lbs</th><th>Δ</th><th>steps avg</th></tr>` +
    rows.map((r,i)=>{
      const p = i? rows[i-1].avg : null;
      const d = (r.avg!=null&&p!=null)? (r.avg-p) : null;
      const dTxt = d===null?'—':`<span class="${d<=0?'delta-dn':'delta-up'}">${d>0?'+':''}${d.toFixed(2)}</span>`;
      return `<tr><td>Wk ${r.k}</td><td>${r.avg!=null?r.avg.toFixed(1):'—'}</td><td>${dTxt}</td><td>${r.sAvg?r.sAvg.toFixed(1)+'k':'—'}</td></tr>`;
    }).join('');
  /* 🎯 goal ETA from the last 3 completed weekly averages */
  const eta = $('#etaCard');
  if(eta){
    const curWk2 = weekOf(isoToday());
    const full = rows.filter(r=>r.avg!=null && r.k<curWk2);
    if(full.length>=3){
      const a = full[full.length-1], b = full[full.length-3];
      const rate = (a.avg-b.avg)/2; /* lb per week, negative = losing */
      const cur = full[full.length-1].avg;
      if(rate<-0.05){
        const wk165 = (cur-165)/(-rate), wk160 = (cur-160)/(-rate);
        const dISO = w => { const d = new Date(); d.setDate(d.getDate()+Math.round(w*7));
          return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
        eta.innerHTML = `<div class="note" style="margin-top:12px">🎯 <b>Trend: ${rate.toFixed(2)} lb/wk.</b> At this pace: <b>165 around ${cur<=165?'— you’re there':dISO(wk165)}</b> · <b>160 around ${cur<=160?'— there':dISO(wk160)}</b>. Recalculates every completed week.</div>`;
      } else {
        eta.innerHTML = `<div class="note" style="margin-top:12px">🎯 Trend over the last 3 weeks is flat (${rate>=0?'+':''}${rate.toFixed(2)} lb/wk) — no ETA. First lever: steps back to 11–12k; then it’s a Q conversation.</div>`;
      }
    }
  }
}

function weekReport(){
  const wk = qWeekDates(); /* Q week Mon→Sun — on Sunday this is the week ENDING today */
  const entries = allWeights().filter(e=>wk.includes(e.d));
  const eaten = store.get('qpcut.eaten',{});
  const notes = store.get('qpcut.notes',[]).filter(n=>wk.includes(n.d));
  const counts = store.get('qpcut.menucounts',{});
  const lines = [`WEEK REPORT (Mon→Sun) ${wk[0]} → ${wk[6]}`,''];
  wk.forEach(d=>{
    const day = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const e = entries.find(x=>x.d===d);
    const m = eaten[d]||{};
    const meals = ['pre','bf','lu','sn','di'].map(k=>m[k]&&OPTBYID[m[k]]?OPTBYID[m[k]].name:null).filter(Boolean).join(' / ');
    const parts = [];
    if(e){ if(e.w!=null)parts.push(e.w.toFixed(1)+' lb'); if(e.s!=null)parts.push(e.s+'k steps'); if(e.sl!=null)parts.push(e.sl+'h sleep'); }
    if(meals) parts.push('ate: '+meals);
    const dl = store.get('qpcut.dials.'+dkey(d),{});
    if(dl.e||dl.h||dl.s) parts.push(`dials E${dl.e||'·'}/H${dl.h||'·'}/S${dl.s||'·'}`);
    const rpe = store.get('qpcut.rpe.'+dkey(d),0);
    if(rpe) parts.push(`session RPE ${rpe}/5`);
    const eo = (store.get('qpcut.eatout',{}))[d];
    if(eo){
      const bk = (eo.banks||[]).filter(k=>k!=='di').map(k=>SLOT_BUDGET[k]?SLOT_BUDGET[k][1]:k);
      parts.push(`dining out: ${(EATOUT[eo.v]||{}).name||eo.v}${bk.length?` (skipped ${bk.join(' + ')})`:''}`);
    }
    ((store.get('qpcut.offplan',{}))[d]||[]).forEach(o=>parts.push(`off-plan: ${o.text}${o.cal?` ~${o.cal} cal`:''}${(o.fixes&&o.fixes.length)?` (offset: ${o.fixes.join('; ')})`:''}`));
    if(parts.length) lines.push(`${day} ${d.slice(5)}: ${parts.join(' · ')}`);
  });
  const menuSet = Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`${OPTBYID[k]?OPTBYID[k].name:k} ×${v}`);
  if(menuSet.length){ lines.push('','Menu this week: '+menuSet.join(', ')); }
  const ups = weekGoUps();
  if(ups.length){ lines.push('', `GO UPs this week (${ups.length}): ${ups.join(', ')}`); }
  const loc = store.get('qpcut.loc','deal');
  wk.forEach(d=>{
    const rp = store.get('qpcut.reps.'+dkey(d),{});
    if(!Object.keys(rp).length) return;
    const wo = workoutFor(new Date(d+'T12:00:00').getDay(), loc);
    const day = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const exLines = Object.entries(rp).map(([i,arr])=>{
      const core = /^core(\d+)$/.exec(i);
      const ex = core? CORE.ex[+core[1]] : (wo? wo.ex[+i] : null);
      if(!ex||!arr||!arr.some(v=>v!=null)) return null;
      const nm = ex[0].replace(/<[^>]*>/g,'');
      const v = verdict(arr, parseTargets(ex[1]));
      return `- ${nm}${core?' (core)':''}: ${arr.map(x=>x==null?'·':x).join('/')}${v?` → ${v==='up'?'GO UP':v==='down'?'LIGHTEN':'hold'}`:''}`;
    }).filter(Boolean);
    if(exLines.length){ lines.push('', `Lift ${day} (${wo?wo.tag:'Core / extra'}):`, ...exLines); }
  });
  if(notes.length){ lines.push('','Notes:'); notes.forEach(n=>lines.push(`- [${n.tag} ${n.d.slice(5)}] ${n.text}`)); }
  const askq = store.get('qpcut.askq',[]);
  if(askq.length){ lines.push('','Questions for Q:'); askq.forEach(q=>lines.push(`- ${q.text}`)); }
  return lines.join('\n');
}

function render(){
  /* the app can sit open overnight — when the calendar day flips, snap back to today */
  const tISO = isoToday();
  if(renderDay===null) renderDay = tISO;
  else if(renderDay!==tISO){

    yk.forEach(k=>{ try{ const s=JSON.parse(localStorage.getItem(k)); if(s&&s.start&&!s.end){ s.end=s.start; localStorage.setItem(k,JSON.stringify(s)); } }catch(e){} });
  }

/* swipe between tabs — ignores pinch-zoom gestures and touches that start on inputs */
let sx=0, sy=0, swipeOk=false, multiTouch=false;
document.addEventListener('touchstart',e=>{
  if(e.touches.length>1){ multiTouch=true; swipeOk=false; return; }
  /* never hijack a touch that starts in a field or inside anything that scrolls sideways
     (meal tiles, zone-chip bar, wide tables) — those own their horizontal gesture */
  if(e.target.closest('input,select,textarea,.mtiles,.zonebar,[data-hscroll]')){ swipeOk=false; return; }
  swipeOk = true;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(multiTouch){ if(e.touches.length===0) multiTouch=false; return; }
  if(!swipeOk) return;
  swipeOk = false;
  if(window.visualViewport && window.visualViewport.scale > 1.05) return; /* zoomed in — don't hijack */
  const dx = e.changedTouches[0].clientX-sx, dy = e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>2.2*Math.abs(dy)){
    const i = ORDER.indexOf(current);
    if(dx<0 && i<ORDER.length-1) setTab(ORDER[i+1],'l');
    if(dx>0 && i>0) setTab(ORDER[i-1],'r');
  }
},{passive:true});
