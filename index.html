      wDays.querySelectorAll('.mealpick').forEach(x=>x.classList.toggle('on', x.dataset.wd===$('#wDate').value));
    });
  }
  $('#wAdd').addEventListener('click',()=>{
    const btn = $('#wAdd');
    const d = $('#wDate').value;
    const w = parseFloat($('#wLbs').value), s = parseFloat($('#wSteps').value), sl = parseFloat($('#wSleep').value);
    if(!d || (isNaN(w)&&isNaN(s)&&isNaN(sl))){
      btn.textContent='Enter a number first';
      setTimeout(()=>{ if($('#wAdd')) $('#wAdd').textContent='Log'; },1600);
      return;
    }
    const prev = allWeights().find(e=>e.d===d) || {};
    const user = store.get('qpcut.weights',[]).filter(e=>e.d!==d);
    user.push({d,
      w: isNaN(w) ? (prev.w!=null?prev.w:null) : w,
      s: isNaN(s) ? (prev.s!=null?prev.s:null) : s,
      sl: isNaN(sl) ? (prev.sl!=null?prev.sl:null) : sl});
    store.set('qpcut.weights',user);
    render();
  });
  $('#wkCopy').addEventListener('click',async()=>{
    const txt = weekReport();
    try{ await navigator.clipboard.writeText(txt); $('#wkCopy').textContent='✓ Copied — paste it to Claude'; }
    catch(e){
      const ta = document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); $('#wkCopy').textContent='✓ Copied — paste it to Claude'; }
      catch(e2){ alert(txt); } ta.remove();
    }
  });
  $('#nAdd').addEventListener('click',()=>{
    const text = $('#nText').value.trim(); if(!text) return;
    const notes = store.get('qpcut.notes',[]);
    notes.push({d: isoToday(), tag: $('#nTag').value, text});
    store.set('qpcut.notes',notes); render();
  });
  $('#noteList').addEventListener('click',e=>{
    const del = e.target.closest('[data-nx]'); if(!del) return;
    const notes = store.get('qpcut.notes',[]);
    notes.splice(+del.dataset.nx,1);
    store.set('qpcut.notes',notes); render();
  });
  const syGo = $('#syGo');
  if(syGo) syGo.addEventListener('click', async ()=>{
    const t = $('#syTok').value.trim();
    if(!t){ alert('Paste the token first.'); return; }
    syGo.disabled = true; syncStatus('⏳ connecting…');
    try{ await syncConnect(t); render(); }
    catch(e){ syncDisconnect(); syncStatus('⚠ '+e.message+' — token wrong, expired, or missing the gist permission'); syGo.disabled = false; }
  });
  const syNow = $('#syNow');
  if(syNow) syNow.addEventListener('click', ()=>syncNow());
  const syOff = $('#syOff');
  if(syOff) syOff.addEventListener('click', ()=>{
    if(confirm('Disconnect cloud sync on THIS device? Your data stays here — it just stops syncing.')){ syncDisconnect(); render(); }
  });
  const dumpData = ()=>{
    const out = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(syncable(k)) out[k] = localStorage.getItem(k); /* sync token/meta never leave in a backup file */
    }
    return JSON.stringify(out);
  };
  const applyData = txt=>{
    const obj = JSON.parse(txt);
    let n = 0;
    /* patched setItem stamps each imported key as fresh, so a restore beats stale cloud copies */
    Object.entries(obj).forEach(([k,v])=>{ if(syncable(k)){ localStorage.setItem(k,v); n++; } });
    alert(`Imported ${n} data blocks ✓`);
    render();
  };
  $('#expData').addEventListener('click',()=>{
    const now = new Date(), pad = x=>String(x).padStart(2,'0');
    const name = `the-cut-backup-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    const blob = new Blob([dumpData()], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    store.set('qpcut.lastexport', isoToday());
    $('#expData').textContent = '✓ Exported ' + name.slice(15,-5);
  });
  $('#impFile').addEventListener('click',()=>$('#impFilePick').click());
  $('#impFilePick').addEventListener('change',e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ try{ applyData(rd.result); }catch(err){ alert('That file didn’t parse as a backup.'); } };
    rd.readAsText(f);
    e.target.value = '';
  });
  $('#impData').addEventListener('click',()=>{
    const txt = prompt('Paste the data blob:');
    if(!txt) return;
    try{ applyData(txt); }catch(e){ alert('That didn’t parse — make sure you pasted the whole blob.'); }
  });
  $('#phAdd').addEventListener('click',()=>$('#phFile').click());
  $('#phFile').addEventListener('change',async e=>{
    const files = [...e.target.files]; if(!files.length) return;
    const shrink = f => new Promise(res=>{
      const img = new Image();
      img.onload = async ()=>{
        const MAX = 900;
        const sc = Math.min(1, MAX/Math.max(img.width,img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        await addPhoto({d:new Date().toISOString(), img: cv.toDataURL('image/jpeg',.72)});
        URL.revokeObjectURL(img.src); res();
      };
      img.onerror = ()=>{ URL.revokeObjectURL(img.src); res(); };
      img.src = URL.createObjectURL(f);
    });
    for(const f of files) await shrink(f); /* sequential — parallel canvases crash older iPhones */
    $('#phFile').value='';
    drawPhotos();
  });
}
render();
/* cloud sync: pull on open, then again whenever the app is left or re-entered
   (the 8 s edit-debounce inside syncTouch covers mid-session pushes) */
if(syncCfg().gist) syncNow();
document.addEventListener('visibilitychange', ()=>{ if(syncCfg().gist){ clearTimeout(syncTimer); syncNow(); } });

/* ============ v14 boot: zone-bar delegation + live tick singletons ============ */
(function(){
  const zb = document.getElementById('zoneBar');
  if(zb){
    zb.addEventListener('click', e=>{
      const j = e.target.closest('[data-jump]');
      if(j){
        /* rest days have no lift zone — land on the top of the day instead of a dead tap */
        const el = document.getElementById(j.dataset.jump) || document.getElementById('z-now');
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
        return;
      }
      const kf = e.target.closest('[data-kf]');
      if(kf){
        mealKF = mealKF===kf.dataset.kf? null : kf.dataset.kf;
        zb.querySelectorAll('[data-kf]').forEach(c=>c.classList.toggle('on', c.dataset.kf===mealKF));
        applyMealFilter();
      }
    });
    zb.addEventListener('input', e=>{
      if(e.target && e.target.id==='mealSearch'){ mealQ = e.target.value; applyMealFilter(); }
    });
  }
  /* RIR chips delegated once — refreshGuides() swaps their DOM, delegation survives it */
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-rir]'); if(!b) return;
    const [rd,ex,n] = b.dataset.rir.split('|');
    const key = 'qpcut.rir.'+dkey(rd);
    const m = store.get(key,{});
    m[ex] = m[ex]===+n? null : +n;
    store.set(key,m); refreshGuides();
  });
  /* NOW-strip action + nudge snooze are delegated — the strip's innerHTML is patched by the ticker */
  document.addEventListener('click', e=>{
    const a = e.target.closest('[data-nact-tab],[data-nact-jump],[data-nact-sesh]');
    if(a){
      if(a.dataset.nactSesh){ seshStart(); return; }
      if(a.dataset.nactTab){ setTab(a.dataset.nactTab); return; }
      if(a.dataset.nactSlot){ expandSlot = a.dataset.nactSlot; }
      if(a.dataset.nactAcc){ openAcc.add(a.dataset.nactAcc); }
      if(a.dataset.nactSlot || a.dataset.nactAcc) render();
      const el = document.getElementById(a.dataset.nactJump);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    const tpl = e.target.closest('[data-tlpast]');
    if(tpl){ const tl=document.getElementById('dayTL'); if(tl && tl.classList){ tl.classList.toggle('showpast'); tickNow(); } return; }
    const sn = e.target.closest('[data-nsnooze]');
    if(sn){ try{ sessionStorage.setItem('nudge.'+sn.dataset.nsnooze+'.'+isoToday(),'1'); }catch(err){} tickNow(); }
  });
  if(window.NOW_INT) clearInterval(window.NOW_INT);
  window.NOW_INT = setInterval(tickNow, 30000);
  if(window.REST_INT) clearInterval(window.REST_INT);
  window.REST_INT = setInterval(tickRest, 1000);
  /* foreground catch-up: everything live is absolute-time, so one tick reconciles it */
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ tickNow(); tickRest(); } });
})();

/* ---------- self-updater (works on the real site; no-op on cached artifact) ---------- */
const BUILD = 'b1784489726';
async function checkUpdate(manual){
  try{
    const res = await fetch(location.pathname + '?u=' + Math.random(), {cache:'no-store'});
    const txt = await res.text();
    const m = /const BUILD = '([^']+)'/.exec(txt);
    if(m && m[1] !== BUILD && m[1] !== '__BUILD__'){
      if(document.getElementById('updBar')) return;
      const b = document.createElement('button');
      b.id = 'updBar'; b.className = 'btn';
      b.textContent = '⬆ Update ready — tap to reload';
      b.style.cssText = 'position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.5)';
      b.addEventListener('click',()=>location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])));
      document.body.appendChild(b);
    } else if(manual){ alert(m ? 'You’re on the latest version ✓' : 'Couldn’t read the server version.'); }
  }catch(e){ if(manual) alert('Couldn’t check — are you offline?'); }
}
const updLink = document.getElementById('updChk');
if(updLink) updLink.addEventListener('click',e=>{ e.preventDefault(); checkUpdate(true); });
setTimeout(()=>checkUpdate(false), 1500);
