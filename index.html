<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171915">
<title>The Cut</title>
</head>
<body style="margin:0">

<style>
  :root{
    --ink:#171915; --panel:#20231d; --panel2:#282b24; --line:#33362e;
    --text:#eae6da; --muted:#9b988b; --brass:#d9a441; --brass-dim:#8a6a2e;
    --meat:#c4674f; --dairy:#7fa8c9; --pareve:#8faa72;
    --disp:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
    --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{background:var(--ink);color:var(--text);font-family:var(--body);
       font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;padding:0 16px 110px}

  header.top{padding:calc(16px + env(safe-area-inset-top,0px)) 2px 12px;
       display:flex;flex-direction:column;gap:10px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:22px;margin:0;letter-spacing:.2px}
  .brand h1 span{color:var(--brass)}
  .brand .coach{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .macrostrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mcell{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:8px 10px;text-align:center}
  .mcell .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;
            font-size:17px;color:var(--brass)}
  .mcell .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:1px}

  h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
         margin:26px 2px 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin-bottom:12px}
  .card h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
  .card .sub{color:var(--muted);font-size:13px;margin-top:2px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
        letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;
        border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--muted)}
  .chip.meat{color:var(--meat);border-color:color-mix(in srgb,var(--meat) 45%,transparent)}
  .chip.meat::before{background:var(--meat)}
  .chip.dairy{color:var(--dairy);border-color:color-mix(in srgb,var(--dairy) 45%,transparent)}
  .chip.dairy::before{background:var(--dairy)}
  .chip.pareve{color:var(--pareve);border-color:color-mix(in srgb,var(--pareve) 45%,transparent)}
  .chip.pareve::before{background:var(--pareve)}
  .chip.time{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 40%,transparent)}
  .chip.time::before{display:none}
  .chip.notetag::before{display:none}
  .chip.off{color:var(--meat);border-color:color-mix(in srgb,var(--meat) 45%,transparent)}
  .chip.hw{color:var(--dairy);border-color:color-mix(in srgb,var(--dairy) 45%,transparent)}

  .opt{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .opt:first-of-type{border-top:none;margin-top:8px;padding-top:0}
  .opt .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .opt .head b{font-size:15px;font-weight:650}
  .varlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-top:8px}
  .ing{margin:8px 0 0;padding:0;list-style:none}
  .ing li{display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;font-size:14px}
  .ing li .q{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);
             font-size:12.5px;text-align:right;max-width:58%;overflow-wrap:anywhere}
  .totals{display:flex;gap:14px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
          font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
  .totals b{color:var(--brass);font-weight:700}
  .budget{display:flex;gap:14px;font-family:var(--mono);font-variant-numeric:tabular-nums;
          font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
  .budget b{color:var(--text);font-weight:600}

  .today-date{font-family:var(--disp);font-weight:800;font-size:30px;margin:4px 0 0;letter-spacing:.2px}
  .today-sub{color:var(--brass);font-weight:600;font-size:15px;margin-top:2px;display:flex;
             justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .sched{margin:10px 0 0;padding:0;list-style:none}
  .sched li{display:flex;gap:10px;padding:4px 0;font-size:14.5px;align-items:baseline}
  .sched li .t{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass);
               font-size:12.5px;min-width:64px;flex-shrink:0}
  .note{background:color-mix(in srgb,var(--brass) 10%,transparent);
        border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);
        color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
  .mealtimes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

  .timer-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  input,textarea,select{
        background:var(--panel2);border:1px solid var(--line);color:var(--text);
        border-radius:9px;padding:8px 10px;font-family:var(--mono);font-size:16px;
        color-scheme:dark}
  textarea{font-family:var(--body);width:100%;min-height:64px;resize:vertical}
  button{font-family:var(--body);cursor:pointer}
  .btn{background:var(--brass);color:#241c08;border:none;border-radius:9px;
       padding:9px 14px;font-weight:700;font-size:14px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn:focus-visible,.tab:focus-visible,.dot:focus-visible,.seg button:focus-visible,
  .suppitem:focus-visible,.buyitem:focus-visible,input:focus-visible,textarea:focus-visible,
  select:focus-visible,.xdel:focus-visible,.pgrid button:focus-visible,.mealpick:focus-visible,
  .step:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .dairy-ok{font-family:var(--mono);font-size:15px;margin-top:10px}
  .dairy-ok b{color:var(--dairy)}

  .setdot{width:26px;height:26px;border-radius:99px;border:1.5px solid var(--line);
       background:var(--panel2);padding:0;flex-shrink:0;transition:background .15s,border-color .15s}
  .setdot.on{background:var(--brass);border-color:var(--brass)}
  input.repin{width:52px;text-align:center;padding:7px 2px;font-size:16px}
  input.prw2{width:72px;text-align:center;padding:6px 2px;font-size:16px}
  .coachline{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
       color:var(--brass);text-align:right;margin-top:6px;line-height:1.5}
  .setrow{display:grid;grid-template-columns:24px 88px 14px 60px;gap:7px;align-items:center;
       justify-content:end;margin-top:6px}
  .setrow.noreps{grid-template-columns:24px 88px}
  .setrow .slab{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
  .setrow .x{color:var(--muted);font-size:11px;text-align:center}
  input.wti{width:88px;text-align:center;padding:7px 2px;font-size:16px}
  input.rpi{width:60px;text-align:center;padding:7px 2px;font-size:16px;
       border-color:color-mix(in srgb,var(--brass) 55%,var(--line))}
  select.exsel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:5px 8px;font-size:16px;font-family:var(--body)}
  .holdflag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);
        border:1px solid var(--line);border-radius:6px;padding:2px 6px;text-transform:uppercase;white-space:nowrap}
  .downflag{font-size:10px;font-weight:700;letter-spacing:.08em;color:#241c08;background:var(--meat);
        border-radius:6px;padding:2px 6px;text-transform:uppercase;white-space:nowrap}
  .water{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  .dot{width:34px;height:34px;border-radius:99px;border:1.5px solid var(--line);
       background:var(--panel2);padding:0;transition:background .15s,border-color .15s}
  .dot.on{background:var(--dairy);border-color:var(--dairy)}
  .water-label{font-size:12px;color:var(--muted);margin-top:8px}

  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);
       border-radius:11px;padding:3px;gap:3px;margin:4px 0 14px}
  .seg button{border:none;background:transparent;color:var(--muted);border-radius:8px;
       padding:9px 0;font-weight:650;font-size:14px}
  .seg button.on{background:var(--brass);color:#241c08}
  .rules{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 14px;letter-spacing:.02em}
  .ex{margin:8px 0 0;padding:0;list-style:none}
  .ex li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14.5px;
         border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);align-items:center}
  .ex li:first-child{border-top:none}
  .ex li .r{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass);
            font-size:12.5px;flex-shrink:0;text-align:right}
  .daytag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .upflag{font-size:10px;font-weight:700;letter-spacing:.08em;color:#241c08;background:var(--pareve);
          border-radius:6px;padding:2px 6px;margin-left:6px;text-transform:uppercase;white-space:nowrap}
  input.prw{width:118px;font-size:13px;padding:6px 8px;text-align:right}

  .suppitem,.buyitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
            background:transparent;border:none;color:var(--text);font-size:15px;
            padding:9px 2px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .suppitem:first-of-type,.buyitem:first-of-type{border-top:none}
  .suppitem .box,.buyitem .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
            flex-shrink:0;display:flex;align-items:center;justify-content:center;
            font-size:14px;color:#241c08;background:var(--panel2)}
  .suppitem.done .box,.buyitem.done .box{background:var(--pareve);border-color:var(--pareve)}
  .suppitem.done .nm,.buyitem.done .nm{color:var(--muted);text-decoration:line-through}
  .suppitem .when,.buyitem .q{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.06em;
            text-transform:uppercase;flex-shrink:0;font-family:var(--mono)}
  .xdel{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px;flex-shrink:0}

  /* menu builder + meal picking */
  .mrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px;
        border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .mrow:first-of-type{border-top:none}
  .mrow .nm{flex:1}
  .stepper{display:flex;align-items:center;gap:2px}
  .step{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
        color:var(--text);font-size:17px;font-weight:700;padding:0;line-height:1}
  .stepn{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:26px;text-align:center;
         font-size:15px;font-weight:700;color:var(--brass)}
  .slotlbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
           margin:12px 0 4px;font-weight:600}
  .slotlbl:first-of-type{margin-top:2px}
  .pickrow{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 2px}
  .mealpick{border:1px solid var(--line);background:var(--panel2);color:var(--text);
        border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
  .mealpick .rem{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
  .mealpick.on{background:var(--brass);border-color:var(--brass);color:#241c08}
  .mealpick.on .rem{color:#5c4715}

  .pbar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;
        margin-top:12px;overflow:hidden}
  .pfill{height:100%;background:var(--dairy);border-radius:99px;transition:width .2s}
  canvas#wchart{width:100%;height:170px;display:block}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:5px}
  .legend .sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  table.wk{width:100%;border-collapse:collapse;font-family:var(--mono);
           font-variant-numeric:tabular-nums;font-size:13px;margin-top:6px}
  table.wk td,table.wk th{padding:6px 4px;text-align:right;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  table.wk th{color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.1em;
              text-transform:uppercase;border-top:none}
  table.wk td:first-child,table.wk th:first-child{text-align:left}
  .delta-dn{color:var(--pareve)} .delta-up{color:var(--meat)}
  .formrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .formrow input[type=number]{width:86px}
  .formrow input[type=date]{width:150px}

  .wdays{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:12px}
  .wdays .mealpick{padding:8px 0;text-align:center;white-space:nowrap;font-size:12.5px}
  .logform{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .logform .full{grid-column:1 / -1}
  .logform label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
  .logform input{width:100%;max-width:100%;min-width:0;text-align:center;box-sizing:border-box;
       -webkit-appearance:none;appearance:none}
  .noteitem{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:10px 0}
  .noteitem:first-of-type{border-top:none}
  .noteitem .meta{display:flex;gap:8px;align-items:center;margin-bottom:4px}
  .noteitem .meta .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .noteitem p{margin:0;font-size:14.5px;white-space:pre-wrap}

  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .pgrid .ph{position:relative}
  .pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;
             border:1px solid var(--line)}
  .pgrid .xdel{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);border-radius:7px;
               color:#fff;line-height:1}
  .pgrid button.view{padding:0;border:none;background:none;width:100%}
  .overlay{position:fixed;inset:0;background:rgba(10,11,9,.93);z-index:50;display:flex;
           align-items:center;justify-content:center;padding:16px}
  .overlay img{max-width:100%;max-height:90vh;border-radius:12px}

  .timer-disp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:44px;
              font-weight:700;color:var(--brass);text-align:center;margin:6px 0 2px}
  .timer-disp.done{color:var(--pareve)}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--ink) 88%,black);
       backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
       border-top:1px solid var(--line);z-index:10;
       padding-bottom:env(safe-area-inset-bottom,0)}
  nav.tabs .row{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .tab{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;
       letter-spacing:.1em;text-transform:uppercase;padding:19px 0 17px}
  .tab.on{color:var(--brass)}
  footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:34px;letter-spacing:.03em}
  footer a{color:var(--brass)}
  /* collapsible sections */
  details.acc summary{cursor:pointer;list-style:none;position:relative;padding-right:22px}
  details.acc summary::-webkit-details-marker{display:none}
  details.acc summary::after{content:'▾';position:absolute;right:2px;top:2px;color:var(--muted);
       transition:transform .15s}
  details.acc[open] summary::after{transform:rotate(180deg)}
  /* tab slide */
  @keyframes slideL{from{opacity:.35;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:.35;transform:translateX(-26px)}to{opacity:1;transform:none}}
  .anim-l{animation:slideL .18s ease-out}
  .anim-r{animation:slideR .18s ease-out}
  .ingmac{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);
       text-align:right;flex-shrink:0}
  #printZone{display:none}
  @media print{
    body.printing .app,body.printing nav.tabs{display:none!important}
    body.printing #printZone{display:block!important;background:#fff;color:#000;padding:20px;
        font-family:Georgia,serif}
    body.printing{background:#fff}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important}.anim-l,.anim-r{animation:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>THE <span>CUT</span></h1>
      <div class="coach">Cut Companion</div>
    </div>
    <div class="macrostrip" id="macroStrip">
      <div class="mcell"><div class="n">2220</div><div class="l">kcal</div></div>
      <div class="mcell"><div class="n">187</div><div class="l">protein</div></div>
      <div class="mcell"><div class="n">227</div><div class="l">carbs</div></div>
      <div class="mcell"><div class="n">64</div><div class="l">fat</div></div>
    </div>
  </header>
  <main id="view"></main>
  <footer>coach lives in the Claude app → <a href="https://claude.ai/code">Code tab</a></footer>
</div>

<div id="printZone"></div>
<nav class="tabs" aria-label="Sections"><div class="row">
  <button class="tab on" data-tab="today">Today</button>
  <button class="tab" data-tab="meals">Meals</button>
  <button class="tab" data-tab="prep">Prep</button>
  <button class="tab" data-tab="train">Train</button>
  <button class="tab" data-tab="track">Track</button>
</div></nav>

<script>
/* ---------- shared ---------- */
const K = {meat:'Meat', dairy:'Dairy', pareve:'Pareve'};
const chip = (k,txt) => `<span class="chip ${k}">${txt||K[k]}</span>`;
const tchip = t => `<span class="chip time">${t}</span>`;

/* ---------- meals: named options ---------- */
/* ing rows: [label, qty, [cal, P, C, F]] — per-ingredient macros from his sheet */
const SLOTS = [
 {key:'pre', slot:'Pre-Lift', time:'7:45 AM · Fri 3:30 PM', b:[200,16,32,1], opts:[
   {id:'p2', name:'Rice Cakes + Tuna', k:[['pareve']], vars:[{ing:[['Rice cakes (35 cal each)','3',[105,1,23,0]],['Tuna packet','1',[90,15,5,1]]], t:[195,16,28,1]}]},
   {id:'p3', name:'Rice Cakes + Yogurt', k:[['dairy']], vars:[{ing:[['Rice cakes (35 cal each)','3',[105,1,23,0]],['Oikos Triple Zero','1',[90,15,6,0]]], t:[195,16,29,0]}]},
   {id:'p4', name:'Ezekiel + Jelly', k:[['pareve']], vars:[{ing:[['Ezekiel bread','2 slices',[160,10,30,1]],['Sugar-free jelly','32 g',[20,0,10,0]]], t:[180,10,40,1]}]},
   {id:'p5', name:'Yogurt + Banana', k:[['dairy']], vars:[{ing:[['Oikos Triple Zero','1',[90,15,6,0]],['Banana','1 med',[110,1,27,0]]], t:[200,16,33,0]}]},
   {id:'p6', name:'Tuna + Banana', k:[['pareve']], vars:[{ing:[['Tuna packet','1',[90,15,5,1]],['Banana','1 med',[110,1,27,0]]], t:[200,16,32,1]}]},
 ]},

/* rep-scheme parsing + double-progression verdicts */
function parseTargets(r){
  if(/failure/i.test(r)) return null;
  const parts = r.replace('×','x').split('x');
  const sets = parseInt(parts[0])||3;
  const nums = ((parts[1]||'').match(/\d+/g)||[]).map(Number);
  if(!nums.length) return null;
  if(nums.length>=3 || (nums.length===2 && nums[0]>nums[1]))
    return {sets, per:nums, type:'ladder'};
  if(nums.length===2) return {sets, lo:nums[0], hi:nums[1], type:'range'};
  return {sets, lo:nums[0], hi:nums[0], type:'range'};
}
function verdict(reps, t){
  if(!t) return null;
  const rs = (reps||[]).slice(0,t.sets);
  if(rs.filter(v=>v!=null).length < t.sets) return null;
  if(t.type==='ladder')
    return rs.every((v,i)=>v >= (t.per[i]!=null?t.per[i]:t.per[t.per.length-1])) ? 'up' : 'hold';
  if(rs.every(v=>v>=t.hi)) return 'up';
  if(rs.every(v=>v<t.lo)) return 'down';
  return 'hold';
}

function prWeightsFor(ids){
  const pset = store.get('qpcut.prset',{});

  return (ids||[]).map(id=>{
    const it = prItemById(id); if(!it) return null;

    const val = arr.length? arr.join(' / ') : (legacy[id]!=null&&legacy[id]!==''? legacy[id] : it[2]);

    return `${ids.length>1? it[1].split(' ')[0].replace(',','')+' ':''}${val}`;
  }).filter(Boolean).join(' · ');

/* progression coaching helpers */
function jumpFor(w){ return w>=100? 10 : w>=50? 5 : 2.5; }
function r25(x){ return Math.round(x/2.5)*2.5; }
function lastSessions(dayIdx, exIdx, want){
  const out = []; const base = menuWeekDates()[dayIdx];
  for(let k=1;k<=8 && out.length<want;k++){
    const dt = new Date(base+'T12:00:00'); dt.setDate(dt.getDate()-7*k);
    const dISO = iso(dt);
    const rp = (store.get('qpcut.reps.'+dkey(dISO),{}))[exIdx];
    if(rp && rp.some(v=>v!=null)) out.push({date:dISO, reps:rp});
  }
  return out;
}
function lastSessionInfo(dayIdx, exIdx){ return lastSessions(dayIdx, exIdx, 1)[0] || null; }

function plateCombo(v){
  let rem = v; const out = [];
  for(const p of [45,35,25,10,5,2.5]){ while(rem >= p-0.01){ out.push(p); rem -= p; } }
  return out.length? out.join('+') + (rem>0.01? ` +${rem.toFixed(1)}`:'') : 'empty';
}
function prescribe(lv, baseVals, curVals, sets){
  const cur = (curVals||[]).slice(0,sets);
  const base = (baseVals&&baseVals.length? baseVals : cur).slice(0,sets);
  const nums = base.map(x=>parseFloat(x));
  const hasNums = nums.some(n=>!isNaN(n));
  const fmt = f => base.map((x,i)=> isNaN(nums[i])? (x||'?') : String(r25(f(nums[i])))).join(' / ');
  if(lv==='up'){
    const already = baseVals&&baseVals.length && JSON.stringify(base)!==JSON.stringify(cur.filter(x=>x!==undefined));
    if(already && cur.some(x=>x)) return `GO UP — already loaded: ${cur.filter(x=>x).join(' / ')} ✓`;
    return `GO UP → load ${hasNums? fmt(n=>n+jumpFor(n)) : 'the smallest jump on every set'}`;
  }
  if(lv==='down') return `LIGHTEN → ${hasNums? fmt(n=>n*0.9) : '~10% down'}`;
  return `SAME weight → ${cur.filter(x=>x).join(' / ')||base.filter(x=>x).join(' / ')||'repeat last loads'} · beat last week’s reps`;
}

  }
  const badge = v==='up'?'<div style="display:flex;justify-content:flex-end;margin-top:6px"><span class="upflag">⬆ go up next time</span></div>'
    : v==='down'?'<div style="display:flex;justify-content:flex-end;margin-top:6px"><span class="downflag">⬇ lighten ~10%</span></div>'
    : v==='hold'?'<div style="display:flex;justify-content:flex-end;margin-top:6px"><span class="holdflag">hold weight</span></div>':'';
  const legNote = (prId && !vals.some(x=>x) && leg)? `<div class="ingmac" style="text-align:right;margin-top:3px">was ${esc(String(leg))}</div>`:'';
  /* 🧮 plate math for flagged exercises */
  let pmLine = '';
  const pm = prId? PLATEMATH[prId] : null;
  if(pm){
    const parts = vals.slice(0,o.sets).map((x,i)=>{
      const n = parseFloat(x); if(isNaN(n)) return null;
      if(pm==='db') return `S${i+1}: ${Math.round(n/5)*5}s`;
      const side = pm==='bar'? (n-45)/2 : n;
      return side<=0? `S${i+1}: bar only` : `S${i+1}: ${plateCombo(side)}`;
    }).filter(Boolean);
    if(parts.length) pmLine = `<div class="ingmac" style="text-align:right;margin-top:4px">🧮 ${pm==='db'?'DBs':pm==='bar'?'45-lb bar · per side':'per side'} → ${parts.join(' · ')}</div>`;
  }
  return selHTML + coach + legNote + rows + armHTML + pmLine + nextAdv + badge;
}

function workoutFor(dayIdx, loc){
  const plan = loc==='deal' ? GYM : HOME;
  if(dayIdx===1) return plan.mon;
  if(dayIdx===2) return plan.tue;
  if(dayIdx===3) return plan.wed;
  if(dayIdx===5) return plan.fri;
  if(dayIdx===6) return loc==='deal' ? SAT_GRANDMA : SAT_HOME;
  return null;
}

/* auto run-coaching banners from the Runna plan; manual EVENTS for the day take priority */
function runCoaching(){
  if(EVENTS.some(e=>e.d===isoToday())) return [];
  const out = [];
  const now = new Date(), day = now.getDay();
  const rw = runnaWeek(now);
  if(!rw) return out;
  const miles = s => { const m = /([\d.]+)\s*mi/.exec(s); return m? parseFloat(m[1]) : null; };
  const thuMi = miles(rw[2]), sunDesc = rw[3], sunMi = miles(sunDesc);
  if(day===4 && thuMi){
    if(thuMi>=14) out.push({title:`🏃 Long run today — ${thuMi} mi · ~${Math.round(thuMi*10)}–${Math.round(thuMi*11.5)} min. Fueled run.`,
      msg:`<b>1:30 lunch:</b> Chicken Meal, pick RICE over sweet potato. <b>4:45 PM:</b> Ezekiel + SF jelly AND 1 banana (~290 cal / 65 C) + 16–24 oz water with a hydration stick. <b>Carry:</b> ${thuMi>=18?'3':'2'} kosher gels or ${thuMi>=18?'7-8':'5-6'} Medjool dates + the stick bottle. <b>During:</b> first fuel at minute 45, then every 30–35 min — never wait to feel bad. <b>Within 45 min after:</b> Fairlife 320 mL + ½ scoop as a shake, then dinner ~1 hr later (Poke Bowl if it’s in the menu). The mid-run fuel is EXTRA on top of 2,220 — mandatory, and it goes in the Sunday report to coach.`});
    else if(thuMi>=8) out.push({title:`🏃 Long run today — ${thuMi} mi · ~${Math.round(thuMi*10)}–${Math.round(thuMi*11.5)} min`,
      msg:`<b>4:30–5:00 PM:</b> Ezekiel + SF jelly (180 cal / 40 C) + 16 oz water with a hydration stick. <b>Carry:</b> 1 kosher gel or 2–3 Medjool dates — take at minute 45 if you’ll pass 90 minutes. <b>After:</b> eat the snack or dinner within 45 min of finishing — carbs + protein first, don’t wait until 10 PM starving. Any mid-run fuel is extra by design; log it in a note.`});
    else out.push({title:`🏃 Long run today — ${thuMi} mi · easy ~${Math.round(thuMi*10)} min`,
      msg:`<b>~5:00 PM:</b> Yogurt + Banana (Oikos + 1 banana, 200 cal) + 8–16 oz water. <b>Run:</b> conversational pace the whole way — if you can’t talk, slow down. No mid-run fuel needed. <b>After:</b> normal snack and dinner, nothing changes.`});
  }
  if(day===3 && thuMi>=10) out.push({title:`🏃 ${thuMi} mi long run tomorrow — set it up today`,
    msg:`<b>Eat every carb in the plan today — especially the 10 PM dinner carbs (they’re tomorrow’s fuel).</b> Add one extra 30 oz bottle to today’s gallon. Check you have gels/dates + 2 hydration sticks for tomorrow. Lights out by 11:30 — the run is only as good as tonight’s sleep.`});
  if(day===0 && sunDesc){
    if(sunDesc.includes('RACE')) out.push({title:'🏁 RACE DAY — 26.2', msg:'Full race-day plan comes from Claude race week — fueling schedule, breakfast timing, pacing. Nothing new today. Trust the taper.'});
    else if(sunMi) out.push({title:`🏃 Quality run this morning — ${sunDesc}`,
      msg:`<b>45–60 min before:</b> Yogurt + Banana (200 cal) + 8–16 oz water. <b>Warm up:</b> 5 min easy jog + 4 strides before the hard stuff — speed work on cold legs is how hamstrings pop. <b>Hit Runna’s paces, not faster.</b> After: breakfast as normal, then weigh-in report + prep day.`});
  }
  if(day===5 && thuMi>=12) out.push({title:`⚠️ Recovery watch — ${thuMi} mi yesterday`,
    msg:`Hockey + Legs #2 on tired legs today. <b>Breakfast: pick Bagel w/ Berries</b> (72 C, the biggest-carb option). Longer warmup at both sessions; on Legs #2, drop the last set of anything that gets ugly. Front-load water before Shabbat.`});
  return out;
}

function buildGrocery(counts){
  const agg = new Map();
  Object.entries(counts).forEach(([id,n])=>{
    if(!n || !GROC[id]) return;
    GROC[id].forEach(([grp,item,q,u])=>{
      const key = grp+'|'+item+'|'+u;
      agg.set(key,(agg.get(key)||0)+q*n);
    });
  });
  const out = {};
  [...agg.entries()].forEach(([key,q])=>{
    const [grp,item,u] = key.split('|');
    let disp;
    if(u==='oz') disp = q>=16? `${q} oz (~${(q/16).toFixed(1)} lb)` : `${q} oz`;
    else if(u==='g') disp = `${q} g`;
    else if(u==='ml') disp = `${q} mL (~${Math.ceil(q/1500)} bottle${q>1500?'s':''})`;
    else if(u==='slices') disp = `${q} slices`;
    else if(u==='serving') disp = `${q} serving${q>1?'s':''}`;
    else disp = `× ${q}`;
    (out[grp]=out[grp]||[]).push([item,disp]);
  });
  Object.values(out).forEach(list=>list.sort((a,b)=>a[0]<b[0]?-1:1));
  return out;
}

/* weekly recipe sets — full recipes, spice amounts scale with the menu.
   s = scale source: 'chix' = all chicken meals, 'l1' = sweet-potato chicken meals, null = per portion */
function tspF(x){
  if(x<0.2) return 'pinch';
  const q = Math.round(x*4)/4, w = Math.floor(q), r = +(q-w).toFixed(2);
  const f = {0:'',0.25:'¼',0.5:'½',0.75:'¾'}[r]||'';
  return `${w||''}${f} tsp`.trim();
}
function recipeCount(s,counts){
  if(s==='chix') return (counts.l1||0)+(counts.l1r||0);
  return s? (counts[s]||0) : 0;
}
function qtyF(q,u,n){
  const m = q*n;
  if(u==='tsp') return tspF(m);
  if(u==='oz') return `${m} oz${m>=16?` (~${(m/16).toFixed(1)} lb)`:''}`;
  if(u==='ct') return m===1?'1':`× ${m}`;
  if(u==='lemon') return m<=0.5?'squeeze':m<=1?'1':Math.ceil(m)+'';
  return `${Math.round(m)} ${u}`;
}

/* ---------- photos (IndexedDB) ---------- */
function pdb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('qpcut',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos',{autoIncrement:true});
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function addPhoto(rec){ const db=await pdb(); return new Promise(res=>{
  const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').add(rec); tx.oncomplete=res; }); }
async function getPhotos(){ const db=await pdb(); return new Promise(res=>{ const out=[];
  const c=db.transaction('photos').objectStore('photos').openCursor();
  c.onsuccess=e=>{ const cur=e.target.result; if(cur){ out.push({key:cur.key,...cur.value}); cur.continue(); } else res(out); }; }); }
async function delPhoto(key){ const db=await pdb(); return new Promise(res=>{
  const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').delete(key); tx.oncomplete=res; }); }

    e.stopPropagation();
    const buy = store.get('qpcut.buy',[]); buy.splice(+el.dataset.bx,1);
    store.set('qpcut.buy',buy); render();
  }));
  document.querySelectorAll('[data-bi]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-bx]')) return;
    const buy = store.get('qpcut.buy',[]);
    buy[+el.dataset.bi].done = !buy[+el.dataset.bi].done;
    store.set('qpcut.buy',buy); render();
  }));
}

/* ---------- chart ---------- */
function drawTrack(){
  const entries = allWeights();
  const c = $('#wchart'); if(!c||!entries.length) return;
  const dpr = window.devicePixelRatio||1;
  const W = c.clientWidth||460, H = 170;
  c.width = W*dpr; c.height = H*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const withW = entries.filter(e=>e.w!=null);
  const ws = withW.map(e=>e.w);
  const min = ws.length? Math.min(...ws)-1 : 170, max = ws.length? Math.max(...ws)+1 : 190;
  const sVals = entries.filter(e=>e.s!=null).map(e=>e.s);
  const sMax = Math.max(10, ...(sVals.length?sVals:[10]))+2;
  const L=34,R=34,T=8,B=18;
  const x = i => L + i*(W-L-R)/Math.max(entries.length-1,1);
  const y = v => T + (max-v)*(H-T-B)/(max-min);
  const ys = v => T + (sMax-v)*(H-T-B)/sMax;
  ctx.font = '10px ui-monospace,monospace';
  ctx.strokeStyle = 'rgba(155,152,139,.18)';
  for(let g=0; g<4; g++){
    const v = min + (max-min)*g/3, gy = y(v);
    ctx.beginPath(); ctx.moveTo(L,gy); ctx.lineTo(W-R,gy); ctx.stroke();
    ctx.fillStyle = '#d9a441'; ctx.fillText(v.toFixed(1), 2, gy+3);
    const sv = sMax*g/3;
    ctx.fillStyle = '#7fa8c9'; ctx.fillText(sv.toFixed(0)+'k', W-R+4, ys(sv)+3);
  }
  /* steps line (right axis) */
  ctx.strokeStyle = 'rgba(127,168,201,.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); let pen=false;
  entries.forEach((e,i)=>{
    if(e.s==null){ pen=false; return; }
    pen ? ctx.lineTo(x(i),ys(e.s)) : ctx.moveTo(x(i),ys(e.s));
    pen = true;
  });
  ctx.stroke(); ctx.setLineDash([]);
  /* daily weight (skips days logged without a weight) */
  ctx.strokeStyle = 'rgba(155,152,139,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); let pw=false;
  entries.forEach((e,i)=>{
    if(e.w==null){ pw=false; return; }
    pw?ctx.lineTo(x(i),y(e.w)):ctx.moveTo(x(i),y(e.w)); pw=true;
  });
  ctx.stroke();
  /* 7-entry rolling avg over weighted days */
  ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2;
  ctx.beginPath(); let pa=false;
  entries.forEach((e,i)=>{
    const s7 = entries.slice(Math.max(0,i-6),i+1).filter(q=>q.w!=null);
    if(!s7.length){ pa=false; return; }
    const avg = s7.reduce((a,b)=>a+b.w,0)/s7.length;
    pa?ctx.lineTo(x(i),y(avg)):ctx.moveTo(x(i),y(avg)); pa=true;
  });
  ctx.stroke();
  const last = withW[withW.length-1];
  if(last){
    const li = entries.indexOf(last);
    ctx.fillStyle = '#d9a441';
    ctx.beginPath(); ctx.arc(x(li),y(last.w),3,0,7); ctx.fill();
    ctx.fillText(last.w.toFixed(1), Math.min(x(li)-14,W-64), y(last.w)-7);
  }

  /* weekly averages — current week included (his call, July 9) */
  const wk = new Map();
  entries.forEach(e=>{ const k=weekOf(e.d); if(!wk.has(k)) wk.set(k,[]); wk.get(k).push(e); });
  const rows = [...wk.entries()].sort((a,b)=>a[0]-b[0]).map(([k,es])=>{
    const wv = es.filter(e=>e.w!=null);
    const avg = wv.length? wv.reduce((a,b)=>a+b.w,0)/wv.length : null;
    const st = es.filter(e=>e.s!=null);
    const sAvg = st.length? (st.reduce((a,b)=>a+b.s,0)/st.length):null;
    return {k,avg,sAvg};
  });
  $('#wkTable').innerHTML = `<tr><th>Week</th><th>avg lbs</th><th>Δ</th><th>steps avg</th></tr>` +
    rows.map((r,i)=>{
      const p = i? rows[i-1].avg : null;
      const d = (r.avg!=null&&p!=null)? (r.avg-p) : null;
      const dTxt = d===null?'—':`<span class="${d<=0?'delta-dn':'delta-up'}">${d>0?'+':''}${d.toFixed(2)}</span>`;
      return `<tr><td>Wk ${r.k}</td><td>${r.avg!=null?r.avg.toFixed(1):'—'}</td><td>${dTxt}</td><td>${r.sAvg?r.sAvg.toFixed(1)+'k':'—'}</td></tr>`;
    }).join('');
  /* 🎯 goal ETA from the last 3 completed weekly averages */
  const eta = $('#etaCard');
  if(eta){
    const curWk2 = weekOf(isoToday());
    const full = rows.filter(r=>r.avg!=null && r.k<curWk2);
    if(full.length>=3){
      const a = full[full.length-1], b = full[full.length-3];
      const rate = (a.avg-b.avg)/2; /* lb per week, negative = losing */
      const cur = full[full.length-1].avg;
      if(rate<-0.05){
        const wk165 = (cur-165)/(-rate), wk160 = (cur-160)/(-rate);
        const dISO = w => { const d = new Date(); d.setDate(d.getDate()+Math.round(w*7));
          return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
        eta.innerHTML = `<div class="note" style="margin-top:12px">🎯 <b>Trend: ${rate.toFixed(2)} lb/wk.</b> At this pace: <b>165 around ${cur<=165?'— you’re there':dISO(wk165)}</b> · <b>160 around ${cur<=160?'— there':dISO(wk160)}</b>. Recalculates every completed week.</div>`;
      } else {
        eta.innerHTML = `<div class="note" style="margin-top:12px">🎯 Trend over the last 3 weeks is flat (${rate>=0?'+':''}${rate.toFixed(2)} lb/wk) — no ETA. First lever: steps back to 11–12k; then it’s a Q conversation.</div>`;
      }
    }
  }
}

function weekReport(){
  const wk = menuWeekDates();
  const entries = allWeights().filter(e=>wk.includes(e.d));
  const eaten = store.get('qpcut.eaten',{});
  const notes = store.get('qpcut.notes',[]).filter(n=>wk.includes(n.d));
  const counts = store.get('qpcut.menucounts',{});
  const lines = [`WEEK REPORT ${wk[0]} → ${wk[6]}`,''];
  wk.forEach(d=>{
    const day = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const e = entries.find(x=>x.d===d);
    const m = eaten[d]||{};
    const meals = ['pre','bf','lu','sn','di'].map(k=>m[k]&&OPTBYID[m[k]]?OPTBYID[m[k]].name:null).filter(Boolean).join(' / ');
    const parts = [];
    if(e){ if(e.w!=null)parts.push(e.w.toFixed(1)+' lb'); if(e.s!=null)parts.push(e.s+'k steps'); if(e.sl!=null)parts.push(e.sl+'h sleep'); }
    if(meals) parts.push('ate: '+meals);
    const dl = store.get('qpcut.dials.'+dkey(d),{});
    if(dl.e||dl.h||dl.s) parts.push(`dials E${dl.e||'·'}/H${dl.h||'·'}/S${dl.s||'·'}`);
    const rpe = store.get('qpcut.rpe.'+dkey(d),0);
    if(rpe) parts.push(`session RPE ${rpe}/5`);
    const eo = (store.get('qpcut.eatout',{}))[d];
    if(eo){
      const bk = (eo.banks||[]).filter(k=>k!=='di').map(k=>SLOT_BUDGET[k]?SLOT_BUDGET[k][1]:k);
      parts.push(`dining out: ${(EATOUT[eo.v]||{}).name||eo.v}${bk.length?` (banked ${bk.join(' + ')})`:''}`);
    }
    ((store.get('qpcut.offplan',{}))[d]||[]).forEach(o=>parts.push(`off-plan: ${o.text}${o.cal?` ~${o.cal} cal`:''}${(o.fixes&&o.fixes.length)?` (offset: ${o.fixes.join('; ')})`:''}`));
    if(parts.length) lines.push(`${day} ${d.slice(5)}: ${parts.join(' · ')}`);
  });
  const menuSet = Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`${OPTBYID[k]?OPTBYID[k].name:k} ×${v}`);
  if(menuSet.length){ lines.push('','Menu this week: '+menuSet.join(', ')); }
  const loc = store.get('qpcut.loc','deal');
  wk.forEach(d=>{
    const rp = store.get('qpcut.reps.'+dkey(d),{});
    if(!Object.keys(rp).length) return;
    const wo = workoutFor(new Date(d+'T12:00:00').getDay(), loc);
    if(!wo) return;
    const day = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const exLines = Object.entries(rp).map(([i,arr])=>{
      const ex = wo.ex[+i]; if(!ex||!arr||!arr.some(v=>v!=null)) return null;
      const nm = ex[0].replace(/<[^>]*>/g,'');
      const v = verdict(arr, parseTargets(ex[1]));
      return `- ${nm}: ${arr.map(x=>x==null?'·':x).join('/')}${v?` → ${v==='up'?'GO UP':v==='down'?'LIGHTEN':'hold'}`:''}`;
    }).filter(Boolean);
    if(exLines.length){ lines.push('', `Lift ${day} (${wo.tag}):`, ...exLines); }
  });
  if(notes.length){ lines.push('','Notes:'); notes.forEach(n=>lines.push(`- [${n.tag} ${n.d.slice(5)}] ${n.text}`)); }
  const askq = store.get('qpcut.askq',[]);
  if(askq.length){ lines.push('','Questions for Q:'); askq.forEach(q=>lines.push(`- ${q.text}`)); }
  return lines.join('\n');
}

/* ---------- wiring ---------- */
const ORDER = ['today','meals','prep','train','track'];
const VIEWS = {today:viewToday, meals:viewMeals, prep:viewPrep, train:viewTrain, track:viewTrack};
let current = 'today';
let timerInt = null;
function setTab(t, dir){
  current = t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  render();
  if(dir){
    const v = $('#view');
    v.classList.remove('anim-l','anim-r');
    void v.offsetWidth;
    v.classList.add(dir==='l'?'anim-l':'anim-r');
  }
  window.scrollTo(0,0);
}
function render(){
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  $('#macroStrip').style.display = (current==='meals'||current==='prep') ? 'grid' : 'none';
  $('#view').innerHTML = VIEWS[current]();
  ({today:wireToday, prep:wirePrep, train:wireTrain, track:wireTrack}[current]||(()=>{}))();
  document.querySelectorAll('details.acc').forEach(d=>d.addEventListener('toggle',()=>{
    if(d.open) openAcc.add(d.dataset.acc); else openAcc.delete(d.dataset.acc);
  }));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  const dir = ORDER.indexOf(b.dataset.tab) > ORDER.indexOf(current) ? 'l' : 'r';
  setTab(b.dataset.tab, dir);
}));

/* swipe between tabs — ignores pinch-zoom gestures and touches that start on inputs */
let sx=0, sy=0, swipeOk=false, multiTouch=false;
document.addEventListener('touchstart',e=>{
  if(e.touches.length>1){ multiTouch=true; swipeOk=false; return; }
  if(e.target.closest('input,select,textarea')){ swipeOk=false; return; }
  swipeOk = true;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(multiTouch){ if(e.touches.length===0) multiTouch=false; return; }
  if(!swipeOk) return;
  swipeOk = false;
  if(window.visualViewport && window.visualViewport.scale > 1.05) return; /* zoomed in — don't hijack */
  const dx = e.changedTouches[0].clientX-sx, dy = e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>2.2*Math.abs(dy)){
    const i = ORDER.indexOf(current);
    if(dx<0 && i<ORDER.length-1) setTab(ORDER[i+1],'l');
    if(dx>0 && i>0) setTab(ORDER[i-1],'r');
  }
},{passive:true});

    store.set('qpcut.buytoday',t); render();
  });
  document.querySelectorAll('[data-tx]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    const t = store.get('qpcut.buytoday',[]); t.splice(+el.dataset.tx,1);
    store.set('qpcut.buytoday',t); render();
  }));
  document.querySelectorAll('[data-ti]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-tx]')) return;
    const t = store.get('qpcut.buytoday',[]);
    t[+el.dataset.ti].done = !t[+el.dataset.ti].done;
    store.set('qpcut.buytoday',t); render();
  }));
  wireBuy();
}
function wirePrep(){
  const cbStart = $('#cbStart'), cbNext = $('#cbNext'), cbReset = $('#cbReset');
  if(cbStart) cbStart.addEventListener('click',()=>{
    const cb = store.get('qpcut.creamibatch',{idx:0,started:null});
    cb.started = isoToday(); store.set('qpcut.creamibatch',cb); render();
  });
  if(cbReset) cbReset.addEventListener('click',()=>{
    const cb = store.get('qpcut.creamibatch',{idx:0,started:null});
    cb.started = isoToday(); store.set('qpcut.creamibatch',cb); render();
  });
  if(cbNext) cbNext.addEventListener('click',()=>{
    const cb = store.get('qpcut.creamibatch',{idx:0,started:null});
    cb.idx = (cb.idx+1)%CREAMI_BATCHES.length; cb.started = isoToday();
    store.set('qpcut.creamibatch',cb); render();
  });
  document.querySelectorAll('[data-inc],[data-dec]').forEach(b=>b.addEventListener('click',()=>{
    const counts = store.get('qpcut.menucounts',{});
    const id = b.dataset.inc||b.dataset.dec;
    counts[id] = Math.max(0,(counts[id]||0)+(b.dataset.inc?1:-1));
    store.set('qpcut.menucounts',counts); render();
  }));
  document.querySelectorAll('[data-gid]').forEach(b=>b.addEventListener('click',()=>{
    let g = store.get('qpcut.grocery',[]);
    const id = b.dataset.gid;
    g = g.includes(id) ? g.filter(x=>x!==id) : [...g,id];
    store.set('qpcut.grocery',g); render();
  }));
  $('#gReset').addEventListener('click',()=>{ store.set('qpcut.grocery',[]); render(); });
  wireBuy();
}
function beep(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; g.gain.value = .25;
    o.start(); o.stop(ac.currentTime+.6);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function wireTrain(){
  document.querySelectorAll('.seg button[data-loc]').forEach(b=>b.addEventListener('click',()=>{
    store.set('qpcut.loc', b.dataset.loc); render();
  }));
  document.querySelectorAll('.seg button[data-mode]').forEach(b=>b.addEventListener('click',()=>{
    store.set('qpcut.trainmode', b.dataset.mode); render();
  }));
  wireWeights();
  wireReps();
  document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{
    if(timerInt) clearInterval(timerInt);
    let left = +b.dataset.t;
    const disp = $('#timerDisp'); disp.classList.remove('done');
    const tick = ()=>{
      disp.textContent = `${String(Math.floor(left/60)).padStart(1,'0')}:${String(left%60).padStart(2,'0')}`;
      if(left<=0){ clearInterval(timerInt); timerInt=null; disp.textContent='GO'; disp.classList.add('done'); beep(); }
      left--;
    };
    tick(); timerInt = setInterval(tick,1000);
  }));
  $('#tStop').addEventListener('click',()=>{
    if(timerInt){ clearInterval(timerInt); timerInt=null; }
    const disp = $('#timerDisp'); disp.textContent='--:--'; disp.classList.remove('done');
  });
}
function wireTrack(){
  requestAnimationFrame(drawTrack);
  drawPhotos();
  const wDays = $('#wDays');
  if(wDays){
    wDays.addEventListener('click',e=>{
      const b = e.target.closest('[data-wd]'); if(!b) return;
      $('#wDate').value = b.dataset.wd;
      wDays.querySelectorAll('.mealpick').forEach(x=>x.classList.toggle('on', x===b));
    });
    $('#wDate').addEventListener('change',()=>{
      wDays.querySelectorAll('.mealpick').forEach(x=>x.classList.toggle('on', x.dataset.wd===$('#wDate').value));
    });
  }
  $('#wAdd').addEventListener('click',()=>{
    const btn = $('#wAdd');
    const d = $('#wDate').value;
    const w = parseFloat($('#wLbs').value), s = parseFloat($('#wSteps').value), sl = parseFloat($('#wSleep').value);
    if(!d || (isNaN(w)&&isNaN(s)&&isNaN(sl))){
      btn.textContent='Enter a number first';
      setTimeout(()=>{ if($('#wAdd')) $('#wAdd').textContent='Log'; },1600);
      return;
    }
    const prev = allWeights().find(e=>e.d===d) || {};
    const user = store.get('qpcut.weights',[]).filter(e=>e.d!==d);
    user.push({d,
      w: isNaN(w) ? (prev.w!=null?prev.w:null) : w,
      s: isNaN(s) ? (prev.s!=null?prev.s:null) : s,
      sl: isNaN(sl) ? (prev.sl!=null?prev.sl:null) : sl});
    store.set('qpcut.weights',user);
    render();
  });
  $('#wkCopy').addEventListener('click',async()=>{
    const txt = weekReport();
    try{ await navigator.clipboard.writeText(txt); $('#wkCopy').textContent='✓ Copied — paste it to Claude'; }
    catch(e){
      const ta = document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); $('#wkCopy').textContent='✓ Copied — paste it to Claude'; }
      catch(e2){ alert(txt); } ta.remove();
    }
  });
  $('#nAdd').addEventListener('click',()=>{
    const text = $('#nText').value.trim(); if(!text) return;
    const notes = store.get('qpcut.notes',[]);
    notes.push({d: isoToday(), tag: $('#nTag').value, text});
    store.set('qpcut.notes',notes); render();
  });
  $('#noteList').addEventListener('click',e=>{
    const del = e.target.closest('[data-nx]'); if(!del) return;
    const notes = store.get('qpcut.notes',[]);
    notes.splice(+del.dataset.nx,1);
    store.set('qpcut.notes',notes); render();
  });
  const dumpData = ()=>{
    const out = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('qpcut.')) out[k] = localStorage.getItem(k);
    }
    return JSON.stringify(out);
  };
  const applyData = txt=>{
    const obj = JSON.parse(txt);
    let n = 0;
    Object.entries(obj).forEach(([k,v])=>{ if(k.startsWith('qpcut.')){ localStorage.setItem(k,v); n++; } });
    alert(`Imported ${n} data blocks ✓`);
    render();
  };
  $('#expData').addEventListener('click',()=>{
    const now = new Date(), pad = x=>String(x).padStart(2,'0');
    const name = `the-cut-backup-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    const blob = new Blob([dumpData()], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    $('#expData').textContent = '✓ Exported ' + name.slice(15,-5);
  });
  $('#impFile').addEventListener('click',()=>$('#impFilePick').click());
  $('#impFilePick').addEventListener('change',e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ try{ applyData(rd.result); }catch(err){ alert('That file didn’t parse as a backup.'); } };
    rd.readAsText(f);
    e.target.value = '';
  });
  $('#impData').addEventListener('click',()=>{
    const txt = prompt('Paste the data blob:');
    if(!txt) return;
    try{ applyData(txt); }catch(e){ alert('That didn’t parse — make sure you pasted the whole blob.'); }
  });
  $('#phAdd').addEventListener('click',()=>$('#phFile').click());
  $('#phFile').addEventListener('change',e=>{
    const f = e.target.files[0]; if(!f) return;
    const img = new Image();
    img.onload = async ()=>{
      const MAX = 900;
      const sc = Math.min(1, MAX/Math.max(img.width,img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      await addPhoto({d:new Date().toISOString(), img: cv.toDataURL('image/jpeg',.72)});
      URL.revokeObjectURL(img.src);
      $('#phFile').value='';
      drawPhotos();
    };
    img.src = URL.createObjectURL(f);
  });
}
render();

/* ---------- self-updater (works on the real site; no-op on cached artifact) ---------- */
const BUILD = 'b1783554094';
async function checkUpdate(manual){
  try{
    const res = await fetch(location.pathname + '?u=' + Math.random(), {cache:'no-store'});
    const txt = await res.text();
    const m = /const BUILD = '([^']+)'/.exec(txt);
    if(m && m[1] !== BUILD && m[1] !== '__BUILD__'){
      if(document.getElementById('updBar')) return;
      const b = document.createElement('button');
      b.id = 'updBar'; b.className = 'btn';
      b.textContent = '⬆ Update ready — tap to reload';
      b.style.cssText = 'position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.5)';
      b.addEventListener('click',()=>location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])));
      document.body.appendChild(b);
    } else if(manual){ alert(m ? 'You’re on the latest version ✓' : 'Couldn’t read the server version.'); }
  }catch(e){ if(manual) alert('Couldn’t check — are you offline?'); }
}
const updLink = document.getElementById('updChk');
if(updLink) updLink.addEventListener('click',e=>{ e.preventDefault(); checkUpdate(true); });
setTimeout(()=>checkUpdate(false), 1500);
</script>
