    const cb = cs, batches = CREAMI_BATCHES, batch = cs.batch;
    const eatenN = cs.used;
    const left = Math.max(0, batch.cups.length - eatenN);
    const done = false;          /* rolled over automatically; a finished batch is never "current" */
    const nextBatch = cs.next;
    const cupHTML = cups => cups.map(([n,p,th,ex,top])=>`
      <div class="opt"><div class="head"><b>${n}</b></div>
        <ul class="ing">
          <li><span>Protein (½ scoop)</span><span class="q">${p}${ppTag(p,true)}</span></li>
          <li><span>Thickener</span><span class="q">${th}</span></li>
          <li><span>Extract</span><span class="q">${ex}</span></li>
          <li><span>Topping (after spin)</span><span class="q">${top}</span></li>
        </ul>
      </div>`).join('');
    return `
  <section id="p-creami">
  <div class="zhead"><span class="zt">④ Creami batch</span><span class="zn">${cb.started?`${left}/${batch.cups.length} in the freezer`:'not started'}</span></div>
  <details class="card acc" data-acc="creami"${openAcc.has('creami')?' open':''}>
    <summary><h3 style="display:inline;font-size:16px">${batch.name}</h3> ${tchip(cb.started?`${left}/${batch.cups.length} in the freezer`:'tap to open')}</summary>
    <div class="sub" style="margin-top:8px">Every cup: <b>320 mL Fairlife FF · 40 g Lakanto · ½ scoop protein · thickener · extract</b> → blend, lid, freeze 24 h. ≈210 cal / 32 P before topping; topping budget = the plan’s <b>140-cal mix-in</b>, added after the spin (all amounts sized to 140). Re-spin with a splash of Fairlife if crumbly. Counter runs off your Ninja Creami snack logs on Today. <b>Spin at eat time, not ahead</b> — a pre-spun cup refreezes icy. No machine that night (Shabbat, travel)? Spin it before, keep it in the freezer ≤ 2 h and eat it soft-ish, or make bark: spread the spun cup thin on parchment, freeze, snap into pieces — bark stays good for days.</div>
    ${done ? `
      <div class="note">🎉 ${batch.name} finished — <b>${nextBatch.name}</b> is up. Recipes below; hit the button once you’ve made them.</div>
      ${cupHTML(nextBatch.cups)}
      <div class="formrow"><button class="btn" id="cbNext">Made them — start ${nextBatch.name}</button></div>
    ` : `
      ${cupHTML(batch.cups)}
      <div class="formrow">${cb.started
        ? `<button class="btn ghost" id="cbReset">Remade this batch today (reset counter)</button>`
        : `<button class="btn" id="cbStart">Made them — start counting</button>`}</div>
    `}
    <div class="sub" style="margin-top:10px">Batch needs: ~2,560 mL Fairlife (2 big bottles) · 320 g Lakanto · 4 scoops total protein. Tell Claude the winners — he rewrites the queued batches.</div>
  </details>
  </section>`;
  })()}

  <section id="p-cor">
  <div class="zhead"><span class="zt">⑤ This week’s flavors</span><span class="zn">rotates Sunday</span></div>
  <details class="card acc" data-acc="cor"${openAcc.has('cor')?' open':''}>
    <summary><h3 style="display:inline;font-size:16px">Today: ${corFor(isoToday(), new Date().getDay())[0]}</h3> ${tchip('tap for the week')}</summary>
    ${weekPick(COR_SETS).map(([n,s],i)=>{
      const today = new Date().getDay()===i;
      /* a one-off COR_OVERRIDE has to show up HERE too, or this card and the Today card disagree */
      const swap = today? COR_OVERRIDE[isoToday()] : null;
      const [dn,ds] = swap || [n,s];
      return `<div class="opt"><div class="head"><b>${today?'▸ ':''}${dn}</b>${today?tchip(swap?'today · swapped in':'today'):''}</div>
        <div class="sub" style="margin-top:4px">${ds}${ppTag(ds)}</div>
        ${swap?`<div class="ingmac" style="margin-top:3px">rotation had ${n} — back to the normal cycle tomorrow</div>`:''}</div>`;
    }).join('')}
  </details>
  </section>
  <div class="note">Allergy card: all nuts are off-limits <b>except almonds</b>. Everything in the plan is already screened.</div>`;
}

function viewTrack(){
  const notes = store.get('qpcut.notes',[]);
  const tagcls = t => t==='Off-track'?'off':(t==='HW'?'hw':'time');
  const entries = allWeights();
  const curWk = weekOf(isoToday());
  const thisWeek = entries.filter(e=>weekOf(e.d)===curWk);
  const eaten = store.get('qpcut.eaten',{});
  const thisWeekRows = thisWeek.map(e=>{
    const day = new Date(e.d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    return `<tr><td>${day} ${e.d.slice(5).replace('-','/')}</td><td>${e.w!=null?e.w.toFixed(1):'—'}</td>
      <td>${e.s!=null?e.s.toFixed(1)+'k':'—'}</td><td>${e.sl!=null?sleepFmt(e.sl):'—'}</td></tr>`;
  }).join('');
  const withW = entries.filter(e=>e.w!=null);
  const lastE = withW.length? withW[withW.length-1] : null;
  /* ⭐ THE HERO NUMBER IS *THIS WEEK'S* AVERAGE (Mon→Sun, partial weeks included) — not a
     trailing 7 days. His call Aug 10 2026: "this is showing the past 7 days avg. i dont want
     that. make it show this current weeks avg." The Δ compares it to the previous week's
     average, so it is week-vs-week on the same basis the Sunday report uses.
     ⚠️ A partial week can rest on ONE weigh-in, so the weigh-in COUNT rides along with the
     number. An average of 1 rendered to look like an average of 7 is exactly the
     confidently-wrong class of defect the guard suites exist to catch. */
  const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
  const wkW = n => entries.filter(e=>weekOf(e.d)===n && e.w!=null).map(e=>e.w);
  const curVals = wkW(curWk), prevVals = wkW(curWk-1);
  const aCur = avg(curVals), aPrev = avg(prevVals);
  const delta = (aCur!=null && aPrev!=null)? aCur-aPrev : null;
  const firstW = withW.length? withW[0].w : null;
  const GOAL = 165;
  const goalPct = (firstW!=null && aCur!=null && firstW>GOAL)? Math.max(0,Math.min(100,(firstW-aCur)/(firstW-GOAL)*100)) : 0;
  const isSun = new Date().getDay()===0;

  /* ⭐ EVERY LOGGED DAY, rolled up month → week → day (his ask Aug 10 2026: "add a drop down
     where i could see every single days logs, and within that roll up, have roll ups for months
     and weeks"). Newest first at all three levels, because the recent past is what he actually
     re-reads. All three levels are plain openAcc-gated <details>, so they start CLOSED.
     ⚠️ A calendar week can straddle two months (Jul 27–Aug 2), so the same week number appears
     under BOTH months with only that month's days in it. The data-acc key therefore carries the
     month too — a bare `trk-w-<n>` would collide and opening one would silently open the other.
     The printed day-span is computed from the rows actually present, so each half reads honestly. */
  const monthBuckets = new Map();
  entries.slice().reverse().forEach(e=>{
    const k = e.d.slice(0,7);
    if(!monthBuckets.has(k)) monthBuckets.set(k,[]);
    monthBuckets.get(k).push(e);
  });
  const avgTag = es => { const v = es.filter(x=>x.w!=null).map(x=>x.w);
    return v.length? avg(v).toFixed(1)+' avg' : 'no weigh-ins'; };
  const mdy = d => d.slice(5).replace('-','/');
  const archiveHTML = [...monthBuckets.entries()].map(([mk,mEs])=>{
    const mName = new Date(mk+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const wkBuckets = new Map();
    mEs.forEach(e=>{ const n=weekOf(e.d); if(!wkBuckets.has(n)) wkBuckets.set(n,[]); wkBuckets.get(n).push(e); });
    const wkHTML = [...wkBuckets.entries()].sort((a,b)=>b[0]-a[0]).map(([n,wEs])=>{
      const ds = wEs.map(e=>e.d).sort();
      const span = ds.length>1? `${mdy(ds[0])}–${mdy(ds[ds.length-1])}` : mdy(ds[0]);
      const dayRows = wEs.map(e=>{
        const dn = new Date(e.d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
        const nm = eaten[e.d]? Object.values(eaten[e.d]).filter(Boolean).length : 0;
        /* a blank cell gets .arc-none so it reads as ABSENT rather than as a value — five em-dashes
           at full contrast were a big part of why this table felt noisy */
        const cell = (v, has) => `<td${has?'':' class="arc-none"'}>${has? v : '—'}</td>`;
        return `<tr${e.d===isoToday()?' class="arc-today"':''}><td>${dn} ${mdy(e.d)}</td>
          ${cell(e.w!=null?e.w.toFixed(1):'', e.w!=null)}
          ${cell(e.s!=null?e.s.toFixed(1)+'k':'', e.s!=null)}
          ${cell(e.sl!=null?sleepFmt(e.sl):'', e.sl!=null)}
          ${cell(nm+'/5', !!nm)}</tr>`;
      }).join('');
      const key = `trk-w-${mk}-${n}`;
      const isNow = n === weekOf(isoToday());
      return `<details class="acc arc-w${isNow?' arc-now':''}" data-acc="${key}"${openAcc.has(key)?' open':''}>
        <summary><span>Wk ${n} · ${span}${isNow?'<span class="arc-now-tag">now</span>':''}</span><span class="statline">${avgTag(wEs)}</span></summary>
        <table class="wk"><tr><th>Day</th><th>lbs</th><th>steps</th><th>sleep</th><th>meals</th></tr>${dayRows}</table>
      </details>`;
    }).join('');
    return `<details class="acc arc-m" data-acc="trk-m-${mk}"${openAcc.has('trk-m-'+mk)?' open':''}>
      <summary><span>${mName}</span><span class="statline">${mEs.length} d · ${avgTag(mEs)}</span></summary>
      ${wkHTML}
    </details>`;
  }).join('');

  return `
  <h2 class="sec" style="margin-top:16px">Log · daily, after bathroom, before food</h2>
  <div class="card">
    <div class="wdays" id="wDays" style="margin-top:0">
      ${menuWeekDates().filter(d=>d<=isoToday()).map(d=>{
        const wd = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
        return `<button class="mealpick${d===isoToday()?' on':''}" data-wd="${d}">${wd} ${+d.slice(8)}</button>`;
      }).join('')}
    </div>
    <div class="logform">
      <label class="full">date<input type="date" id="wDate" value="${isoToday()}"></label>
      <label>weight · lbs<input type="number" id="wLbs" step="0.1" inputmode="decimal"></label>
      <label>steps · k<input type="number" id="wSteps" step="0.1" inputmode="decimal"></label>
      <label>sleep · h.mm<input type="text" id="wSleep" inputmode="decimal" placeholder="4.10 = 4h 10m"></label>
      <button class="btn full" id="wAdd">Log</button>
    </div>
    ${lastE?`<div class="sub" style="margin-top:8px">last: <b>${lastE.w.toFixed(1)} lb</b> · ${new Date(lastE.d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'})}</div>`:''}
  </div>

  <h2 class="sec">The trend</h2>
  <div class="card">
    <div class="trkhero">
      <div>
        <div class="thn">${aCur!=null? aCur.toFixed(1) : '—'}</div>
        <div class="thd">this week · ${curVals.length} weigh-in${curVals.length===1?'':'s'} · lbs</div>
        ${delta!=null?`<span class="dchip ${delta<=0?'dn':'up'}" style="margin-top:6px">${delta<=0?'▼':'▲'} ${Math.abs(delta).toFixed(1)} vs last week</span>`:''}
      </div>
      ${sparkHTML(withW.slice(-14).map(e=>e.w), 110, 44)}
    </div>
    ${firstW!=null && aCur!=null?`
    <div class="goalbar"><i style="width:${goalPct}%"></i></div>
    <div class="sub" style="margin-top:5px">${(firstW-aCur).toFixed(1)} lb down since day one · ${(aCur-GOAL).toFixed(1)} to go</div>`:''}
    <canvas id="wchart" aria-label="Weight and steps trend chart" style="margin-top:12px"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:var(--brass)"></span>weight (7-day trend)</span>
      <span><span class="sw" style="background:var(--dairy)"></span>steps (k)</span>
    </div>
    <details class="acc innerrow" data-acc="trk-week"${openAcc.has('trk-week')?' open':''}>
      <summary><span>This week — daily</span><span class="statline">${thisWeek.filter(e=>e.w!=null).length} logged</span></summary>
      <table class="wk">
        <tr><th>Day</th><th>lbs</th><th>steps</th><th>sleep</th></tr>
        ${thisWeekRows||'<tr><td colspan="4" style="text-align:left;color:var(--muted)">Nothing logged yet this week.</td></tr>'}
      </table>
    </details>
    <details class="acc innerrow" data-acc="trk-avgs"${openAcc.has('trk-avgs')?' open':''}>
      <summary><span>Weekly averages + goal ETA</span><span class="statline">${delta!=null?`Δ ${delta<=0?'−':'+'}${Math.abs(delta).toFixed(1)}`:''}</span></summary>
      <table class="wk" id="wkTable"></table>
      <div id="etaCard"></div>
    </details>
    <details class="acc innerrow" data-acc="trk-all"${openAcc.has('trk-all')?' open':''}>
      <summary><span>Every day logged</span><span class="statline">${entries.length} days</span></summary>
      ${archiveHTML||'<div class="sub">Nothing logged yet.</div>'}
    </details>
    <div class="formrow"><button class="btn" id="wkCopy"${isSun?' style="box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 45%,transparent)"':''}>📋 Copy week report for Claude${isSun?' · it’s Sunday':''}</button></div>
  </div>

  <h2 class="sec">Notes · off-track log · coach HW</h2>
  <div class="card">
    <div class="formrow" style="margin-top:0">
      <select id="nTag" aria-label="Note type"><option>Note</option><option>Off-track</option><option>HW</option></select>
    </div>
    <div class="formrow"><textarea id="nText" placeholder="What happened / what coach said / anything for Sunday…"></textarea></div>
    <div class="formrow"><button class="btn" id="nAdd">Save note</button></div>
    <div id="noteList">
      ${notes.slice().reverse().map((n,ri)=>{
        const i = notes.length-1-ri;
        return `<div class="noteitem">
          <div class="meta"><span class="chip notetag ${tagcls(n.tag)}">${n.tag}</span>
            <span class="d">${n.d}</span>

/* ---------- chart ---------- */
function drawTrack(){
  const entries = allWeights();
  const c = $('#wchart'); if(!c||!entries.length) return;
  const dpr = window.devicePixelRatio||1;
  const W = c.clientWidth||460, H = 170;
  c.width = W*dpr; c.height = H*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const withW = entries.filter(e=>e.w!=null);
  const ws = withW.map(e=>e.w);
  const min = ws.length? Math.min(...ws)-1 : 170, max = ws.length? Math.max(...ws)+1 : 190;
  const sVals = entries.filter(e=>e.s!=null).map(e=>e.s);
  const sMax = Math.max(10, ...(sVals.length?sVals:[10]))+2;
  const L=34,R=34,T=8,B=18;
  const x = i => L + i*(W-L-R)/Math.max(entries.length-1,1);
  const y = v => T + (max-v)*(H-T-B)/(max-min);
  const ys = v => T + (sMax-v)*(H-T-B)/sMax;
  ctx.font = '10px ui-monospace,monospace';
  ctx.strokeStyle = 'rgba(155,152,139,.18)';
  for(let g=0; g<4; g++){
    const v = min + (max-min)*g/3, gy = y(v);
    ctx.beginPath(); ctx.moveTo(L,gy); ctx.lineTo(W-R,gy); ctx.stroke();
    ctx.fillStyle = '#d9a441'; ctx.fillText(v.toFixed(1), 2, gy+3);
    const sv = sMax*g/3;
    ctx.fillStyle = '#7fa8c9'; ctx.fillText(sv.toFixed(0)+'k', W-R+4, ys(sv)+3);
  }
  /* steps line (right axis) */
  ctx.strokeStyle = 'rgba(127,168,201,.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); let pen=false;
  entries.forEach((e,i)=>{
    if(e.s==null){ pen=false; return; }
    pen ? ctx.lineTo(x(i),ys(e.s)) : ctx.moveTo(x(i),ys(e.s));
    pen = true;
  });
  ctx.stroke(); ctx.setLineDash([]);
  /* daily weight (skips days logged without a weight) */
  ctx.strokeStyle = 'rgba(155,152,139,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); let pw=false;
  entries.forEach((e,i)=>{
    if(e.w==null){ pw=false; return; }
    pw?ctx.lineTo(x(i),y(e.w)):ctx.moveTo(x(i),y(e.w)); pw=true;
  });
  ctx.stroke();
  /* 7-entry rolling avg over weighted days */
  ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2;
  ctx.beginPath(); let pa=false;
  entries.forEach((e,i)=>{
    const s7 = entries.slice(Math.max(0,i-6),i+1).filter(q=>q.w!=null);
    if(!s7.length){ pa=false; return; }
    const avg = s7.reduce((a,b)=>a+b.w,0)/s7.length;
    pa?ctx.lineTo(x(i),y(avg)):ctx.moveTo(x(i),y(avg)); pa=true;
  });
  ctx.stroke();
  const last = withW[withW.length-1];
  if(last){
    const li = entries.indexOf(last);
    ctx.fillStyle = '#d9a441';
    ctx.beginPath(); ctx.arc(x(li),y(last.w),3,0,7); ctx.fill();
    ctx.fillText(last.w.toFixed(1), Math.min(x(li)-14,W-64), y(last.w)-7);
  }

  /* weekly averages — current week included (his call, July 9) */
  const wk = new Map();
  entries.forEach(e=>{ const k=weekOf(e.d); if(!wk.has(k)) wk.set(k,[]); wk.get(k).push(e); });
  const rows = [...wk.entries()].sort((a,b)=>a[0]-b[0]).map(([k,es])=>{
    const wv = es.filter(e=>e.w!=null);
    const avg = wv.length? wv.reduce((a,b)=>a+b.w,0)/wv.length : null;
    const st = es.filter(e=>e.s!=null);
    const sAvg = st.length? (st.reduce((a,b)=>a+b.s,0)/st.length):null;
    return {k,avg,sAvg,n:wv.length};
  });
  $('#wkTable').innerHTML = `<tr><th>Week</th><th>avg lbs</th><th>Δ</th><th>steps avg</th></tr>` +
    rows.map((r,i)=>{
      const p = i? rows[i-1].avg : null;
      const d = (r.avg!=null&&p!=null)? (r.avg-p) : null;
      const dTxt = d===null?'—':`<span class="${d<=0?'delta-dn':'delta-up'}">${d>0?'+':''}${d.toFixed(2)}</span>`;
      const thin = r.n>0 && r.n<=4;
      return `<tr><td>Wk ${r.k}</td><td>${r.avg!=null?r.avg.toFixed(1):'—'}${thin?`<span style="opacity:.6;font-size:12px" title="only ${r.n} weigh-ins this week — low confidence"> ⚠${r.n}</span>`:''}</td><td>${dTxt}</td><td>${r.sAvg?r.sAvg.toFixed(1)+'k':'—'}</td></tr>`;
    }).join('');
  /* 🎯 goal ETA from the last 3 completed weekly averages */
  const eta = $('#etaCard');
  if(eta){
    const curWk2 = weekOf(isoToday());
    const full = rows.filter(r=>r.avg!=null && r.k<curWk2);
    if(full.length>=3){
      const a = full[full.length-1], b = full[full.length-3];
      const rate = (a.avg-b.avg)/2; /* lb per week, negative = losing */
      const cur = full[full.length-1].avg;
      const thin3 = full.slice(-3).filter(r=>r.n<=4).length;
      const warn = thin3? `<br><span style="opacity:.75">⚠ ${thin3} of these 3 weeks had ≤4 weigh-ins — read that as missing data, not a stall.</span>` : '';
      if(rate<-0.05){
        const wk165 = (cur-165)/(-rate);
        const dISO = w => { const d = new Date(); d.setDate(d.getDate()+Math.round(w*7));
          return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
        eta.innerHTML = `<div class="note" style="margin-top:12px">🎯 <b>Trend: ${rate.toFixed(2)} lb/wk.</b> At this pace, <b>165 around ${cur<=165?'— you’re there':dISO(wk165)}</b>. Target is 165 by Sept 30, then reassess by look — 160 and 155 are off the table for 2026.${warn}</div>`;
      } else {
        eta.innerHTML = `<div class="note" style="margin-top:12px">🎯 Last 3 weeks read flat (${rate>=0?'+':''}${rate.toFixed(2)} lb/wk).${warn} Steps are already ~10.1k/day measured — <b>do not add steps.</b> Check sleep and the recovery gate first; if it stays flat two more weeks with full weigh-ins, it’s a food conversation.</div>`;
      }
    }
  }
}

function weekReport(){
  const wk = qWeekDates(); /* Q week Mon→Sun — on Sunday this is the week ENDING today */
  const entries = allWeights().filter(e=>wk.includes(e.d));
  const eaten = store.get('qpcut.eaten',{});
  const notes = store.get('qpcut.notes',[]).filter(n=>wk.includes(n.d));
  const counts = store.get('qpcut.menucounts',{});
  const lines = [`WEEK REPORT (Mon→Sun) ${wk[0]} → ${wk[6]}`,''];
  wk.forEach(d=>{
    const day = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const e = entries.find(x=>x.d===d);
    const m = eaten[d]||{};
    const meals = ['pre','bf','lu','sn','di'].map(k=>m[k]&&OPTBYID[m[k]]?OPTBYID[m[k]].name:null).filter(Boolean).join(' / ');
    const parts = [];
    if(e){ if(e.w!=null)parts.push(e.w.toFixed(1)+' lb'); if(e.s!=null)parts.push(e.s+'k steps'); if(e.sl!=null)parts.push(sleepFmt(e.sl)+' sleep'); }
    if(meals) parts.push('ate: '+meals);
    const dl = store.get('qpcut.dials.'+dkey(d),{});
    if(dl.e||dl.h) parts.push(`dials E${dl.e||'·'}/H${dl.h||'·'}`);
    const rpe = store.get('qpcut.rpe.'+dkey(d),0);
    if(rpe) parts.push(`session RPE ${rpe}/5`);
    const eo = (store.get('qpcut.eatout',{}))[d];
    if(eo){
      const bk = (eo.banks||[]).filter(k=>k!=='di').map(k=>SLOT_BUDGET[k]?SLOT_BUDGET[k][1]:k);
      parts.push(`dining out: ${(EATOUT[eo.v]||{}).name||eo.v}${bk.length?` (skipped ${bk.join(' + ')})`:''}`);
    }
    ((store.get('qpcut.offplan',{}))[d]||[]).forEach(o=>parts.push(`off-plan: ${o.text}${o.cal?` ~${o.cal} cal`:''}${(o.fixes&&o.fixes.length)?` (offset: ${o.fixes.join('; ')})`:''}`));
    if(parts.length) lines.push(`${day} ${d.slice(5)}: ${parts.join(' · ')}`);
  });
  const menuSet = Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`${OPTBYID[k]?OPTBYID[k].name:k} ×${v}`);
  if(menuSet.length){ lines.push('','Menu this week: '+menuSet.join(', ')); }
  const ups = weekGoUps();
  if(ups.length){ lines.push('', `GO UPs this week (${ups.length}): ${ups.join(', ')}`); }
  const loc = store.get('qpcut.loc','deal');
  wk.forEach(d=>{
    const rp = store.get('qpcut.reps.'+dkey(d),{});
    if(!Object.keys(rp).length) return;
    const wo = workoutFor(new Date(d+'T12:00:00').getDay(), loc);
    const day = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
    const exLines = Object.entries(rp).map(([i,arr])=>{
      const core = /^core(\d+)$/.exec(i);
      const ex = core? CORE.ex[+core[1]] : (wo? wo.ex[+i] : null);
      if(!ex||!arr||!arr.some(v=>v!=null)) return null;
      const nm = ex[0].replace(/<[^>]*>/g,'');
      const v = scoreOn(d, i, ex, loc);
      return `- ${nm}${core?' (core)':''}: ${arr.map(x=>x==null?'·':x).join('/')}${v?` → ${v==='up'?'GO UP':v==='down'?'LIGHTEN':'hold'}`:''}`;
    }).filter(Boolean);
    if(exLines.length){ lines.push('', `Lift ${day} (${wo?wo.tag:'Core / extra'}):`, ...exLines); }
  });
  if(notes.length){ lines.push('','Notes:'); notes.forEach(n=>lines.push(`- [${n.tag} ${n.d.slice(5)}] ${n.text}`)); }
  const askq = store.get('qpcut.askq',[]);
  if(askq.length){ lines.push('','Questions for Q:'); askq.forEach(q=>lines.push(`- ${(q&&q.text)||(typeof q==='string'?q:'')}`)); }
  return lines.join('\n');
}

let phShowAll = false;
async function drawPhotos(){
  const grid = $('#phGrid'); if(!grid) return;
  const ph = await getPhotos();
  const all = ph.slice().reverse();
  const show = phShowAll? all : all.slice(0,6);
  grid.innerHTML = (show.map(p=>`
    <div class="ph">
      <button class="view" data-view="${p.key}"><img src="${p.img}" alt="food photo ${p.d.slice(0,10)}"></button>
      <button class="xdel" data-px="${p.key}" aria-label="delete photo">×</button>
    </div>`).join('') + (all.length>6?`<button class="btn ghost" id="phMore" style="grid-column:1/-1">${phShowAll?'Show recent 6 only':`Show all ${all.length}`}</button>`:'')) || '<div class="sub">No photos yet — start the collage.</div>';

const ORDER = ['today','meals','prep','train','track'];
const VIEWS = {today:viewToday, meals:viewMeals, prep:viewPrep, train:viewTrain, track:viewTrack};
let current = 'today';
let timerInt = null;
function setTab(t, dir){
  current = t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  render();
  if(dir){
    const v = $('#view');

let renderDay = null;
/* re-render when the app comes back to the foreground (day may have changed) */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
function render(){
  /* the app can sit open overnight — when the calendar day flips, snap back to today */
  const tISO = isoToday();
  if(renderDay===null) renderDay = tISO;
  else if(renderDay!==tISO){
    renderDay = tISO; logDate = null; expandSlot = null;
    /* close a dangling lift session from yesterday, quietly */
    const yk = Object.keys(localStorage).filter(k=>k.startsWith('qpcut.sesh.')&&k!=='qpcut.sesh.'+dkey(tISO));
    yk.forEach(k=>{ try{ const s=JSON.parse(localStorage.getItem(k)); if(s&&s.start&&!s.end){ s.end=s.start; localStorage.setItem(k,JSON.stringify(s)); } }catch(e){} });
    /* drop stale per-day accordion-toggle records (keep only today's) */
    Object.keys(localStorage).filter(k=>k.startsWith('qpcut.acctoggled.')&&k!=='qpcut.acctoggled.'+tISO)
      .forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  }
  seedOpenAcc(); /* time-aware open defaults, once per calendar day */
  EG_REG = []; /* guide registry rebuilds with every full render */
  if(timerInt){ clearInterval(timerInt); timerInt=null; }
  const _pt = planTarget(logDate||renderDay);
  $('#macroStrip').innerHTML = [['kcal',0],['protein',1],['carbs',2],['fat',3]].map(([lbl,i])=>`<div class="mcell"><div class="n">${_pt.t[i]}${_pt.adj[i]?'<span style="color:var(--brass);font-size:.55em;vertical-align:super">▲</span>':''}</div><div class="l">${lbl}</div></div>`).join('');
  $('#macroStrip').style.display = (current==='meals'||current==='prep') ? 'grid' : 'none';
  /* A throw in a view used to leave the PREVIOUS tab's HTML in #view, so a broken Today silently
     showed whatever tab he was on last. That is indistinguishable from a layout bug and it cost him
     an afternoon. Show the failure, name the tab, and keep the app usable. */
  try{
    $('#view').innerHTML = VIEWS[current]();
  }catch(err){
    try{ console.error('view render failed:', current, err); }catch(e){}
    $('#view').innerHTML = `<div class="note" style="border-color:var(--meat)">
      <b>⚠️ The ${current} tab failed to draw.</b><br>
      <span style="font-family:var(--mono);font-size:12px">${esc(String((err&&err.message)||err))}</span><br>
      <span class="sub">Your data is safe — this is a display bug, and it is almost always one bad row.
      Screenshot this and send it to Claude; the message above tells him exactly where to look.</span></div>`;
  }
  try{
    ({today:wireToday, prep:wirePrep, train:wireTrain, track:wireTrack}[current]||(()=>{}))();
  }catch(err){ try{ console.error('wiring failed:', current, err); }catch(e){} }
  document.querySelectorAll('details.acc').forEach(d=>d.addEventListener('toggle',()=>{
    if(window.__filterOpening) return; /* transient search force-open — don't persist */
    if(d.dataset.slotsec){
      /* Meal slots are SESSION-ONLY and filter-owned. The <details> "toggle" event fires ASYNCHRONOUSLY
         (after __filterOpening resets), so while a filter is active — which force-opens matches — we must
         ignore the event here, else the programmatic opens get saved and the slot stays stuck open after
         the filter clears. And we never persist meal slots to acctoggled, so they always start clean on
         reload and can't carry a stale open state. */
      if(mealKF || mealQ.trim()) return;
      if(d.open) openAcc.add(d.dataset.acc); else openAcc.delete(d.dataset.acc);
      return;
    }
    if(d.open) openAcc.add(d.dataset.acc); else openAcc.delete(d.dataset.acc);
    if(d.dataset.acc==='schedule') setSchedOpen(d.open); /* schedule persists across reloads */
    markToggled(d.dataset.acc, d.open); /* remember today's explicit toggles so a reload won't re-seed them open */
  }));
  /* Per-exercise roll-ups. Bound per-element after each render like details.acc above — safe here because
     refreshGuides only replaces the inner #eg-N guide markup, never these <details> elements themselves. */
  document.querySelectorAll('details[data-exfold]').forEach(d=>d.addEventListener('toggle',()=>{
    exFoldSet(d.dataset.exfold, !d.open);
  }));
  /* v14 chrome: zone bar, session dim, filters, live tick */
  renderZoneBar();
  const sToday = seshGet(isoToday());
  document.body.classList.toggle('sesh-on', current==='today' && !!(sToday && sToday.start && !sToday.end));
  if(current==='meals') applyMealFilter();
  tickNow(); tickRest();
}

/* swipe between tabs — ignores pinch-zoom gestures and touches that start on inputs */
let sx=0, sy=0, swipeOk=false, multiTouch=false;
document.addEventListener('touchstart',e=>{
  if(e.touches.length>1){ multiTouch=true; swipeOk=false; return; }
  /* never hijack a touch that starts in a field or inside anything that scrolls sideways
     (meal tiles, zone-chip bar, wide tables) — those own their horizontal gesture */
  if(e.target.closest('input,select,textarea,.mtiles,.zonebar,[data-hscroll]')){ swipeOk=false; return; }
  swipeOk = true;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(multiTouch){ if(e.touches.length===0) multiTouch=false; return; }
  if(!swipeOk) return;
  swipeOk = false;
  if(window.visualViewport && window.visualViewport.scale > 1.05) return; /* zoomed in — don't hijack */
  const dx = e.changedTouches[0].clientX-sx, dy = e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>2.2*Math.abs(dy)){
    const i = ORDER.indexOf(current);
    if(dx<0 && i<ORDER.length-1) setTab(ORDER[i+1],'l');
    if(dx>0 && i>0) setTab(ORDER[i-1],'r');
  }
},{passive:true});

/* ---------- keyboard-open detection ----------
   Drives body.kbdopen, which hides the fixed tab bar (see the CSS note on nav.tabs).
   Bound ONCE at startup on document, not per-render: render() replaces the whole view on every keystroke
   that changes state, so per-element listeners would be re-attached constantly and any element that
   survived a render would keep a stale one.
   ⛔ THE SAFETY NET MATTERS. If focusout never fires — he backgrounds the app mid-type, or iOS dismisses
   the keyboard without blurring — the bar would stay hidden with no way back. visualViewport tells us the
   keyboard is really gone: when the visible height comes back to within 100px of the window height, the
   class comes off regardless of what focus thinks. */
function kbdWatch(){
  const TYPEY = el => !!el && (el.tagName === 'TEXTAREA' ||
    (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|range|color|file)$/i.test(el.type || 'text')));
  const set = on => document.body.classList.toggle('kbdopen', !!on);
  document.addEventListener('focusin',  e => { if(TYPEY(e.target)) set(true); });
  document.addEventListener('focusout', e => { if(TYPEY(e.target)) setTimeout(()=>{ if(!TYPEY(document.activeElement)) set(false); }, 60); });
  const vv = window.visualViewport;
  if(vv) vv.addEventListener('resize', () => {
    if(vv.height >= window.innerHeight - 100) set(false);
    else if(TYPEY(document.activeElement)) set(true);
  });
}
function beep(){
  try{
    const ac = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880; g.gain.value = .25;
    o.start(); o.stop(ac.currentTime+.6);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

<!-- ============================================================================
     THE NEXT SKIN — a new view layer bolted onto the SAME engine.

     Why it is built this way: next/index.html is generated as index.html PLUS this file. It is not
     a fork. Every recipe, rotation, macro and engine function comes from the one source, so a food
     fix made once is correct in both apps. Forking the file would have created two copies of his
     food data, and drift between them is exactly the class of bug this whole refresh was about.

     How the override works: top-level `let`/`const` in a classic script live in the shared global
     lexical environment, so this second script can read SLOTS, dayRows, dairyWindow, creamiState,
     corBuild, store — all of it. VIEWS is a const OBJECT, so its properties can be reassigned. And
     `render` is a function declaration, so redefining it here replaces the one the engine calls.

     Same origin as the live app (only the path differs), so localStorage is SHARED: this reads and
     writes his real data and syncs through the same gist. Nothing to migrate, and the two apps
     always agree.

     Tabs Now / Food / Trend are the new design. Lift and Prep render the EXISTING view HTML inside
     the new frame and run the existing wiring — deliberately, because those two own rep logging and
     the grocery state, and reimplementing them was the one way to actually lose data.
     ============================================================================ -->

        border-top:1px solid var(--nx-line);background:var(--nx-surface);max-width:520px;margin:0 auto;
        padding-bottom:env(safe-area-inset-bottom)}

      font-family:var(--nx-ui);cursor:pointer}
.nxtb .g{display:block;font-size:15px;margin-bottom:2px;line-height:1}
.nxtb.on{color:var(--nx-brass);font-weight:700}
.nxtb:focus-visible{outline:2px solid var(--nx-brass);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<script>
/* ---------------------------------------------------------------------------
   Everything below reads the SAME engine and writes the SAME storage keys as the
   live app. Where this logs something, it mirrors the existing writer exactly —
   copying an existing value's shape rather than inventing one is the rule that
   came out of the qpcut.askq bug, where a bare string where an object belonged
   took down a whole tab.
   --------------------------------------------------------------------------- */
(function () {
  'use strict';
  document.body.classList.add('nx');

  var K = { meat: 'k-meat', dairy: 'k-dairy', pareve: 'k-pareve' };
  function kOf(id) {
    var k = (typeof optK === 'function' ? optK(id) : []) || [];
    return k.indexOf('meat') >= 0 ? 'meat' : k.indexOf('dairy') >= 0 ? 'dairy'
         : k.indexOf('pareve') >= 0 ? 'pareve' : '';
  }
  function optOf(id) { return (typeof OPTBYID !== 'undefined' && OPTBYID[id]) || null; }
  function esc2(s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function ld() { return (typeof logDate !== 'undefined' && logDate) || isoToday(); }

  /* ---------- shell ---------- */
  function shell() {
    if (document.querySelector('.nxtop')) return;
    var app = document.querySelector('.app');
    var top = document.createElement('div');
    top.className = 'nxtop';
    top.innerHTML =
      '<div class="nxbrand"><h1>THE <span>CUT</span></h1><div class="nxday" id="nxDay"></div></div>' +
      '<div class="nxrail" id="nxRail"></div>';
    app.insertBefore(top, app.firstChild);

    var tabs = document.createElement('nav');
    tabs.className = 'nxtabs';
    tabs.innerHTML = [
      ['today', '◉', 'Now'], ['meals', '✦', 'Food'], ['train', '▲', 'Lift'],
      ['prep', '▤', 'Prep'], ['track', '◇', 'Trend']
    ].map(function (t) {
      return '<button class="nxtb" type="button" data-nxgo="' + t[0] + '">' +
             '<span class="g">' + t[1] + '</span>' + t[2] + '</button>';
    }).join('');
    document.body.appendChild(tabs);
    tabs.addEventListener('click', function (e) {
      var b = e.target.closest('.nxtb'); if (!b) return;
      setTab(b.dataset.nxgo);
      window.scrollTo(0, 0);
    });
  }

  function paintChrome() {
    var d = ld(), pt = planTarget(d), got = eatenMacros(d);
    var left = pt.t.map(function (v, i) { return Math.round(v - got[i]); });
    var lbl = ['kcal left', 'protein', 'carbs', 'fat'];
    var rail = document.getElementById('nxRail');
    if (rail) rail.innerHTML = left.map(function (v, i) {
      return '<div class="nxrc' + (i === 0 ? ' lead' : '') + '"><div class="n">' + v +
             '</div><div class="l">' + lbl[i] + '</div></div>';
    }).join('');
    var dayEl = document.getElementById('nxDay');
    if (dayEl) {
      var wd = new Date(d + 'T12:00:00');
      var wo = (typeof workoutFor === 'function')
        ? workoutFor(wd.getDay(), store.get('qpcut.loc', 'deal')) : null;
      dayEl.textContent = wd.toDateString().slice(0, 3).toUpperCase() + ' · ' +
        (wo ? String(wo.n || wo.name || 'LIFT').toUpperCase() : 'REST') + ' · ' +
        fmtMin(new Date().getHours() * 60 + new Date().getMinutes());
    }
    document.querySelectorAll('.nxtb').forEach(function (b) {
      b.classList.toggle('on', b.dataset.nxgo === current);
    });
  }

  /* ---------- NOW ---------- */
  function slotName(key) { var s = SLOTS.find(function (x) { return x.key === key; }); return s ? s.slot : key; }

  function buildHTML(opt) {
    if (!opt || !opt.vars || !opt.vars[0]) return '';
    var v = opt.vars[0];
    return '<div class="nxbh">Build it</div>' +
      v.ing.map(function (r) {
        return '<div class="nxing"><span>' + esc2(String(r[0]).replace(/<[^>]+>/g, '')) +
               '</span><span class="q">' + esc2(r[1]) + '</span></div>';
      }).join('') +
      '<div class="nxtot"><span><b>' + v.t[0] + '</b> kcal</span><span>P <b>' + v.t[1] +
      '</b></span><span>C <b>' + v.t[2] + '</b></span><span>F <b>' + v.t[3] + '</b></span></div>';
  }

  /* which slot is next, and what is planned in it */
  function nextUp(d) {
    var eaten = (store.get('qpcut.eaten', {}))[d] || {};
    var planned = (typeof plannedMealMins === 'function' && d === isoToday()) ? plannedMealMins() : {};
    var order = Object.keys(planned).sort(function (a, b) { return planned[a] - planned[b]; });
    if (!order.length) order = SLOT_SEQ.slice();
    var isFri = new Date(d + 'T12:00:00').getDay() === 5;
    for (var i = 0; i < order.length; i++) {
      var k = order[i];
      if (eaten[k]) continue;
      if (isFri && k === 'sn') continue;
      return { slot: k, min: (typeof schedMealMin === 'function' ? schedMealMin(k, d) : null) || planned[k] || null };
    }
    return null;
  }

  /* What is actually in a slot — and NOTHING if he has not decided.
     The first version fell back to SLOTS[k].opts[0], which for dinner is the Burger. That put a
     meal he never chose on his schedule AND, because the Burger is meat, it sat 45 minutes before
     a dairy Creami — the app displaying the exact violation the kashrut engine exists to prevent.
     There is no per-day dinner plan in the data (menucounts are weekly totals, not assignments),
     so asserting one was fabrication. Breakfast is different: the COR bowl IS deterministic. */
  function plannedOpt(k, d) {
    var eaten = (store.get('qpcut.eaten', {}))[d] || {};
    if (eaten[k]) return optOf(eaten[k]);
    if (k === 'bf' && typeof bowlOfDay === 'function') { var b = bowlOfDay(d); if (b) return optOf(b); }
    return null;
  }

  /* the options he can still pick in a slot, each with what it does to the dairy window */
  function choicesFor(k, d) {
    var s = SLOTS.find(function (x) { return x.key === k; });
    if (!s) return [];
    var noMeat = (typeof isNoMeat === 'function') && isNoMeat(d);
    return s.opts.filter(function (o) { return !(noMeat && (typeof isMeatOpt === 'function') && isMeatOpt(o)); });
  }

  /* A meat meal PLANNED for later closes the dairy window just as surely as one already eaten —
     dairyWindow only knows about logged meals, so tell it about the pick sitting in the slot. */
  function windowWith(d) {
    var eatenMap = (store.get('qpcut.eaten', {}))[d] || {};
    var opts = {};
    if (!eatenMap.di) {
      var pd = plannedOpt('di', d);
      if (pd) {
        opts.dinner = pd.id;
        var pm = (typeof plannedMealMins === 'function' && d === isoToday()) ? plannedMealMins().di : null;
        if (pm != null) opts.dinnerMin = pm;
      }
    }
    return dairyWindow(d, opts);
  }

  function viewNow() {
    var d = ld(), out = [];
    var nu = nextUp(d);

    if (nu) {
      var opt = plannedOpt(nu.slot, d);
      var kk = opt ? kOf(opt.id) : '';
      var mins = nu.min;
      var nowM = new Date().getHours() * 60 + new Date().getMinutes();
      var away = mins != null ? mins - nowM : null;
      var eyebrow = mins == null ? 'Next'
        : away > 0 ? 'Next · in ' + (away >= 60 ? Math.floor(away / 60) + ' h ' + (away % 60) + ' min' : away + ' min')
        : 'Next · now';
      var sug = (typeof nextEatSuggestion === 'function') ? nextEatSuggestion(d) : null;
      var why = (sug && sug.target === nu.slot && sug.why) ? sug.why : '';
      var blocked = sug && sug.blocked;

      var slotB = (SLOTS.find(function (x) { return x.key === nu.slot; }) || {}).b || [];
      var body;
      if (opt) {
        body = buildHTML(opt) +
          (blocked ? '' :
            '<button class="nxact" type="button" data-nxlog="' + esc2(nu.slot) + '" data-nxopt="' +
            esc2(opt.id) + '">Ate it' + (mins != null ? ' — ' + fmtMin(nowM) : '') + '</button>');
      } else {
        /* nothing chosen yet — offer the real options and say what each does to the Creami,
           instead of asserting a meal he never picked */
        var dwNow = windowWith(d);
        body = '<div class="nxbh">Pick one</div>' + choicesFor(nu.slot, d).map(function (o) {
          var ok = kOf(o.id), cons = '';
          if (nu.slot === 'di' && ok === 'meat') cons = ' · Creami moves before dinner';
          else if (nu.slot === 'di' && ok) cons = ' · Creami stays after';
          return '<button class="nxact ghost" style="text-align:left;margin-top:6px" type="button" ' +
            'data-nxlog="' + esc2(nu.slot) + '" data-nxopt="' + esc2(o.id) + '">' +
            esc2(o.name) + (ok ? ' <span class="nxtag ' + K[ok] + '">' + ok + '</span>' : '') +
            '<span style="display:block;font-size:11px;color:var(--nx-faint);font-family:var(--nx-mono)">' +
            o.vars[0].t[0] + ' kcal · P ' + o.vars[0].t[1] + esc2(cons) + '</span></button>';
        }).join('');
      }
      out.push('<div class="nxnow ' + (K[kk] || '') + '">' +
        '<div class="eyebrow">' + esc2(eyebrow) + '</div>' +
        '<h2>' + esc2(opt ? opt.name : slotName(nu.slot)) + '</h2>' +
        '<div class="nxwhen">' + (mins != null ? fmtMin(mins) : '—') +
          ' &nbsp;·&nbsp; ' + (opt ? opt.vars[0].t[0] : (slotB[0] || '')) + ' kcal' +
          (kk ? ' &nbsp;·&nbsp; ' + kk : '') + '</div>' +
        body +
        (why ? '<div class="nxwhy">' + why + '</div>' : '') +
        '</div>');
    } else {
      out.push('<div class="nxnow"><div class="eyebrow">Done</div><h2>Everything logged</h2>' +
        '<div class="nxwhy">Nothing left to eat today.</div></div>');
    }

    /* the day, as a spine */
    var rows = (typeof dayTimeline === 'function' && d === isoToday()) ? dayTimeline() : [];
    if (rows.length) {
      var eaten = (store.get('qpcut.eaten', {}))[d] || {};
      var nowM2 = new Date().getHours() * 60 + new Date().getMinutes();
      var dw = windowWith(d);
      var spine = [], placedNow = false, placedWait = false;
      rows.forEach(function (r) {
        var slot = (typeof mealSlotOfLabel === 'function') ? mealSlotOfLabel(r[1]) : null;
        if (!placedWait && dw.from != null && r[0] >= dw.from) {
          spine.push('<div class="nxwait">Dairy locked until <b>' + fmtMin(dw.from) +
                     '</b> — six hours from the ' + (dw.why.indexOf('lunch') >= 0 ? 'chicken' : 'meat meal') + '.</div>');
          placedWait = true;
        }
        if (!placedNow && r[0] > nowM2) {
          spine.push('<div class="nxnowline"><span>now · ' + fmtMin(nowM2) + '</span></div>');
          placedNow = true;
        }
        var id = slot ? eaten[slot] : null;
        var planOpt = (!id && slot) ? plannedOpt(slot, d) : null;
        var kk2 = id ? kOf(id) : (planOpt ? kOf(planOpt.id) : '');
        var label = String(r[1]).replace(/<[^>]+>/g, '');
        if (slot && id) { var o = optOf(id); if (o) label = o.name; }
        else if (planOpt) { label = planOpt.name; }
        else if (slot) { label = slotName(slot) + ' — not picked'; }
        spine.push('<div class="nxev ' + (r[0] <= nowM2 ? 'done ' : '') +
          (slot && !id && nu && nu.slot === slot ? 'next ' : '') + (K[kk2] || '') + '">' +
          '<span class="t">' + fmtMin(r[0]) + '</span><span class="l">' + esc2(label) +
          (kk2 ? '<span class="nxtag ' + K[kk2] + '">' + kk2 + '</span>' : '') + '</span></div>');
      });
      if (!placedWait && dw.from != null) {
        spine.push('<div class="nxwait">Dairy locked until <b>' + fmtMin(dw.from) + '</b>.</div>');
      }
      out.push('<div><div class="nxsect" style="margin-bottom:3px">Today</div>' +
               '<div class="nxspine">' + spine.join('') + '</div></div>');
    }

    /* water */
    var drinks = store.get('qpcut.drinks.' + dkey(d), {});
    var oz = (drinks.bottle || 0) * 30 + (drinks.stick || 0) * 14 + (drinks.pre || 0) * 9 +
             (drinks.eaa || 0) * 9 + (drinks.soda || 0) * 12 + (drinks.seltzer || 0) * 12 +
             (drinks.dietsoda || 0) * 12 + (drinks.custom || 0);
    var ht = (typeof hydrTarget === 'function') ? hydrTarget(d) : { oz: 104 };
    var target = ht && ht.oz ? ht.oz : (typeof ht === 'number' ? ht : 104);
    var pips = 8, filled = Math.min(pips, Math.round(oz / target * pips));
    var pipHTML = '';
    for (var i = 0; i < pips; i++) pipHTML += '<span class="nxpip' + (i < filled ? ' on' : '') + '"></span>';
    out.push('<div class="nxcard"><h3>Water · ' + Math.round(oz) + ' of ' + Math.round(target) + ' oz</h3>' +
      '<div class="nxpips">' + pipHTML + '</div>' +
      '<div class="nxstep"><button type="button" data-nxdrink="-1">−</button>' +
      '<button type="button" data-nxdrink="1">+</button>' +
      '<span class="v">1 bottle = 30 oz · ' + (drinks.bottle || 0) + ' logged</span></div></div>');

    return out.join('');
  }

  /* ---------- FOOD ---------- */
  function viewFood() {
    var d = ld();
    var eaten = (store.get('qpcut.eaten', {}))[d] || {};
    var isFri = new Date(d + 'T12:00:00').getDay() === 5;
    var planned = (typeof plannedMealMins === 'function' && d === isoToday()) ? plannedMealMins() : {};
    /* order by the day's real clock; a slot the day plan does not place (pre-lift on a rest day)
       falls back to its canonical position rather than being dumped at the bottom */
    var order = SLOTS.map(function (s) { return s.key; }).sort(function (a, b) {
      var pa = planned[a] != null ? planned[a] : SLOT_SEQ.indexOf(a) * 200;
      var pb = planned[b] != null ? planned[b] : SLOT_SEQ.indexOf(b) * 200;
      return pa - pb;
    });
    var dw = windowWith(d);

    var out = ['<div class="nxsect">' + new Date(d + 'T12:00:00').toDateString().slice(0, 3) +
               ' · ' + SLOTS.length + ' meals</div>'];

    order.forEach(function (k) {
      var s = SLOTS.find(function (x) { return x.key === k; });
      var id = eaten[k];
      var opt = id ? optOf(id) : plannedOpt(k, d);
      var skip = isFri && k === 'sn';
      var kk = opt ? kOf(opt.id) : '';
      var t = (typeof slotTimeLabel === 'function') ? slotTimeLabel(k, d) : '';
      var v = opt && opt.vars && opt.vars[0];
      var lock = (k === 'sn' && kk === 'dairy' && dw.from != null)
        ? '<p style="font-size:12px;color:var(--nx-dairy);margin:9px 0 0">Not before <b>' +
          fmtMin(dw.from) + '</b> — ' + esc2(dw.why) + '</p>' : '';
      /* With a pick: the build plus an un-log. Without one: the actual choices. The first version
         printed a bare "Log it" with no option attached — a button that silently did nothing, which
         is the failure mode that reads as "the app is broken". */
      var body;
      if (skip) body = '<p style="font-size:13px;color:var(--nx-muted);margin:0">Skipped — the feast covers it.</p>';
      else if (opt) body = buildHTML(opt) + lock +
        '<button class="nxact ghost" type="button" data-nxlog="' + k + '" data-nxopt="' +
        esc2(opt.id) + '">' + (id ? 'Un-log' : 'Ate it') + '</button>';
      else body = lock + '<div class="nxbh">Pick one</div>' + choicesFor(k, d).map(function (o) {
        var ok = kOf(o.id);
        return '<button class="nxact ghost" style="text-align:left;margin-top:6px" type="button" ' +
          'data-nxlog="' + k + '" data-nxopt="' + esc2(o.id) + '">' + esc2(o.name) +
          (ok ? ' <span class="nxtag ' + K[ok] + '">' + ok + '</span>' : '') +
          '<span style="display:block;font-size:11px;color:var(--nx-faint);font-family:var(--nx-mono)">' +
          o.vars[0].t[0] + ' kcal · P ' + o.vars[0].t[1] + ' · C ' + o.vars[0].t[2] +
          ' · F ' + o.vars[0].t[3] + '</span></button>';
      }).join('');

      out.push('<details class="nxmeal' + (id ? ' eaten' : '') + '">' +
        '<summary><span class="nxchk">✓</span><span class="mt">' + esc2(t) + '</span>' +
        '<span class="mn">' + esc2(skip ? 'Skipped → feast' : (opt ? opt.name : s.slot)) +
        (kk ? '<span class="nxtag ' + K[kk] + '">' + kk + '</span>' : '') + '</span>' +
        '<span class="mk">' + s.b[0] + '</span></summary>' +
        '<div class="body">' + body + '</div></details>');
    });
    return out.join('');
  }

  /* ---------- TREND ---------- */
  function viewTrend() {
    var w = (typeof allWeights === 'function' ? allWeights() : []).filter(function (e) { return e.w != null; });
    var first = w.length ? w[0].w : null, last = w.length ? w[w.length - 1].w : null;
    var out = [];
    if (w.length > 1) {
      var xs = w.slice(-60);
      var lo = Math.min.apply(null, xs.map(function (e) { return e.w; }));
      var hi = Math.max.apply(null, xs.map(function (e) { return e.w; }));
      var span = (hi - lo) || 1;
      var pts = xs.map(function (e, i) {
        return (i / (xs.length - 1) * 296 + 2).toFixed(1) + ',' + (6 + (hi - e.w) / span * 74).toFixed(1);
      }).join(' ');
      out.push('<div class="nxcard"><h3>Weight</h3>' +
        '<div style="display:flex;align-items:baseline;gap:9px"><span class="nxbig">' + last.toFixed(1) + '</span>' +
        (first != null && first > last ? '<span class="nxdelta">▼ ' + (first - last).toFixed(1) + ' since the start</span>' : '') +
        '</div><svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:90px;display:block" ' +
        'role="img" aria-label="Weight trend"><polyline fill="none" stroke="var(--nx-brass)" stroke-width="2" ' +
        'stroke-linejoin="round" points="' + pts + '"/></svg>' +
        '<p style="font-family:var(--nx-mono);font-size:11px">' + lo.toFixed(1) + ' – ' + hi.toFixed(1) +
        ' over the last ' + xs.length + ' weigh-ins</p></div>');
    }
    var sl = (typeof allWeights === 'function' ? allWeights() : []).slice(-7)
      .map(function (e) { return e.sl || 0; });
    if (sl.length) {
      var mx = Math.max.apply(null, sl.concat([8]));
      var avg = sl.filter(Boolean).reduce(function (a, b) { return a + b; }, 0) / (sl.filter(Boolean).length || 1);
      out.push('<div class="nxcard"><h3>Sleep · ' + avg.toFixed(1) + ' h average</h3><div class="nxbars">' +
        sl.map(function (v) {
          return '<div class="nxbar' + (v >= 7 ? ' hi' : '') + '" style="height:' +
                 Math.round((v / mx) * 100) + '%"></div>';
        }).join('') + '</div><p style="margin-top:8px">Last seven logged nights.</p></div>');
    }
    var gate = (typeof recoveryGate === 'function') ? recoveryGate() : null;
    if (gate && gate.why && gate.why.length) {
      out.push('<div class="nxcard"><h3>Recovery</h3><p>' + gate.why.join('</p><p>') + '</p></div>');
    }
    var ups = (typeof weekGoUps === 'function') ? weekGoUps() : [];
    out.push('<div class="nxcard"><h3>Jumps this week · ' + ups.length + '</h3>' +
      (ups.length ? ups.map(function (u) { return '<div class="nxkv"><span>' + esc2(u) + '</span><b>up</b></div>'; }).join('')
                  : '<p>Nothing at the top of its range yet.</p>') + '</div>');
    return out.join('');
  }

  /* ---------- legacy passthrough ----------
     Lift and Prep keep the existing view and the existing wiring. They own rep logging and the
     grocery/menu state, and rebuilding them from scratch was the one way to actually lose data.
     They render inside the new frame; porting them properly comes after he has looked at this. */
  function legacy(fn, note) {
    return function () {
      var html = '';
      try { html = fn(); } catch (e) { html = '<div class="nxcard"><h3>Could not draw</h3><p>' + esc2(e.message) + '</p></div>'; }
      return '<div class="nxlegacy"><div class="nxnote">' + note + '</div>' + html + '</div>';
    };
  }

  VIEWS.today = viewNow;
  VIEWS.meals = viewFood;
  VIEWS.track = viewTrend;
  VIEWS.train = legacy(viewTrain, 'Lift — existing screen, new frame. Rep logging untouched.');
  VIEWS.prep  = legacy(viewPrep,  'Prep — existing screen, new frame. Grocery + menu state untouched.');

  /* our own render: the engine's version wires handlers that expect the old markup */
  var WIRE = { train: typeof wireTrain === 'function' ? wireTrain : null,
               prep:  typeof wirePrep  === 'function' ? wirePrep  : null };

  window.render = function render() {
    shell();
    var host = document.getElementById('view');
    try { host.innerHTML = VIEWS[current](); }
    catch (err) {
      try { console.error('view render failed:', current, err); } catch (e) {}
      host.innerHTML = '<div class="nxcard"><h3>The ' + current + ' tab failed to draw.</h3>' +
        '<p style="font-family:var(--nx-mono);font-size:12px">' + esc2(err && err.message) + '</p>' +
        '<p>Your data is safe — screenshot this and send it to Claude.</p></div>';
    }
    if (WIRE[current]) { try { WIRE[current](); } catch (e) { try { console.error('wiring failed:', current, e); } catch (_) {} } }
    paintChrome();
  };

  /* ---------- our handlers ---------- */
  document.addEventListener('click', function (e) {
    var log = e.target.closest('[data-nxlog]');
    if (log) {
      var slot = log.dataset.nxlog, opt = log.dataset.nxopt;
      if (!opt) return;
      /* mirrors the live app's #mealLog writer exactly, including the eat-time stamp */
      var eaten = store.get('qpcut.eaten', {}), d = ld();
      eaten[d] = eaten[d] || {};
      var setting = eaten[d][slot] !== opt;
      eaten[d][slot] = setting ? opt : null;
      store.set('qpcut.eaten', eaten);
      if (d === isoToday()) {
        if (setting) {
          var n = new Date();
          setEatTime(d, slot, String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'));
        } else setEatTime(d, slot, null);
      }
      render();
      return;
    }
    var dr = e.target.closest('[data-nxdrink]');
    if (dr) {
      var key = 'qpcut.drinks.' + dkey(ld());
      var cur = store.get(key, {});
      cur.bottle = Math.max(0, (cur.bottle || 0) + (+dr.dataset.nxdrink));
      store.set(key, cur);
      render();
    }
  });

  shell();
  render();
})();
</script>

</body>
