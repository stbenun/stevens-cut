/* ============ PRICING — a row's numbers are LOOKED UP, never stored =============================
   Built Aug 18 2026 on his instruction, verbatim: "Every recipe should be FACT checked when being
   made. I cant be the one to find these mistakes all the time... NOTHING SHOULD BE OFF CALORIES AND
   MACROS!" — and on his answer to what it would take: "yes go ahead."

   THE BUG CLASS THIS DELETES. An ingredient row used to carry its own copy of [cal,P,C,F]. FOOD_FACTS
   held the sourced per-unit number, the row held a hand-typed total, and NOTHING BOUND THEM — so the
   two drifted. Measured on the file before this change: 46 rows disagreed with their own source by a
   combined 199 cal (Justin's almond butter pack 220 against a label 190; an Oikos cup 90 against 80,
   in three separate meals), and every one of them PASSED [row-math], because that check tolerates the
   greater of 4 cal or 3%. Worse, 43% of the calories in the plan sat on rows that no fact priced at
   all — dinner was 89% unpriced — so d17 could read "+13 cal vs budget" with all six of its lines
   invented. A total that is a SUM cannot lie about its rows; a total that is a CLAIM can.

   HOW IT WORKS. Row index 2 is the SOURCE OF THE NUMBERS, and it is exactly one of:
     [cal,P,C,F]              legacy hand-typed copy. priceRow returns it unchanged, so the migration
                              can proceed one food at a time without the app ever going dark.
     {f:'key', n:2}           n units of FOOD_FACTS['key'], expressed in THAT FACT'S OWN unit.
     {f:'key', n:6, u:'oz'}   same, in a convertible unit — mass and volume only.
     {parts:[{f,n},{f,n}]}    one displayed line built from several foods (a glaze, a sauce).
     {free:1}                 deliberately zero: spices, a dry rub, water, vinegar under a gram.
   A row can no longer hold a number that contradicts its source, because it holds no number.

   ⛔ A UNIT MISMATCH IS A BUILD FAILURE, NOT A SKIP. The fuzzy token matcher this replaces resolved
   anything ambiguous to "unchecked" — which is exactly how 78 rows went unpriced while the build
   printed "all food checks passed". ffScale returns null, priceRow returns null, and [row-math] fails
   the build. The silence was the defect, not the ambiguity.
   ⛔ ROUND ONCE, AT THE END. priceRow returns unrounded floats on purpose; rounding each row first
   and then summing is how a 6-row recipe drifts 3 cal from its own ingredients. varTotal rounds all
   four to integers, which is what [recipe-totals] has always done, so every legacy total is
   byte-identical after this change. */
/* ==== PRICING-ENGINE-BEGIN — [priced] in check-food.js lifts this block VERBATIM so the
   guard and the app share one implementation. A second copy of pricing logic would be the
   exact bug this engine exists to delete. Do not remove the sentinels. ==== */
const FF_ALIAS = {ml:'ml', millilitre:'ml', milliliter:'ml', g:'g', gram:'g', grams:'g',
                  oz:'oz', ounce:'oz', ounces:'oz', each:'each', ea:'each', piece:'each',
                  pieces:'each', med:'each', medium:'each', whole:'each'};
/* A fact's unit may carry a parenthetical for the reader ('cup (150 g)'); the unit is the head word. */
const ffUnit = u => {
  const head = String(u).replace(/\s*\(.*$/, '').trim().toLowerCase();
  return FF_ALIAS[head] || head;
};
/* Mass converts to mass and volume to volume. A discrete unit ('slice', 'packet', 'cup', 'scoop')
   only ever matches itself — an ounce is not a scoop and the engine must never assume it is. */
const FF_BASE = {g:['g', 1], oz:['g', 28.349523125], ml:['ml', 1]};
/* The gram weight of ONE discrete unit, so a row written as a count can price off a per-gram fact.
   Read from an explicit `ea:` first, else from a parenthetical already in the unit string — a fact
   declared `unit:'cup (150 g)'` has always carried its own conversion and nothing was reading it. */
function ffEach(fact) {
  if (fact && typeof fact.ea === 'number') return fact.ea;
  const m = /\((\d+(?:\.\d+)?)\s*g\)/.exec(String(fact && fact.unit || ''));
  return m ? parseFloat(m[1]) : null;
}
/* ⛔ I OVER-TIGHTENED THIS AND IT COST ~40 ROWS. The first version required the row's unit to equal
   the fact's exactly, so `['Tuna packet','1',...]` — a quantity of "1" that parses to the generic
   'each' — would not price against a fact declared per 'packet', and 40 rows stayed hand-typed with
   the engine reporting them as unit mismatches. One of a per-packet food IS one packet. The rule:
   a GENERIC 'each' row matches any DISCRETE fact unit (packet, cup, bar, slice, scoop, sheet), and a
   count against a per-MASS fact converts only when the fact states what one unit weighs.
   What is still refused, and must stay refused: mass against volume, and a count against a per-gram
   fact with no stated unit weight. Those are guesses, and a guess is the thing being deleted here. */
function ffScale(fact, n, rowUnit) {
  const factUnit = typeof fact === 'string' ? fact : (fact && fact.unit);
  const fu = ffUnit(factUnit), ru = ffUnit(rowUnit === undefined || rowUnit === null ? factUnit : rowUnit);
  const fb = FF_BASE[fu], rb = FF_BASE[ru];
  if (fb && rb) return fb[0] === rb[0] ? n * rb[1] / fb[1] : null;   /* mass<->mass, volume<->volume */
  if (fb && !rb) {                          /* per-mass fact, counted row: needs a stated unit weight */
    if (ru !== 'each' || fb[0] !== 'g') return null;
    const ea = ffEach(fact);
    return ea === null ? null : n * ea;
  }
  if (!fb && rb) {                          /* per-unit fact, row in grams: same conversion, inverted */
    const ea = ffEach(fact);
    if (ea === null || rb[0] !== 'g') return null;
    return n * rb[1] / ea;
  }
  if (fu === ru) return n;
  return ru === 'each' ? n : null;          /* "1" of a per-packet / per-cup / per-bar food */
}
/* The four macros for one ingredient row. UNROUNDED — see the round-once note above.
   Returns null when the row names something unpriceable, so the guard can fail loudly. */
function priceRow(row) {
  const sp = row && row[2];
  if (!sp) return [0, 0, 0, 0];
  if (Array.isArray(sp)) return sp;                /* legacy copy, on its way out */
  if (sp.free) return [0, 0, 0, 0];
  if (sp.parts) {
    let out = [0, 0, 0, 0];
    for (const p of sp.parts) {
      const m = priceRow([null, null, p]);
      if (m === null) return null;                 /* one bad part condemns the line, not silently */
      out = [out[0]+m[0], out[1]+m[1], out[2]+m[2], out[3]+m[3]];
    }
    return out;
  }
  const f = FOOD_FACTS[sp.f];
  if (!f) return null;                             /* no such fact */
  const n = ffScale(f, sp.n, sp.u);   /* whole fact, so ffScale can read ea: / the unit parenthetical */
  if (n === null) return null;                     /* unit mismatch */
  return [n * f.cal, n * (f.p || 0), n * (f.c || 0), n * (f.f || 0)];
}
/* A variant's total is THE SUM OF ITS ROWS, not a claim about them. Integer-rounded to match what
   [recipe-totals] has always computed, so migrating a row can never silently move a displayed total. */
function varTotal(v) {
  let s = [0, 0, 0, 0];
  for (const r of (v.ing || [])) {
    const m = priceRow(r);
    if (m === null) continue;                      /* [row-math] reports it; do not fake a total */
    s = [s[0]+m[0], s[1]+m[1], s[2]+m[2], s[3]+m[3]];
  }
  return s.map(x => Math.round(x));
}
/* ⛔ THE ASSIGNMENT THAT RETIRES THE STORED TOTAL. Every `t:` literal still in SLOTS is overwritten
   here at boot with the computed sum. For an unmigrated variant the two are identical (that is what
   [recipe-totals] proves), so this is a no-op today and becomes the only source of a total as rows
   migrate. OPTBYID shallow-copies each option but shares its `vars` array by reference, so it sees
   these totals too — do not reorder this above OPTBYID expecting otherwise. */
/* ==== PRICING-ENGINE-END ==== */
SLOTS.forEach(s => s.opts.forEach(o => (o.vars || []).forEach(v => { v.t = varTotal(v); })));
/* Pairs he could plausibly read as interchangeable, expressed as plain substring lists.
   NO REGEX ON PURPOSE: the first version used \b word boundaries, they were written through a
   Python heredoc, and \b became a literal backspace character -- so the check silently matched
   nothing and passed. Substrings cannot be mangled that way.
   A chunk of copy "conflates" if it contains every substring in needA AND every one in needB
   and states no delta. check-food.js FAILS on that. This is the Aug 5 2026 error class, encoded. */

/* He reads the `say` line out loud at the counter, so counts are words, not digits. */
const NUMW = ['','one','two','three','four','five','six','seven','eight','nine','ten',
 'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen'];
const numw = n => NUMW[n] || String(n);
/* Turn a macro budget into an exact order. DETERMINISTIC — the same budget always yields the
   same order, so the card can never contradict itself between two renders. Calories are a HARD
   ceiling: this must not tell him to overeat. Priority is fixed:
     base (always) → anchor to the protein target → carb to fill → spare calories to anchor.
   Anything still short comes home as a patch, which is always cheaper than guessing at the table. */
function eatoutOrder(key, bud){
  const o = EATOUT_ORDER[key];
  if(!o) return null;
  const rows = (o.base||[]).map(it=>({...it, q:1}));
  const A = o.anchor ? {...o.anchor, q:0} : null;
  const C = o.carb   ? {...o.carb,   q:0} : null;
  if(A) rows.push(A);
  if(C) rows.push(C);
  const tot = ()=>rows.reduce((a,x)=>({cal:a.cal+x.cal*x.q, p:a.p+x.p*x.q, c:a.c+x.c*x.q, f:a.f+x.f*x.q}),
                              {cal:0,p:0,c:0,f:0});
  const fits = it => tot().cal + it.cal <= bud.cal;
  /* reserve the carb's minimum up front so the anchor cannot eat the whole budget */
  const hold = C ? C.cal*(C.min||0) : 0;
  if(A){
    while(A.q < A.min) A.q++;                                    /* protein floor is not negotiable */
    while(A.q < A.max && tot().p < bud.p && tot().cal + A.cal + hold <= bud.cal) A.q++;
  }
  if(C){
    /* ADVISORY, not mandatory. Forcing this unconditionally pushed Restaurant Meat to 700 cal
       against a 585 budget. If the starch does not fit, it does not get ordered — the carb gap
       is closed at home by a banana for half the calories. */
    while(C.q < C.min && fits(C)) C.q++;
    while(C.q < C.max && tot().c < bud.c && fits(C)) C.q++;
  }
  if(A) while(A.q < A.max && tot().cal + A.cal <= bud.cal - 20) A.q++;   /* spare cal → protein */
  const t = tot();
  const said = rows.filter(r=>r.q>0).map(r=>String(r.sp||r.n)
    .replace('%', numw(r.q))         /* "nine pieces", never "9 pieces" */
    .replace('#', r.q>1?'s':''));    /* marker sits ON the noun: "two sides of rice" */
  return {rows: rows.filter(r=>r.q>0), tot:t,
          say: said.length>1 ? said.slice(0,-1).join(', ') + ', and ' + said[said.length-1] : said[0],
          shortP: Math.max(0, Math.round(bud.p - t.p)),
          shortC: Math.max(0, Math.round(bud.c - t.c)),
          /* the smallest order that is still a real order can exceed a small bank — say so
             rather than pretend, and name the slot that buys the room */
          over: Math.max(0, Math.round(t.cal - bud.cal)), o};
}

/* Cook day comes from the dish's own `cook` field — the single source of truth for the defrost reminder,
   the Thursday/Friday Today cards, and the recipe chip. Never infer it from the dish NAME again: that old
   /Shawarma/ regex silently mis-filed the Shishlik week (also a Friday-cook dish) as a Thursday cook. */
const feastNow      = () => weekPick(SHABBAT_FEAST);
const feastCookDay  = f => ((f||feastNow()).cook==='fri' ? 5 : 4);   /* 4 = Thu night · 5 = Fri afternoon */
const feastCookWord = f => (feastCookDay(f)===5 ? 'Friday afternoon' : 'Thursday night');
function feastDefrostLine(day){
  const f = feastNow(), cd = feastCookDay(f);
  if(cd===5 && day===5) return ['6:45 AM',`🧊 Feast protein out — ${f.n} cooks TODAY`];
  if(cd===4 && day===4) return ['7:05 AM',`🧊 Feast protein out — ${f.n} cooks tonight`];
  return null;
}
/* Friday 3 PM: grab the COR flavors for the weekend before Shabbat (no shopping Sat). Flavors come from the
   rotating COR_SETS so the reminder always names the RIGHT ones: Saturday = this week; Sunday starts the next
   Sun–Sat week, so it reads from weekIdx()+1. The COR flavor is the part of the combo spec before " COR". */
function friCorLine(day){
  if(day!==5) return null;
  const pick = i => COR_SETS[((i%COR_SETS.length)+COR_SETS.length)%COR_SETS.length];
  const cor = spec => String(spec).split(' COR')[0].trim(); // "Maple &amp; Brown Sugar COR + …" → "Maple &amp; Brown Sugar"
  const wi = weekIdx();
  const sat = cor(pick(wi)[6][1]);     // this week's Saturday
  const sun = cor(pick(wi+1)[0][1]);   // the upcoming Sunday (start of next week's rotation)
  return ['3:00 PM', `🥣 Bring COR home for the weekend — <b>Sat: ${sat}</b> · <b>Sun: ${sun}</b>`];
}

/* auto run-coaching banners from the Runna plan; manual EVENTS for the day take priority */
function runCoaching(){
  if(!RUNNING_ON) return [];           /* running shelved → no run/race banners anywhere */
  if(isNoRun(isoToday())) return [];   /* not running today → no run banners at all */
  if(EVENTS.some(e=>e.d===isoToday())) return [];
  const out = [];
  const now = new Date(), day = now.getDay();
  const rw = runnaWeek(now);
  if(!rw) return out;
  const miles = s => { const m = /([\d.]+)\s*mi/.exec(s); return m? parseFloat(m[1]) : null; };
  const thuMi = miles(rw[2]), sunDesc = rw[3], sunMi = miles(sunDesc);
  if(day===4 && thuMi){
    if(thuMi>=14) out.push({title:`🏃 Long run today — ${thuMi} mi · ~${Math.round(thuMi*10)}–${Math.round(thuMi*11.5)} min. Fueled run.`,
      msg:`<b>Pace: 9:45–10:30 /mi, HR ≤ 155 the whole way</b> — at this distance a fast start ends the run early. <b>1:30 lunch:</b> Chicken Meal, pick RICE over sweet potato. <b>4:45 PM (or 45–60 min before a morning run):</b> Ezekiel + SF jelly AND 1 banana (~290 cal / 65 C) + 16–24 oz water with a hydration stick. <b>Carry:</b> ${thuMi>=18?'3':'2'} kosher gels or ${thuMi>=18?'7-8':'5-6'} Medjool dates + the stick bottle. <b>During:</b> first fuel at minute 45, then every 30–35 min — never wait to feel bad. <b>Within 45 min after:</b> Fairlife 320 mL + ½ scoop as a shake, then dinner ~1 hr later (Poke Bowl if it’s in the menu). The mid-run fuel is EXTRA on top of 2,220 — mandatory, and it goes in the Sunday report to coach.`});
    else if(thuMi>=8) out.push({title:`🏃 Long run today — ${thuMi} mi · ~${Math.round(thuMi*10)}–${Math.round(thuMi*11.5)} min`,
      msg:`<b>Pace: 9:45–10:30 /mi, HR ≤ 155.</b> If HR passes 160, slow down or walk 60 sec — walking counts, blowing up doesn’t. Speed lives on Sunday, not today. <b>Fuel 45–60 min before</b> (morning or evening run): Ezekiel + SF jelly (180 cal / 40 C) + 16 oz water with a hydration stick. <b>Carry:</b> 1 kosher gel or 2–3 Medjool dates — take at minute 45 if you’ll pass 90 minutes. <b>After:</b> eat the snack or dinner within 45 min of finishing — carbs + protein first, don’t wait until 10 PM starving. Any mid-run fuel is extra by design; log it in a note.`});
    else out.push({title:`🏃 Long run today — ${thuMi} mi · easy ~${Math.round(thuMi*10)} min`,
      msg:`<b>~5:00 PM:</b> Yogurt + Banana (Oikos + 1 banana, 200 cal) + 8–16 oz water. <b>Run:</b> conversational pace the whole way — if you can’t talk, slow down. No mid-run fuel needed. <b>After:</b> normal snack and dinner, nothing changes.`});
  }
  if(day===3 && thuMi>=10) out.push({title:`🏃 ${thuMi} mi long run tomorrow — set it up today`,
    msg:`<b>Eat every carb in the plan today — especially the 10 PM dinner carbs (they’re tomorrow’s fuel).</b> Add one extra 30 oz bottle to today’s gallon. Check you have gels/dates + 2 hydration sticks for tomorrow. Lights out by 11:30 — the run is only as good as tonight’s sleep.`});
  if(day===0 && sunDesc){
    if(sunDesc.includes('RACE')) out.push({title:'🏁 RACE DAY — 26.2', msg:'Full race-day plan comes from Claude race week — fueling schedule, breakfast timing, pacing. Nothing new today. Trust the taper.'});
    else if(sunMi) out.push({title:`🏃 Quality run this morning — ${sunDesc}`,
      msg:`<b>45–60 min before:</b> Yogurt + Banana (200 cal) + 8–16 oz water. <b>Warm up:</b> 5 min easy jog + 4 strides before the hard stuff — speed work on cold legs is how hamstrings pop. <b>Hit Runna’s paces, not faster.</b> After: breakfast as normal, then weigh-in report + prep day.`});
  }
  if(day===5 && thuMi>=12) out.push({title:`⚠️ Recovery watch — ${thuMi} mi yesterday`,
    msg:`Legs #2 on tired legs today. <b>Breakfast: pick Bagel w/ Berries</b> (72 C, the biggest-carb option). Longer warmup; drop the last set of anything that gets ugly. Front-load water before Shabbat.`});
  return out;
}

function buildGrocery(counts){
  const agg = new Map();
  Object.entries(counts).forEach(([id,n])=>{
    if(!n || !GROC[id]) return;
    GROC[id].forEach(([grp,item,q,u])=>{
      const key = grp+'|'+item+'|'+u;
      agg.set(key,(agg.get(key)||0)+q*n);
    });
  });
  const out = {};
  [...agg.entries()].forEach(([key,q])=>{
    const [grp,item,u] = key.split('|');
    let disp;
    if(u==='oz') disp = q>=16? `${q} oz (~${(q/16).toFixed(1)} lb)` : `${q} oz`;
    else if(u==='g') disp = `${q} g`;
    else if(u==='ml') disp = `${q} mL (~${Math.ceil(q/1500)} bottle${q>1500?'s':''})`;
    else if(u==='slices') disp = `${q} slices`;
    else if(u==='serving') disp = `${q} serving${q>1?'s':''}`;
    else disp = `× ${q}`;
    (out[grp]=out[grp]||[]).push([item,disp]);
  });
  Object.values(out).forEach(list=>list.sort((a,b)=>a[0]<b[0]?-1:1));
  return out;
}

function tspF(x){
  if(x<0.2) return 'pinch';
  const q = Math.round(x*4)/4, w = Math.floor(q), r = +(q-w).toFixed(2);
  const f = {0:'',0.25:'¼',0.5:'½',0.75:'¾'}[r]||'';
  return `${w||''}${f} tsp`.trim();
}

    if(!sizes.length) return;
    const oz = sizes.reduce((t,z)=>t + z*bySize[z], 0);
    parts.push(`${sizes.map(z=>`${bySize[z]} × ${z} oz`).join(' + ')} ${label} (${oz} oz = ${(oz/16).toFixed(1)} lb)`);
  });
  return parts.length
    ? `Weigh everything RAW first: ${parts.join(' · ')}. Label the bags.`
    : 'Weigh everything RAW first — but nothing in this week’s menu is batch-portioned. Nothing to bag.';
}
function qtyF(q,u,n){
  const m = q*n;
  if(u==='tsp') return tspF(m);
  if(u==='oz') return `${m} oz${m>=16?` (~${(m/16).toFixed(1)} lb)`:''}`;
  if(u==='ct') return m===1?'1':`× ${m}`;
  if(u==='lemon') return m<=0.5?'squeeze':m<=1?'1':Math.ceil(m)+'';
  return `${Math.round(m)} ${u}`;
}

/* protein serving weights in GRAMS, off HIS labels (Jul 17) — he scoops from office
   ziplocks with no containers, so every flavor mention must render its exact grams.
   ½ scoop anywhere = half the flavor's number. Longer names first: bare 'Blueberry
   Muffin' must not shadow 'Blueberry Muffin Ryse' or match the COR flavor. */
const PP_G = [
  ['Chocolate Cookie Blast', 39.1], /* published panel: 1 scoop ~39.1 g = 150 cal / 25 P (Aug 18). Was 41, unsourced — which would have had him weigh ~5% extra for '1 serving' */
  ['Mint Chip Ice Cream', 37],
  ['Milk Chocolate', 37],            /* Ryse Loaded, 1 scoop 37 g = 140 cal · 25P · 4C · 3F, 2 g fiber, 27 servings (label Aug 4) */
  ['Cinnamon Toast', 36],
  ['Vanilla Ice Cream', 35],
  ['Strawberry Shortcake', 34.2],
  ['Grandma’s Apple Pie', 34.1],
  ['Lemon Cake', 33.9],
  ['Transparent Labs unflavored', 33.3],
  ['Piña Colada', 31],
  ['Fruity Pebbles', 30],
  ['Jet-Puffed Marshmallow', 35],    /* Ryse Loaded x Jet-Puffed, 1 scoop 35 g = 130 cal · 25P · 3C · 2.5F, 1 g fiber, 27 servings (label Aug 6) */
  ['Jet-Puffed Birthday Cake', 34.8],/* same collab, 1 scoop 34.8 g = 130 cal · 25P · 4C · 2.5F — sprinkles are IN the powder (label Aug 6) */
  ['Blueberry Muffin Ryse', 34.9],   /* Ryse Loaded, 1 scoop 34.9 g = 140 cal · 25P · 4C · 2.5F (label Jul 27) */
  ['Blueberry Muffin', 34.9],
];
/* PP_G holds PROTEIN-POWDER scoop weights, so a match must actually BE the powder. Two ways it was
   not, both live on the same card until Aug 6 2026 when he caught them:
     "Fruity Pebbles cereal, on top"  q=10 g  ->  stamped "weigh 30 g" (the TUB's scoop) next to 10 g
     "Fruity Pebbles protein"  q="½ serving · 15 g"  ->  stamped the FULL 30 g beside the half
   So: reject a hit whose trailing context names a different product (cereal/wafers/crumbs/topping),
   and reject one already preceded by a weighed gram figure ("20 g Fruity Pebbles" is the box, not a
   scoop). Compound COR specs still resolve, because the protein name matches earlier in PP_G. */
const PP_NOTPOWDER = /cereal|crunch|wafers?|thins|crumbs?|on top|topping/i;
/* A row that OPENS with the other product is that product outright — "Cereal (Fruity Pebbles etc.)".
   Anchored at the start on purpose: a plain "contains cereal anywhere" test would also reject the COR
   flavor "Fruity Cereal", killing the protein weight on every Fruity Cereal combo. */
const PP_ISOTHER = /^\s*(cereal|wafers?|thins|crumbs?|graham|oreos?|biscoff|nilla)\b/i;
function ppFind(txt){
  const s = String(txt||'');
  if(PP_ISOTHER.test(s)) return null;
  for(const e of PP_G){
    const i = s.indexOf(e[0]);
    if(i < 0) continue;
    /* look only a short way past the match: "Fruity Pebbles cereal" and "Fruity Pebbles (or cereal of
       choice)" are the box, while "Vanilla Ice Cream Ryse — berries + 10 g Fruity Pebbles on top" is a
       combo whose PROTEIN still has to resolve. 30 chars separates those cleanly. */
    if(PP_NOTPOWDER.test(s.slice(i + e[0].length, i + e[0].length + 30))) continue;
    if(/\d\s*g\s*$/i.test(s.slice(0, i))) continue;             /* already weighed in the label */
    return e;
  }
  return null;
}
/* `qty` is the row's OWN quantity column. If that already states grams or mL, the row is exact and
   stamping a scoop weight beside it can only contradict it — so say nothing. */
function ppTag(txt, half, qty){
  const hit = ppFind(txt);
  if(!hit) return '';
  if(qty != null && /\d\s*(g|mL)\b/i.test(String(qty))) return '';
  if(hit[1]==null) return ' <span style="color:var(--muted)">· ⚠ serving g not on file — send Claude the label</span>';
  const g = half ? Math.round(hit[1]/2*10)/10 : hit[1];
  return ` · <b>weigh ${g} g</b>${half?' (½ serving)':''}`;
}

/* 👍/😐/👎 rating for the daily flavor picks (COR combo, yogurt bowl, Creami cup). Keyed by a readable
   "type:flavor name" so the rating follows the flavor across the rotation and rides the gist sync
   (qpcut.flavorRatings) → the coach reads which flavors land and which flop. Tap the same thumb to clear. */
function rateBtns(key){
  const v = (store.get('qpcut.flavorRatings',{}))[key] || '';
  const k = encodeURIComponent(key);
  const one = (val,emoji)=>`<button type="button" class="ratebtn${v===val?' on '+val:''}" data-rate="${k}" data-val="${val}" aria-label="rate ${val}">${emoji}</button>`;
  return `<div class="rate"><span class="lbl">rate</span>${one('up','👍')}${one('mid','😐')}${one('down','👎')}</div>`;
}

/* Exact build for a COR combo: b1's rows plus a quantified crunch add-in, which trades cal-for-cal
   against the almond butter. corBuild returns the exact AB grams and the real macro split (which
   shifts — more carb, less fat — with a crunch).
   ⛔ NOTHING IN THIS BLOCK CARRIES A NUMBER ANY MORE, and that is the whole point of the rewrite.
   It used to hold three hand-typed copies, all of them snapshots of b1 taken before its rows were
   re-priced: a per-gram almond-butter array, a `baseNoAB` total, and ONE flat [cal,P,C,F] per topping.
   The first two had drifted, so all 92 combo cards read 1 P and 2 C ABOVE the bowl the engine prices
   — calories looked right, which is why it survived. The third meant “3 Nilla wafers” and “12 g Nilla”
   were charged the same 42 cal regardless of the amount his own spec told him to use.
   His call, 2026-08-24: “there should def not be one flat number for all toppings.”
   So a topping now NAMES its FOOD_FACTS key and nothing else; the quantity comes from the spec text
   and priceRow() prices it — the same engine every ingredient row on every card already goes through. */
const COR_CRUNCH = [['coconut chips','bare coconut chips'],['Cinnamon Toast Crunch','cinnamon toast crunch'],['Fruity Pebbles','fruity pebbles'],['Nilla','nilla wafer'],['Oreo','oreo thin'],['Biscoff','biscoff'],['raisins','raisins'],['graham','graham cracker']];
/* ⛔ 'Fruity Pebbles', NOT 'Fruity Pebbles on top' — the longer key is what broke Double Fruity Cereal
   Milk. Its spec reads “70 g strawberries + 12 g Fruity Pebbles”, the key could not match it, so the
   pebbles fell through to the FRUIT branch: the card dropped his 70 g strawberries, told him to eat
   12 g of cereal in their place, and charged him for neither. The shorter key is why the crunch scan
   below is scoped to the ADD-IN segments and never the whole spec — 'Fruity Pebbles Ryse' sits in the
   protein slot of that same combo, and a whole-spec scan would read the protein as a topping. */
const corKeyRe = k => new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
/* Yogurt bowl of the day. ONE resolver, used by both the Food-zone card and the breakfast log picker,
   so the bowl he is shown is always the bowl he can tap — his ask Aug 3: "when i log breakfast i dont
   want to see all the Yogurt bowl options. just the one for that day is fine."
   Rotates the b5-b18 bowls by day-of-year unless qpcut.bowlpick pins one for that date. */
const bowlIdsAll = () => SLOTS.find(s=>s.key==='bf').opts.filter(o=>/Bowl/.test(o.name)).map(o=>o.id);
function bowlOfDay(isoD){
  const ids = bowlIdsAll(); if(!ids.length) return null;
  const pick = (store.get('qpcut.bowlpick',{}))[isoD];
  if(pick && OPTBYID[pick]) return pick;
  const [Y,M,D] = isoD.split('-').map(Number);
  const doy = Math.floor((new Date(Y,M-1,D) - new Date(Y,0,0))/864e5);
  return ids[doy % ids.length];
}
function corBuild(spec){
  /* base and almond butter both come off b1's OWN rows through the engine — see the COR_CRUNCH note
     above for the stale copies this replaced. b1 is read live so re-pricing a row can never again
     leave these cards behind. */
  const b1v   = OPTBYID['b1'].vars[0];
  const abRow = (b1v.ing||[]).find(r=>/almond butter/i.test(String(r[0])));
  const abF   = FOOD_FACTS['almond butter'];
  const ABP   = [abF.cal, abF.p||0, abF.c||0, abF.f||0];
  const abBase= (abRow && abRow[2] && abRow[2].n) || 0;
  let baseNoAB=[0,0,0,0];
  for(const r of (b1v.ing||[])){ if(r===abRow) continue; const m=priceRow(r); if(m) baseNoAB=baseNoAB.map((x,i)=>x+m[i]); }
  /* parse "<CORflavor> COR + <Protein>[ + <extract>] — <fruit>[ + <crunch>][ + <spice>]" into clean parts */
  const seg = spec.split(' — ');
  const left = seg[0], addins = seg.slice(1).join(' — ');
  const corFlavor = left.split(' COR')[0].trim();
  const lp = left.slice(left.indexOf(' COR')+4).replace(/^\s*\+\s*/,'').split(' + ').map(x=>x.trim()).filter(Boolean);
  const protein = lp[0]||'', extracts = lp.slice(1);
  let fruitLabel='Berries', fruitQty='70 g', crunchLabel='', crunchQty='', crunchSeg='', crunchKey=null;
  const spices=[];
  (addins? addins.split(' + ').map(x=>x.trim()).filter(Boolean):[]).forEach(e=>{
    if(/extract$/i.test(e)) extracts.push(e);
    else if(COR_CRUNCH.some(([k])=>corKeyRe(k).test(e))){
      const m=e.match(/^(\d+(?:\.\d+)?\s*g?)\s+(.*)$/); crunchQty=m?m[1]:''; crunchLabel=cap(m?m[2]:e);
      crunchSeg=e; crunchKey=(COR_CRUNCH.find(([k])=>corKeyRe(k).test(e))||[])[0]||null;
    }
    else if(/cinnamon/i.test(e)) spices.push('Cinnamon');
    else { const m=e.match(/^(\d+(?:\.\d+)?\s*g?)\s+(.*)$/); if(m){ fruitQty=m[1]; fruitLabel=cap(m[2]); } else { fruitLabel=cap(e); fruitQty='70 g'; } }
  });
  /* the topping priced from the amount his own spec states, through the shared engine. Grams price
     straight; a COUNT (“3 Nilla wafers”, “2 de-creamed Oreo thins”) prices off the fact's `ea:`, and
     ffScale refuses a count against a fact that does not state what one unit weighs — so an
     unpriceable topping comes back null here instead of quietly costing nothing. */
  let cm=null, crunchFF=null, crunchUnpriced=false;
  if(crunchKey){
    crunchFF = (COR_CRUNCH.find(([k])=>k===crunchKey)||[])[1] || null;
    /* a de-creamed Thin is a DIFFERENT food from a whole one — most of the fat is in the filling */
    if(crunchFF==='oreo thin' && /de-?creamed/i.test(crunchSeg)) crunchFF='oreo thin wafer';
    const qn = parseFloat(crunchQty);
    if(crunchFF && isFinite(qn) && qn>0) cm = priceRow([null,null,{f:crunchFF, n:qn, u:/g\s*$/i.test(crunchQty)?'g':'each'}]);
    if(!cm) crunchUnpriced = true;   /* [cor-crunch] fails the build on this; never priced as free */
  }
  let ab=abBase;
  if(cm) ab = Math.round((abBase*ABP[0] - cm[0])/ABP[0]*2)/2;
  const mac = [0,1,2,3].map(i=> Math.round(baseNoAB[i] + ab*ABP[i] + (cm?cm[i]:0)));
  return {ab, mac, crunch:crunchKey, crunchFF, crunchUnpriced, corFlavor, protein, extracts, fruitLabel, fruitQty, crunchLabel, crunchQty, spice:spices[0]||''};
}

   back to this weekday's rotation slot rather than silently starting from 0. */

  const eaten = store.get('qpcut.eaten',{}), rec = store.get('qpcut.coreaten',{}), out = new Map();
  const base = new Date((isoD||isoToday())+'T12:00:00');

/* ---------- Creami batch: ONE reader, and it advances itself ----------
   The old code computed `cbDone` — it knew perfectly well the batch was finished — and used that
   only to decide which batch to SHOP for. Moving to the next batch was wired exclusively to a
   "next batch" button on the Prep tab, so it never happened: Batch 4 held 4 cups, he ate all four
   by Aug 3, and the app kept serving him cups from a finished batch. That is exactly what he meant
   by "the upcoming creami batch is the same as always" — and Batch 5, built to answer that
   complaint, had never once appeared.

   The rule this violated is already written down from the hydration-stick bug: a required action's
   trigger may be ADJUSTED by a conditional event, never SUPPLIED by one. A tap is a conditional
   event. Finishing the batch is the real trigger, so finishing the batch is what advances it. */
/* ---- CREAMI TOPPING MACROS — derived from the cup's own component list -------------
   Rebuilt 2026-08-12 after he said: "THE CUP NEEDS TO HAVE TOPPINGS THAT ARE ACTUALLY 140
   CALORIES. ... NO MEAL OR RECIPE SHOULD HAVE THE WRONG MACROS AND CALS."

   The 140 in s1's 'Topping / mix-in (140-cal budget)' row is a SPEC — the snack slot is 330,
   the Creami base is 177, so the topping has to be ~140 for the cup to fill the slot. It was
   not: measured across the 36 cups the real range was 42-173, mean 127. Batch 5 was the worst
   because it was authored for topping VARIETY with no calorie check, so 6 of the 8 worst cups
   were the ones he is eating right now. Every cup is now rebalanced to 140 +/- 8.

   ⭐ THE STRUCTURAL PART, which matters more than the numbers: cup[5] is the component list and
   is the ONLY source. The display sentence (cup[4]) and the macros are both generated from it,
   so a sentence cannot disagree with a number — the same fix that stopped recipe steps
   contradicting their ingredient rows. There is no cached macro table to go stale.

   ⛔ WHIP IS A GARNISH, NOT A CALORIE LEVER. An early solve hit 140 exactly by cutting
   Creamsicle from 9 Nilla wafers to 6 and adding 35 g of whip — perfect number, worse dessert.
   The solver now penalises moving whip away from where the recipe had it, and drops any whip
   under 5 g as a rounding artifact. If a future cup needs calories, add cookie, not air. */
function creamiTopMac(cup){
  const c = cup && cup[5];
  if(!Array.isArray(c) || !c.length) return null;
  const t = [0,0,0,0];
  for(const [k,q] of c){
    const f = FOOD_FACTS[k];
    if(!f) return null;                       /* unknown food -> show nothing, never a guess */
    t[0]+=f.cal*q; t[1]+=f.p*q; t[2]+=f.c*q; t[3]+=f.f*q;
  }
  return [Math.round(t[0]), +t[1].toFixed(1), +t[2].toFixed(1), +t[3].toFixed(1)];
}

/* ============ OFF-PLAN IS PAID OUT OF THE TOPPING ============
   HIS RULE, 2026-08-19, verbatim: "whenever i tell you off track eating that actually matters,
   take the cals from Creami Topping that day. I'd want it as a small note added to the creami
   flavor card that day."

   WHAT CHANGED, and what did not. The off-plan card already existed and already knew the
   threshold — it prints "noise, nothing to offset" under 40 cal. What it then did was hand him
   FIXPOOL as a row of buttons and ask him to choose how to pay. That is a prompt where a default
   belongs: the answer is now computed and the topping is the till.

   ⛔ RENDER-TIME ONLY. The cups still spec 140 and [creami-topping] still enforces every one of
   them. A per-day edit to a cup would make the spec unverifiable, which is the thing that let the
   card print "Topping (140 cal)" on 36 cups for months before he caught it.

   ⛔ THE CAP IS THE TOPPING, NOT THE CUP. He said take it from the topping, so the base cup is
   never touched — if a day's off-plan exceeds what the topping holds, the remainder is surfaced
   rather than quietly eaten by the rest of the snack. */
const OFFPLAN_NOISE = 40;   /* under this, "nothing to offset" — one home for the number now */

function offplanCharge(ld){
  const ops = (store.get('qpcut.offplan',{}))[ld] || [];
  const real = ops.filter(o => (+o.cal || 0) > OFFPLAN_NOISE);
  return { cal: real.reduce((a,o) => a + (+o.cal||0), 0),
           what: real.map(o => o.text).filter(Boolean) };
}

/* Take it off where it shows least — his ranking rule, Aug 18: score a cut by the FRACTION of a
   row it consumes, not by which row is densest. Whip is exempt: it is a garnish, and trimming air
   buys a number without buying a smaller dessert (see creamiTopMac). Cuts land on whole units so
   the instruction is followable — you cannot crush 3.6 Oreos. */
function creamiTrim(cup, charge){
  const comps = (cup && cup[5]) || [];
  if(!(charge > 0) || !comps.length) return null;
  const cand = comps.map(([k,q]) => ({k, q, f:FOOD_FACTS[k]}))
                    .filter(c => c.f && c.k !== 'ff whip' && c.f.cal * c.q > 0);
  if(!cand.length) return null;
  /* 1 g for anything weighed — he owns a scale and weighs the topping — 1 for a counted row. */
  const step = c => (FOOD_FACTS[c.k].unit === 'each' ? 1 : 1);
  const cuts = [];
  let left = charge;
  /* smallest fraction first: the row that can absorb it least visibly */
  cand.sort((a,b) => (charge/(a.f.cal*a.q)) - (charge/(b.f.cal*b.q)));
  for(const c of cand){
    if(left <= 0) break;
    const s = step(c), per = c.f.cal * s;
    let take = 0;
    /* ⛔ NEVER OVERSHOOT. Only take a step that still fits inside what he actually owes —
       removing more of the dessert than the debt is a cost he did not agree to. */
    while((left - per) >= 0 && (c.q - take - s) >= 0){ take += s; left -= per; }
    /* a sub-step remainder is not a followable quantity — finish the row off if it fits */
    const rest = +(c.q - take).toFixed(2);
    if(rest > 0 && rest < s && (left - c.f.cal*rest) >= 0){ take += rest; left -= c.f.cal*rest; }
    if(take > 0) cuts.push({k:c.k, from:c.q, to:+(c.q - take).toFixed(2), cal:Math.round(c.f.cal*take)});
  }
  if(!cuts.length) return null;
  const short = Math.max(0, Math.round(left));
  return { cuts, short: short <= 5 ? 0 : short };   /* <=5 cal is noise, not an instruction */
}

/* The note for the flavor card. Instruction + number only: what comes off, what it is paying
   for, and the exact new quantity. No macro readout — he does not read those and said so. */
function offplanNote(ld, cup){
  const ch = offplanCharge(ld);
  if(!ch.cal) return '';
  const top = creamiTopMac(cup);
  const cap = top ? top[0] : 0;
  const paying = ch.what.length ? ' (' + ch.what.join(', ') + ')' : '';
  if(cap && ch.cal >= cap)
    return '🍪 <b>No topping tonight</b> — ' + ch.cal + ' cal off-plan' + paying +
           '. Spin the cup plain.' + (ch.cal > cap ? ' Still ~' + (ch.cal - cap) + ' to cover.' : '');
  const t = creamiTrim(cup, ch.cal);
  if(!t) return '🍪 <b>−' + ch.cal + ' off the topping</b>' + paying + '.';
  const how = t.cuts.map(c => { const n = c.k.replace(/^(bare|fd|sf|ff) /,'');
    return c.to <= 0 ? ('no ' + n) : (n + ' ' + c.from + ' → ' + c.to); }).join(', ');
  return '🍪 <b>−' + ch.cal + ' off the topping</b>' + paying + ': ' + how + '.' +
         (t.short ? ' Still ~' + t.short + ' to cover.' : '');
}
/* Base = s1's first TWO ingredient rows (Fairlife + Ryse), read from the cookbook so it cannot
   drift from the meal it describes. bud = s1's total, i.e. what the snack slot books. */
function creamiTop(cup){
  const mac  = creamiTopMac(cup);
  const o    = OPTBYID['s1'];
  const ing  = (o && o.vars[0].ing) || [];
  const base = ing.slice(0,2).reduce((a,r)=>({cal:a.cal+r[2][0], p:a.p+r[2][1], c:a.c+r[2][2], f:a.f+r[2][3]}),
                                     {cal:0,p:0,c:0,f:0});
  const bud  = (o && o.vars[0].t) || [317,32,30,7];
  if(!mac) return {mac:null, base, bud};
  return {mac, base, bud, total:{cal:base.cal+mac[0], p:base.p+mac[1], c:base.c+mac[2], f:base.f+mac[3]}};
}
/* ============ BUFFIN STOCK — one of each, so "do I still have one" is the real question ==========
   HIS ASK, 2026-08-19: "Ye track which ones I eat." He bought a mixed box, one muffin per flavor.
   Once the eleven were in FOOD_FACTS the app could PRICE a Buffin but had no idea whether he still
   owned it, which makes the price useless — it would cheerfully suggest a flavor he ate on Sunday.

   ⛔ THE LIST IS DERIVED, NEVER RETYPED. Every flavor and every macro is read out of FOOD_FACTS by
   key prefix, so this card cannot drift from the price list the way a second copy always does. Add
   a flavor to FOOD_FACTS and it appears here; there is nothing to keep in sync.

   Sorted CHEAPEST FIRST, because that is the decision he is actually making: the muffin replaces
   the Creami, and every calorie above the cheapest one comes out of his dinner. */
function buffinList(){
  return Object.keys(FOOD_FACTS).filter(function(k){ return k.indexOf("buffin ") === 0; }).map(function(k){
    var f = FOOD_FACTS[k];
    /* Presentation only — the macros still come from FOOD_FACTS. Title-casing alone produced
       "Twistbar", "Welcome To The Sno" and "Apple Pie-ceps"; the brand writes them otherwise, and a
       flavor name he reads off a card should match the wrapper he is holding. */
    var SMALL = {to:1, the:1, and:1, n:1, a:1};
    var SPELL = {twistbar:"TwistBar", chocolit:"ChocoLIT", buffcoff:"Buffcoff"};
    var cap = function(w){ return w.split("-").map(function(p){
      return p ? p.charAt(0).toUpperCase() + p.slice(1) : p; }).join("-"); };
    var nm = k.slice(7).split(" ").map(function(w, i){
      if(SPELL[w]) return SPELL[w];
      if(i > 0 && SMALL[w]) return w;
      return cap(w);
    }).join(" ");
    return {key:k, name:nm, cal:f.cal, p:f.p, c:f.c, f:f.f, nut:!!f.nut};
  }).sort(function(a,b){ return a.cal - b.cal; });
}

function creamiState(){
  const cb = store.get('qpcut.creamibatch',{idx:0,started:null});
  const at = i => CREAMI_BATCHES[((i % CREAMI_BATCHES.length) + CREAMI_BATCHES.length) % CREAMI_BATCHES.length];
  const used = cb.started
    ? Object.entries(store.get('qpcut.eaten',{})).filter(([d,m])=>d>=cb.started && m.sn==='s1').length
    : 0;
  const cur = at(cb.idx);
  if(cb.started && used >= cur.cups.length){
    const nx = { idx: (cb.idx+1) % CREAMI_BATCHES.length, started: isoToday() };
    store.set('qpcut.creamibatch', nx);
    return { idx:nx.idx, started:nx.started, used:0, batch:at(nx.idx), next:at(nx.idx+1),
             cup:0, justAdvanced:true, prev:cur };
  }
  return { idx:cb.idx, started:cb.started, used, batch:cur, next:at(cb.idx+1),
           cup:used, justAdvanced:false, prev:null };
}

   should sort into place but NEVER get hidden as "past". Bare H:MM with no AM/PM is AMBIGUOUS — resolved
   against prevMin (the previous timed row): pick the AM-or-PM reading that keeps the day moving forward,
   since these lists are chronological. So 9:00 first → AM, 7:00 after 3:00 → PM, 11:00 after 7 PM → PM.
   "AM" anchors to 6:00 so it collapses once the day's rolling; "After"/"—" stay unhidden forever. */

  if(/^am$/i.test(raw)) return {m:360, timed:true};
  const hm = /^~?\s*(\d{1,2}):(\d{2})\s*(AM|PM)?$/i.exec(raw);

    if(ap){ const h=/pm/i.test(ap)? h12+12 : h12; return {m:h*60+mm, timed:true}; }
    /* bare hour, no AM/PM — AMBIGUOUS. Resolve CHRONOLOGICALLY so the list stays ordered whether the day
       starts in the morning or the afternoon: pick the reading (AM or PM) that is >= the previous timed
       row and closest to it. First row (prev<0): a bare 7-12 defaults to AM (mornings start early); a bare
       1-6 defaults to PM (his day has nothing 1-6 AM — minyan/gym own that window). Best practice for NEW
       overrides: write an explicit "AM"/"PM" and skip the guessing entirely. */
    const am=h12*60+mm, pm=(h12+12)*60+mm;
    const prev = (typeof prevMin==='number')? prevMin : -1;
    let m;
    if(prev<0){ m = (hRaw>=1&&hRaw<=6)? pm : am; }
    else if(am>=prev) m=am;      // earliest reading that doesn't go backwards
    else if(pm>=prev) m=pm;
    else m=am;

/* -- merged day timeline: curated minutes + 🔔 reminders + 🧊 defrost -- */
function mergedTimeline(){
  const wd = new Date().getDay();
  const T = dayTimeline().map(([m,l])=>({m, l, rem:false}));
  const strip = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  const rows = [...(REMIND_MIRROR[wd]||[])];
  const fd = feastDefrostLine(wd); if(fd) rows.push(fd);
  const fc = friCorLine(wd); if(fc) rows.push(fc);
  rows.forEach(([tStr,x])=>{
    const m = parseClock(tStr);
    if(m==null){ T.push({m:1441, l:x, rem:true}); return; }
    const words = strip(x).split(' ').filter(w=>w.length>=5);
    const dupe = !/🧊/.test(x) && T.some(it=>Math.abs(it.m-m)<=6 && words.some(w=>strip(it.l).includes(w)));
    if(!dupe) T.push({m, l:x, rem:true});
  });
  return T.sort((a,b)=>a.m-b.m);
}

function timelineCardHTML(){
  const T = mergedTimeline();
  if(!T.length) return '';
  /* live day: rows already behind you collapse into a "✓ n done" toggle — only what's left shows */
  const live = logDate==null || logDate===isoToday();
  const m = live? nowMin() : -1;
  let curIdx = -1; T.forEach((it,i)=>{ if(it.m<=m) curIdx=i; });
  const doneN = Math.max(0, curIdx);
  /* the whole schedule rolls up — open/closed state persists across reloads via qpcut.sched.open. */
  const open = schedOpen();
  const cur = live && curIdx>=0 ? T[curIdx] : null;
  /* when CLOSED, the summary shows now + next. NEXT prefers the dynamic eat suggestion (named meal +
     adjusted time, e.g. "Lunch 3:05 PM") so it matches the NOW-strip; falls back to the next timeline row. */
  const eatSug = live? nextEatSuggestion(isoToday()) : null;
  let nextStr = '';
  /* a blocked slot has no time to print — say so instead of inventing one */
  if(eatSug && eatSug.target) nextStr = eatSug.blocked
    ? ` · <b>${eatSug.label} blocked today</b>`
    : ` · next <b>${eatSug.label} ${fmtMin(eatSug.mins)}</b>`;
  else { const nextTL = live && curIdx>=0 && curIdx+1<T.length ? T[curIdx+1] : null; if(nextTL) nextStr = ` · next ${fmtMin(nextTL.m)}`; }
  const glance = cur? `now · <b>${cur.l.replace(/<[^>]+>/g,'').slice(0,24)}</b>${nextStr}` : '';
  return `
  <details class="card acc" data-acc="schedule"${open?' open':''}>
    <summary><span class="slotlbl" style="margin-top:0;display:inline">📋 The day</span>${glance?`<span class="statline">${glance}</span>`:''}</summary>
    <ul class="sched" id="dayTL" style="margin-top:8px">
      ${live? `<li class="tlpast" id="tlPast" data-tlpast${doneN>0?'':' hidden'}><span class="t">✓</span><span id="tlPastTxt">${doneN} done · show</span></li>`:''}
      ${T.map((it,i)=>{
        const cls = [it.rem?'rem':'', live&&i<curIdx?'past':'', live&&i===curIdx?'cur':''].filter(Boolean).join(' ');
        return `<li data-min="${it.m}"${cls?` class="${cls}"`:''}><span class="t">${it.m>1440?'—':fmtMin(it.m)}</span><span>${it.l}</span></li>`;
      }).join('')}
    </ul>
  </details>`;
}

/* -- session lifecycle (additive key qpcut.sesh.<dkey>) -- */
function seshGet(ld){ return store.get('qpcut.sesh.'+dkey(ld), null); }
function setsPlanned(wo){ return wo? wo.ex.reduce((a,[,r])=>{ const t=parseTargets(r); return a+(t?t.sets:(parseInt(r)||3)); },0) : 0; }
function setsDone(ld){ const reps=store.get('qpcut.reps.'+dkey(ld),{}); return Object.entries(reps).filter(([k])=>!/^core/.test(k)).reduce((a,[,arr])=>a+(arr||[]).filter(v=>v!=null).length,0); }
/* the day's lift is LOGGED/done — session ended or sets recorded. Once true, the gym-approach items
   (pre-lift meal, Pump Caps, leave, lift window) are pulled from the schedule — they no longer belong. */
function liftLoggedToday(ld){ const s=seshGet(ld); return !!(s&&s.end) || setsDone(ld)>0; }
function seshStart(){
  store.set('qpcut.sesh.'+dkey(isoToday()), {start:Date.now(), end:null});
  openAcc.add('lift'); render();
  const el = document.getElementById('z-lift'); if(el) el.scrollIntoView({behavior:'smooth'});
}
function seshFinish(){
  const k = 'qpcut.sesh.'+dkey(isoToday());
  const s = store.get(k,null);
  if(s && !s.end){ s.end = Date.now(); store.set(k,s); }
  render();
}
function seshSummaryHTML(ld, wo){
  const s = seshGet(ld);
  if(!s || !s.end || !wo) return '';
  const mins = Math.max(1, Math.round((s.end-s.start)/60000));
  const locS = store.get('qpcut.loc','deal');
  const scored = wo.ex.map(([n,r],i)=>({n:n.replace(/<[^>]*>/g,''), s:scoreFull(ld, i, [n,r], locS)}));
  const verdicts = scored.filter(x=>x.s.v).map(x=>({n:x.n, v:x.s.v}));
  const ups = verdicts.filter(x=>x.v==='up');
  /* an unanswered load drop is not "no GO UP" — it is an unscored session, and saying so here is the
     only place he sees it without opening every exercise */
  const waiting = scored.filter(x=>x.s.gate||x.s.wild||x.s.fixme).map(x=>x.n);
  return `
  <div class="card seshsum">
    <div class="slotlbl" style="margin-top:0">✅ Session done · ${mins} min · ${setsDone(ld)} sets</div>
    ${waiting.length?`<div style="margin-top:6px;color:var(--meat)">⏸ <b>Not scored yet:</b> ${waiting.join(' · ')} — the weight dropped, open it and say why.</div>`:''}
    ${ups.length?`<div style="margin-top:6px">🎉 <b>GO UP next time:</b> ${ups.map(x=>x.n).join(' · ')}</div>`:(waiting.length?'':'<div class="sub" style="margin-top:6px">No GO UPs today — beat one rep next session, that’s the win.</div>')}
    ${verdicts.filter(x=>x.v==='down').length?`<div class="sub" style="margin-top:4px">⬇ Lighten: ${verdicts.filter(x=>x.v==='down').map(x=>x.n).join(' · ')}</div>`:''}
    <div class="sub" style="margin-top:6px">Now: tap <b>session effort</b> below + the <b>reps-left-in-tank</b> chips on your last sets — that data shapes next week's calls.</div>
  </div>`;
}

/* -- rest timer: absolute deadline, patched by a 1 s ticker, never re-renders -- */
const REST = {end:0, wasLive:false};
let AC = null; /* shared AudioContext, primed inside the user-gesture arm so iOS lets it sound later */
function armRest(sec){
  REST.end = Date.now()+sec*1000;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  tickRest();
}
function stopRest(){ REST.end = 0; tickRest(); }
function tickRest(){
  const chips = [document.getElementById('restChip'), document.getElementById('zbRest'), document.getElementById('timerDisp')];
  const remS = Math.ceil((REST.end - Date.now())/1000);
  const live = REST.end>0 && remS>-25;
  if(REST.end>0 && remS<=0 && REST.wasLive){ REST.wasLive=false; beep(); }
  if(REST.end>0 && remS>0) REST.wasLive = true;
  if(REST.end>0 && remS<=-25) REST.end = 0;
  chips.forEach(c=>{
    if(!c) return;
    const isDisp = c.id==='timerDisp';
    if(!live){ c.textContent = isDisp? '--:--' : ''; c.classList.remove('go','live','done'); return; }
    c.classList.add('live');
    if(remS<=0){ c.textContent = isDisp? 'GO' : 'GO — lift'; c.classList.add(isDisp?'done':'go'); }
    else { c.textContent = `${Math.floor(remS/60)}:${String(remS%60).padStart(2,'0')}`; c.classList.remove('go','done'); }
  });
}

/* -- next action + nudge -- */
function nextAction(){
  const t = isoToday(), m = nowMin(), wd = new Date().getDay();
  const eaten = (store.get('qpcut.eaten',{}))[t]||{};
  const wo = workoutFor(wd, store.get('qpcut.loc','deal'));
  const sesh = seshGet(t);
  const wToday = allWeights().some(e=>e.d===t && e.w!=null);
  if(!wToday && m>=440 && m<660 && wd!==6) return {label:'⚖️ Log the weigh-in', tab:'track'};
  const glM = gymLeaveMin(wd, t);
  if(wo && glM!=null && wd!==6){
    const lift = glM+15;
    if(sesh && !sesh.end) return {label:`🏋 Lift live — ${setsDone(t)}/${setsPlanned(wo)} sets`, jump:'z-lift'};
    if(!sesh && m>=lift-10 && m<=lift+150) return {label:'▶ Start the lift session', sesh:true};
    if(!eaten.pre && m>=lift-75 && m<lift-10) return {label:'🍌 Log the pre-lift meal', jump:'z-log', slot:'pre'};
  }
  const wins = {bf:[590,750,'breakfast'], lu:[770,930,'lunch'], di:[1140,1330,'dinner']};
  for(const [k,[a,b,nm]] of Object.entries(wins)){
    if(m>=a && m<=b && !eaten[k]) return {label:`🍽 Log ${nm}`, jump:'z-log', slot:k};
  }
  if(!(wd===5&&m>=1020) && wd!==6 && m>=1230 && !eaten.sn) return {label:'🍦 Log the snack', jump:'z-log', slot:'sn'};
  const dials = store.get('qpcut.dials.'+dkey(t),{});
  if(m>=1230 && !(dials.e&&dials.h)) return {label:'🎛 Do tonight’s dials', jump:'z-log', acc:'log-dials'};
  /* Supplements get a real trigger. Before this they had none: the stack drawer is collapsed and
     renders the same at 6 AM as at 11 PM, so adherence tracked list POSITION rather than value
     (idx0 creatine 100% -> idx5 fish oil 52%, idx6 stick 57%). SUPPS indexes: 0 creatine,
     5 fish oil, 6 stick. These sit LAST so a supp never outranks the weigh-in or an unlogged meal. */
  const sup = store.get('qpcut.supps.'+dkey(t),[]);
  if(m>=390 && m<720 && !sup.includes(6)) return {label:'💧 Take the Ryse stick', jump:'z-log', acc:'log-stack'};
  if(m>=1140 && !sup.includes(5)) return {label:'💊 Fish oil — with dinner', jump:'z-log', acc:'log-stack'};
  if(m>=1200 && !sup.includes(0)) return {label:'💊 Creatine — 8 capsules', jump:'z-log', acc:'log-stack'};
  /* He exports Garmin every Monday morning and sends the files to Claude in chat. Weekly actions need a trigger too — that is the whole
     lesson of the hydration stick sitting at 57% because its only trigger was a lift. */
  const gLast = (store.get('qpcut.garmin',{})||{}).last;
  const gStale = !gLast || (new Date(t+'T12:00:00') - new Date(gLast+'T12:00:00'))/864e5 >= 5;
  if(wd===1 && m>=420 && m<840 && gStale) return {label:'⌚ Send Claude this week’s Garmin export', jump:'z-log', acc:'log-recov'};
  return null;
}
function nudgeInfo(){
  const t = isoToday(), m = nowMin(), wd = new Date().getDay();
  if(wd===6 || (wd===5 && m>=1080)) return null;
  const snoozed = k => { try{ return sessionStorage.getItem('nudge.'+k+'.'+t)==='1'; }catch(e){ return true; } };
  const wToday = allWeights().some(e=>e.d===t && e.w!=null);
  if(!wToday && m>=540 && m<720 && !snoozed('weigh')) return {k:'weigh', txt:'No weigh-in yet — scale before food beats scale after.'};
  const le = store.get('qpcut.lastexport',null);
  if((!le || (Date.now()-new Date(le+'T12:00:00').getTime() > 7*864e5)) && !snoozed('backup')) return {k:'backup', txt:'Backup is over a week old — Track → Export takes 5 seconds.'};
  if(syncCfg().gist){ const last=+(localStorage.getItem('qpcut.sync.last')||0);
    if(last && Date.now()-last > 48*36e5 && !snoozed('sync')) return {k:'sync', txt:'Cloud sync hasn’t run in 2+ days — open Track and hit Sync now.'}; }
  const eaten = (store.get('qpcut.eaten',{}))[t]||{};
  if(m>=1290 && !eaten.di && !snoozed('dinner')) return {k:'dinner', txt:'Dinner isn’t logged — 30 seconds keeps the streak honest.'};
  return null;
}
function nowStripInner(){
  const ov = OVERRIDES[isoToday()];
  if(ov) return `<div class="ns-cur">📌 ${ov.title}</div><div class="ns-next">Adjusted day — today runs off the schedule card below.</div>`;
  const T = dayTimeline();
  const m = nowMin();
  const idx = T.findIndex(([tm])=>tm>m);
  const cur = idx===-1? T[T.length-1] : (idx===0? null : T[idx-1]);
  const next = idx===-1? null : T[idx];
  const act = nextAction();
  const nd = nudgeInfo();
  const first = T.length? T[0][0] : 360, last = T.length? T[T.length-1][0] : 1380;
  const prog = Math.max(0, Math.min(100, (m-first)/(last-first)*100));
  /* DYNAMIC next-eat wins: if he's logged a meal with a time, the "next" line uses the healthiest
     next-eat time (based on when he actually ate) instead of the fixed schedule slot. Falls back to
     the fixed timeline for non-meal next-stops (lift, minyan, etc.) or before anything's logged. */
  const eatSug = nextEatSuggestion(isoToday());
  let nextLine;
  if(eatSug && eatSug.target && eatSug.blocked){
    nextLine = `<div class="ns-next">${eatSug.label} · <b>no window today</b> — ${esc(eatSug.why||'')}</div>`;
  } else if(eatSug && eatSug.target){
    const dm = eatSug.mins - m;
    const inStr = dm>0? ` · in ${dm>=60? Math.floor(dm/60)+'h '+(dm%60)+'m' : dm+'m'}` : ' · now';
    nextLine = `<div class="ns-next">next meal · <b>${fmtMin(eatSug.mins)}</b> ${eatSug.label}${inStr}${eatSug.past?' — eat soon':''}</div>`;
  } else {
    nextLine = next? `<div class="ns-next">next · <b>${fmtMin(next[0])}</b> ${next[1]}${next[0]>m?` · in ${next[0]-m>=60? Math.floor((next[0]-m)/60)+'h '+((next[0]-m)%60)+'m' : (next[0]-m)+'m'}`:''}</div>` : '<div class="ns-next">Day’s script is done — dials, sleep.</div>';
  }
  return `
    <div class="ns-cur">${cur? cur[1] : 'Early — first stop below.'}</div>
    ${nextLine}
    ${act? `<button class="nact" ${act.tab?`data-nact-tab="${act.tab}"`:''} ${act.jump?`data-nact-jump="${act.jump}"`:''} ${act.slot?`data-nact-slot="${act.slot}"`:''} ${act.acc?`data-nact-acc="${act.acc}"`:''} ${act.sesh?'data-nact-sesh="1"':''}>${act.label}</button>` : ''}
    ${nd? `<div class="nudge"><span>💡 ${nd.txt}</span><button class="nx" data-nsnooze="${nd.k}" aria-label="dismiss">×</button></div>` : ''}
    <div class="dayprog"><i style="width:${prog}%"></i></div>`;
}

/* -- the 30 s heartbeat: patch, never render -- */
function tickNow(){
  if(document.hidden) return;
  if(current==='today' && (logDate==null || logDate===isoToday())){
    const strip = document.getElementById('nowStrip');
    if(strip) strip.innerHTML = nowStripInner();
    const m = nowMin();
    let curLi = null, doneN = 0;
    document.querySelectorAll('#dayTL li[data-min]').forEach(li=>{
      const tm = +li.dataset.min;
      li.classList.remove('cur');
      li.classList.toggle('past', tm <= m);
      if(tm <= m){ curLi = li; doneN++; }
    });
    if(curLi){ curLi.classList.remove('past'); curLi.classList.add('cur'); doneN--; }
    const tp = document.getElementById('tlPast');
    if(tp){
      tp.hidden = doneN<1;
      const tl = document.getElementById('dayTL');
      const tx = document.getElementById('tlPastTxt');
      if(tx) tx.textContent = `${doneN} done · ${tl && tl.classList && tl.classList.contains('showpast')? 'hide':'show'}`;
    }
  }
  refreshTabBadges();
}

function applyMealFilter(){
  if(current!=='meals') return;
  const q = mealQ.trim().toLowerCase();
  const filtering = !!(q || mealKF);
  document.querySelectorAll('#view details[data-search]').forEach(d=>{
    const okQ = !q || d.dataset.search.includes(q);
    const okK = !mealKF || (d.dataset.kosher||'').includes(mealKF);
    d.style.display = (okQ && okK)? '' : 'none';
  });
  window.__filterOpening = true; /* suppress openAcc persistence for the programmatic opens below */
  document.querySelectorAll('#view [data-slotsec]').forEach(sec=>{
    const any = [...sec.querySelectorAll('details[data-search]')].some(d=>d.style.display!=='none');
    sec.style.display = any? '' : 'none';

    if(filtering && any) sec.open = true;
    else if(!filtering) sec.open = openAcc.has('meals-'+sec.dataset.slotsec); /* no filter → restore user's toggle */
  });
  window.__filterOpening = false;
}

/* -- accordion open state: EVERYTHING STARTS CLOSED --
   ⛔ Aug 10 2026, his instruction, and it is absolute: "make sure all rollups are closed on
   default, cuz i dont want to have to close them everytime i open the page."
   This function used to TIME-SEED sections open — hydration mid-day, dials/stack after 8 PM,
   the lift card around gym time, the Friday cards after noon. The seed was guarded so it ran
   only once per calendar day, but that only meant he re-closed them ONCE A DAY, every day,
   forever. His storage on Aug 10 had `{"lift":false,"log-hydr":false}` — him closing the same
   two cards again that morning. That is the whole complaint, in his own data.
   ⚠️ DO NOT RE-ADD TIME-BASED SEEDING. If something needs to catch his eye at a given hour,
   put it in the summary line as a statline/badge — the summary is always visible when the
   body is collapsed, so it costs him nothing to dismiss. Opening a section on his behalf
   spends his attention; a badge asks for it.
   All that remains is restoring HIS OWN toggles from earlier today. */
function seededDayGet(){ return localStorage.getItem('qpcut.seededday'); }
function seededDaySet(t){ try{ localStorage.setItem('qpcut.seededday', t); }catch(e){} }
function userToggledToday(){ try{ return JSON.parse(localStorage.getItem('qpcut.acctoggled.'+isoToday())) || {}; }catch(e){ return {}; } }
function markToggled(id, open){
  const t = isoToday(); const m = userToggledToday(); m[id] = !!open;
  try{ localStorage.setItem('qpcut.acctoggled.'+t, JSON.stringify(m)); }catch(e){}
}
function seedOpenAcc(){
  const t = isoToday();
  const tog = userToggledToday();               // restore any explicit toggles from earlier today first
  /* meal slots (meals-*) are session-only — never restore them, so a filter force-open can't leave a slot
     stuck open across reloads and the Meals tab always starts with slots collapsed (clean). */
  Object.entries(tog).forEach(([id,open])=>{ if(id.startsWith('meals-')) return; if(open) openAcc.add(id); else openAcc.delete(id); });
  /* seededDay is still stamped so the key stays meaningful to anything that reads it, but there
     is nothing left to seed — see the banner above before adding anything here. */
  if(seededDayGet()!==t) seededDaySet(t);
}

/* -- time-aware zone order: the hour decides what sits under the NOW hero -- */
/* ---------- where the Morning Bag sits ----------
   His ask: "it should be there in the morning from 5-10am and the night before from 9pm-2am. during the
   other hours it should move to the bottom just like you have other cards moving." Same idea as
   zoneOrder(): the card that is the next action leads, and everything else sinks.
   ⛔ THE NIGHT WINDOW CROSSES MIDNIGHT, so it is TWO tests, not a range. Written as m>=1260 || m<120,
   because a naive m>=1260 && m<120 is never true and the card would simply vanish every night —
   silently, since nothing renders an error for a card that just decided not to appear.
   A previewed or backfilled date has no meaningful "now"; opening a specific day is itself the planning
   case, so the bag leads there. */
const BAG_MORNING = [300, 600];    /* 05:00–10:00, packing it */
const BAG_NIGHT   = [1260, 120];   /* 21:00–02:00, packing it the night before — WRAPS past midnight */
function bagAtTop(backfill, atMin){
  if(backfill) return true;
  /* atMin is for tests. nowMin is a scoped const, so a test cannot stub it — the first attempt to check
     these boundaries patched globalThis.nowMin, changed nothing, and reported the card as leading at
     1 PM. A rule about time that cannot be exercised at a chosen time is a rule nobody can verify. */
  const m = (typeof atMin === 'number') ? atMin : nowMin();
  return (m>=BAG_MORNING[0] && m<BAG_MORNING[1]) || (m>=BAG_NIGHT[0] || m<BAG_NIGHT[1]);
}
function zoneOrder(){
  const m = nowMin(), wd = new Date().getDay(), td = isoToday();
  const glM = gymLeaveMin(wd, td);
  const lift = glM!=null? glM+15 : null;
  const wo = workoutFor(wd, store.get('qpcut.loc','deal'));
  const sesh = seshGet(td);
  const ended = !!(sesh && sesh.end);
  const liftLive = !!(sesh && sesh.start && !ended);
  /* Lift LEADS while it's live, inside its window, or still upcoming earlier today. It's DONE (drops to
     the very bottom) once the session ends, its window has passed, there's no lift today, or it's Shabbat.
     Sets logged mid-window do NOT demote it — you're still on the floor. */
  const inWindow = !!wo && !ended && lift!=null && wd!==6 && m>=lift-75 && m<=lift+150;
  const upcoming = !!wo && !ended && lift!=null && wd!==6 && m<lift-75;
  const liftDone = !wo || ended || wd===6 || (lift!=null && m>lift+150);
  if(!liftDone && (liftLive || inWindow || upcoming)) return ['lift','log','food','tools'];
  /* COOK window → Food leads (cooking needs lead time): weekday dinner prep 4–7 PM, or Friday Shabbat-feast
     prep ~2:30 PM until the feast. OTHERWISE Log leads — logging the meal you're about to eat is the default
     next action, so the Log card (with that meal marked "next") sits right under the NOW hero. A done lift
     always sinks to the bottom. */
  const isFri = wd===5;
  const cook = (!isFri && m>=960 && m<1140) || (isFri && m>=870 && m<1200);
  return cook ? ['food','log','tools','lift'] : ['log','food','tools','lift'];
}

/* -- tiny sparkline -- */
function sparkHTML(vals, w, h, color){
  w=w||96; h=h||30; color=color||'var(--brass)';
  const v = vals.filter(x=>x!=null);
  if(v.length<2) return '';
  const min = Math.min(...v), max = Math.max(...v), span = (max-min)||1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-3-(x-min)/span*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}

/* Sides that close a residual the dish itself cannot reach. Rendered under a SEPARATE "on the side"
   heading and never folded into the method — a side smuggled into a recipe's steps is exactly how a
   recipe starts contradicting itself. */
const FINAL_SIDES = [

  {id:'ezek',   lanes:['pareve','dairy','meat'], label:'Ezekiel bread, toasted', unit:'slice',  per:[80,5,15,0.5],  hi:3,   step:1},
  {id:'tuna',   lanes:['pareve','dairy','meat'], label:'Tuna packet',            unit:'packet', per:[70,17,0,0],    hi:3,   step:1},

/* ⭐ PROTEIN IS SCORED ASYMMETRICALLY, and that is a nutrition call not a fudge. `gap` is target minus
   actual, so gap[1] > 0 means SHORT. On a cut, landing OVER on protein is harmless — arguably good —
   while landing under is the one miss that matters, because he cannot backfill it tomorrow. Scoring
   |deficit| and |surplus| equally made the solver refuse a dairy plate that overshot 45 P by 15 and
   pick a worse-fitting one instead. The dairy dishes have high protein floors by nature: one jiben
   block is 42 P before anything else joins it. So: deficit costs 2.5x, surplus 0.6x. */
const fmErr   = g => (g[1] > 0 ? 2.5*g[1] : 0.6*(-g[1])) + Math.abs(g[2]) + Math.abs(g[3]);
/* Calories are ALSO asymmetric, and in the opposite direction to protein: he is cutting, so overshooting
   the day's remaining calories is a worse miss than landing under it. Without this, loosening the protein
   surplus penalty above let the solver reach for a third frozen unit and sail 112 cal past the target.
   gap[0] > 0 = under = cheap; gap[0] < 0 = over = expensive. */
const fmScore = g => fmErr(g) + (g[0] >= 0 ? g[0]/4 : (-g[0])/1.4);
/* 2x2 solve for the two flexible sides, once protein is pinned to whole units */
function solve2(a, b, tC, tF){
  const det = a[0]*b[1] - a[1]*b[0];
  if(!isFinite(det) || Math.abs(det) < 1e-9) return null;
  return [(tC*b[1] - tF*b[0])/det, (a[0]*tF - a[1]*tC)/det];
}
const fmSnap = (x, a) => { const st = a.step || 1;
  return Math.max(a.lo, Math.min(a.hi, Math.round(x/st)*st)); };
const fmMac = (a, n) => a.per.map(v => v*n);
const fmPlural = (n,u) => n===1 ? `${n} ${u}`
  : `${n} ${u==='patty' ? 'patties' : /^(packet|slice|cup|cake|bag)$/.test(u) ? u+'s' : u}`;
/* frozen units also print the total oz, because that is the number he thinks in */
const fmQty = (a, n) => a.frozen ? `${fmPlural(n, a.unit)} (${n*6} oz)` : fmPlural(n, a.unit);

/* which kashrut lanes are legal right now, and when a blocked one opens */
function finalLanes(ld, nowM){
  const eaten = (store.get('qpcut.eaten',{}))[ld] || {};
  const dw = dairyWindow(ld, {asOf: nowM});
  const dairyOK = !dw.blocked && (dw.from == null || nowM >= dw.from);
  const times = eatTimes(ld);
  const toM = s => { if(!s) return null; const [h,m]=String(s).split(':').map(Number); return h*60+m; };
  let meatFrom = null;
  Object.keys(eaten).forEach(k=>{
    if(!eaten[k] || !isDairyId(eaten[k])) return;
    const t = toM(times[k]); if(t==null || t>=nowM) return;
    const e = t + WAIT_DAIRY_MEAT; if(meatFrom==null || e>meatFrom) meatFrom = e;
  });
  return {
    pareve:{ok:true},
    meat:  {ok: meatFrom==null || nowM>=meatFrom, from:meatFrom},
    dairy: {ok:dairyOK, from:dw.from, blocked:!!dw.blocked, why:dw.why},
  };
}

function finalMeal(ld, opts){
  opts = opts || {};
  const nowM   = opts.nowM != null ? opts.nowM : nowMin();
  const target = planTarget(ld).t;
  const had    = eatenMacros(ld);
  const left   = target.map((v,i)=> v - had[i]);
  if(left[0] < 220) return null;

  const lanes = finalLanes(ld, nowM);
  const want  = opts.lane && lanes[opts.lane] ? opts.lane
              : (lanes.pareve.ok ? 'pareve' : lanes.dairy.ok ? 'dairy' : 'meat');

  /* DESSERT — a Creami IS the snack slot (s1), not a bonus, so its macros come OUT of the remainder
     before the dish is solved. Only on a genuinely big hole, and only if dairy is legal or unlocks soon. */
  const creami = OPTBYID['s1'] ? OPTBYID['s1'].vars[0].t : null;
  const soon = !lanes.dairy.blocked && lanes.dairy.from != null &&
               lanes.dairy.from - nowM > 0 && lanes.dairy.from - nowM <= 45;
  const dessert = (creami && left[0] >= 750 && (lanes.dairy.ok || soon))
    ? {macros:creami, waitUntil: lanes.dairy.ok ? null : lanes.dairy.from} : null;
  const dishT = dessert ? left.map((v,i)=> v - dessert.macros[i]) : left.slice();

  /* pick the dish + the whole-unit protein count that fits best. Chicken is leftover-only, so its dish
     is never auto-selected — he has to choose it, because he may not have any. */
  const pool  = FINAL_DISHES.filter(d=> d.lane === want);
  const cands = pool.filter(d=> !d.pro.leftoverOnly || opts.dish === d.id);
  let best = null;
  (cands.length ? cands : pool).forEach(d=>{
    const pStep = d.pro.step || 1;
    const fixed = d.extras.reduce((a,r)=> a.map((v,i)=> v + r[2][i]), [0,0,0,0]);
    for(let n = d.pro.lo; n <= d.pro.hi; n += pStep){
      const afterP = dishT.map((v,i)=> v - fixed[i] - d.pro.per[i]*n);
      /* ⛔ DO NOT TRUST solve2's answer as final. It hits CARBS and FAT exactly and lets calories be
         whatever falls out — and after snapping to real quantities, calories can land far off with
         nothing left to correct them. Measured 2026-08-12 on a 555-cal dairy hole: all 38 candidates
         overshot by 69+ cal, because hitting 66 C forced 3 slices of Ezekiel. Two slices lands within
         ~8 cal. The exact solution was never the best plate; it was just the one the algebra found.
         So: treat solve2 as a STARTING POINT and search a couple of steps either side of it, scoring
         each. His instruction, and the reason this matters: "we shouldnt be overfeeding or underfeeding.
         we should be on target always." Bounded at 5x3 = 15 extra evaluations per protein step. */
      const cStep = d.carb.step || 1, fStep = d.fat.step || 1;
      /* ⛔ A SECOND, FINER PROTEIN — and it exists because of a real miss. On the meat lane the anchor is
         a FROZEN 6 oz patty and whole units are non-negotiable, so plate protein could only land at
         42.6 or 77.6 g and nothing between. On the "missed snack AND dinner" hole the target is ~52 g,
         so the solver picked one patty, nailed calories to within half a one, and came in 9.4 g of
         protein short every time — a real shortfall that only surfaced once the row numbers were
         corrected and the hole stopped being understated.
         Adding a patty is not the answer: +255 cal and +35 P scores far worse than the shortfall it
         fixes. What closes it is a food already ON this plate in his own Q-built burger (d1) — an egg.
         72 cal / 6.3 P each, so the solver adds one or two and pays for them by trimming the potatoes,
         which is a protein-for-starch trade at constant calories. `pro2` is opt-in per dish; every dish
         without it evaluates exactly as before, at a cost of two extra scores per candidate. */
      const p2 = d.pro2, p2hi = p2 ? p2.hi : 0, p2lo = p2 ? p2.lo : 0;
      for(let n2 = p2lo; n2 <= p2hi; n2++){
        const fixed2 = p2 ? fixed.map((v,i)=> v + p2.per[i]*n2) : fixed;
        const afterP2 = dishT.map((v,i)=> v - fixed2[i] - d.pro.per[i]*n);
        const s2 = solve2([d.carb.per[2], d.carb.per[3]], [d.fat.per[2], d.fat.per[3]], afterP2[2], afterP2[3]);
        const c0b = fmSnap(s2 ? s2[0] : d.carb.lo, d.carb);
        const f0b = fmSnap(s2 ? s2[1] : d.fat.lo,  d.fat);
        for(let dc = -2; dc <= 2; dc++){
          const cQ = fmSnap(c0b + dc*cStep, d.carb);
          for(let df = -1; df <= 1; df++){
            const fQ = fmSnap(f0b + df*fStep, d.fat);
            const tot = [0,1,2,3].map(i=> fixed2[i] + d.pro.per[i]*n + d.carb.per[i]*cQ + d.fat.per[i]*fQ);
            const gap = dishT.map((v,i)=> v - tot[i]);
            const sc  = fmScore(gap) + (opts.dish === d.id ? -1000 : 0);   /* his explicit pick always wins */
            if(best == null || sc < best.sc) best = {sc, d, n, cQ, fQ, tot, n2};
          }
        }
      }
    }
  });
  if(!best) return null;
  const {d, n, fQ} = best;
  let cQ = best.cQ;   /* mutable: the protein-rescue pass below may trade carb steps for protein */

  /* ON THE SIDE — close whatever the dish physically cannot, one step at a time, cheapest error first */
  const sides = {};
  for(let it=0; it<20; it++){
    const cur = [0,1,2,3].map(i=> best.tot[i] + Object.entries(sides)
      .reduce((a,[id,q])=> a + FINAL_SIDES.find(s=>s.id===id).per[i]*q, 0));
    const gap = dishT.map((v,i)=> v - cur[i]);
    if(fmScore(gap) < 12 && Math.abs(gap[0]) < 55) break;
    let pick = null;
    FINAL_SIDES.forEach(s=>{
      if(!s.lanes.includes(want)) return;
      /* never a side that duplicates something already in the dish — one food, one row */
      if(s.id === d.carb.id || s.id === d.fat.id || s.id === d.pro.id) return;
      const have = sides[s.id] || 0; if(have + s.step > s.hi) return;
      const after = gap.map((v,i)=> v - s.per[i]*s.step);
      if(after[0] < -70) return;
      const sc = fmScore(after);
      if(pick == null || sc < pick.sc) pick = {s, sc};
    });
    if(!pick || pick.sc >= fmScore(gap)) break;
    sides[pick.s.id] = (sides[pick.s.id] || 0) + pick.s.step;
  }

  /* ⭐ PROTEIN RESCUE — the fix for a real, reproducible shortfall, not a tolerance nudge.
     THE BUG: the dish stage and the side stage optimise SEQUENTIALLY. The dish stage lands calories
     exactly, spending every one of them on carbs and fat, and the side stage can then only ADD food —
     so buying protein always costs calories the plate no longer has. On the "missed snack AND dinner"
     meat hole that produced a 9.4 g protein shortfall on every run: one frozen 6 oz patty gives 42.6 g
     against a 52 g target, a SECOND patty is +255 cal and scores far worse, and 50 g of egg whites was
     refused because its 25 calories cost more in the calorie term than the 5 g of protein was worth.
     Each stage was locally optimal and the pair was not.
     THE FIX: trade the dish's carb side DOWN a step and a lean protein side UP a step, together, and
     keep the swap only when the JOINT score improves. That is a protein-for-starch trade at roughly
     constant calories, which is the move a person would make looking at the plate.
     Only fires when protein is genuinely short, so every already-landing plate is untouched. Bounded
     at 8 swaps and it reverts the moment a swap stops helping — no ratchet was loosened for this. */
  {
    /* Pick by FINENESS, not by the best protein-per-calorie. Sorting on P/cal chose the tuna packet
       (0.24 P/cal, beating egg whites' 0.20) and one packet is +70 cal / +17 P — so coarse it overshot
       protein by 7 g and calories by 63, scored worse than the shortfall, and reverted on the first
       iteration every time. Among sides that are protein-dense enough to be worth trading for, the one
       whose STEP adds the fewest calories gives the control this needs. */
    const leanest = FINAL_SIDES
      .filter(s => s.lanes.includes(want) && s.id !== d.carb.id && s.id !== d.fat.id && s.id !== d.pro.id)
      .filter(s => s.per[0] > 0 && s.per[1] / s.per[0] > 0.15)   /* protein per calorie — whites are ~0.20 */
      .sort((a, z) => (a.per[0] * a.step) - (z.per[0] * z.step))[0];
    const cStep = d.carb.step || 1;
    /* PAY FOR IT IN FULL. Trading one carb step per protein step left calories 18 over, and the
       calorie-over term (/1.4) is steep enough to sink the swap on its own. Cut as many carb steps as
       the protein step actually costs, so the trade is calorie-neutral and only the macros move. */
    const cPerStep = Math.abs(d.carb.per[0] * cStep) || 1;
    const payStep = Math.max(1, Math.round((leanest ? leanest.per[0] * leanest.step : 0) / cPerStep));
    const scoreNow = () => {
      const cur = [0,1,2,3].map(i => best.tot[i] + (cQ - best.cQ) * d.carb.per[i]
        + Object.entries(sides).reduce((a,[id,q]) => a + FINAL_SIDES.find(s=>s.id===id).per[i]*q, 0));
      return fmScore(dishT.map((v,i) => v - cur[i]));
    };
    for (let it = 0; leanest && it < 8; it++) {
      const gapP = dishT[1] - (best.tot[1] + (cQ - best.cQ) * d.carb.per[1]
        + Object.entries(sides).reduce((a,[id,q]) => a + FINAL_SIDES.find(s=>s.id===id).per[1]*q, 0));
      if (gapP <= 4) break;                                   /* close enough; stop trading his food */
      const have = sides[leanest.id] || 0;
      const cut = cStep * payStep;
      if (cQ - cut < d.carb.lo || have + leanest.step > leanest.hi) break;
      const before = scoreNow();
      cQ -= cut; sides[leanest.id] = have + leanest.step;
      if (scoreNow() >= before) { cQ += cut; sides[leanest.id] = have; break; }   /* revert, keep the better plate */
    }
    if (sides[leanest && leanest.id] === 0) delete sides[leanest.id];
  }

  const rows = [
    [d.pro.label,  fmQty(d.pro, n),               fmMac(d.pro, n)],
    /* the finer second protein, only when the solve actually used one — a "0 eggs" row would read as
       a dropped ingredient, which is exactly what [final-meal]'s zero-quantity check exists to catch */
    ...(d.pro2 && best.n2 > 0 ? [[d.pro2.label, fmPlural(best.n2, d.pro2.unit), fmMac(d.pro2, best.n2)]] : []),
    [d.carb.label, fmPlural(cQ, d.carb.unit),     fmMac(d.carb, cQ)],
    [d.fat.label, fmPlural(fQ, d.fat.unit), fmMac(d.fat, fQ)],   /* fat floors are >0, so this row always exists — see F_* lo values */
    ...d.extras.map(r=> [r[0], r[1], r[2]]),
  ];
  const sideRows = Object.entries(sides).map(([id,q])=>{
    const s = FINAL_SIDES.find(x=>x.id===id);
    return [s.label, fmPlural(q, s.unit), fmMac(s, q)];
  });
  /* ⭐ THE ANTI-CONTRADICTION MECHANISM: quantities are SUBSTITUTED IN, never authored. The step and the
     ingredient row read the same variable, so they cannot disagree no matter how the solve lands. */
  const steps = d.steps.map(t => t
    .replace(/\{pro\}/g,  '<b>' + fmQty(d.pro, n) + '</b>')
    .replace(/\{carb\}/g, '<b>' + fmPlural(cQ, d.carb.unit) + '</b>')
    .replace(/\{fat\}/g,  '<b>' + fmPlural(fQ, d.fat.unit) + '</b>'));

  const plateM = rows.concat(sideRows).reduce((a,r)=> a.map((v,i)=> v + r[2][i]), [0,0,0,0]);
  const totalM = dessert ? plateM.map((v,i)=> v + dessert.macros[i]) : plateM;
  const gap    = left.map((v,i)=> Math.round((v - totalM[i])*10)/10);
  /* asymmetric, matching fmErr and the [final-meal] guard: being OVER on protein is not a miss on a
     cut, so it must not raise the warning banner. Only a deficit, or an absurd surplus, counts. */
  const short  = Math.abs(gap[0]) > 60 || gap[1] > 8 || gap[1] < -30;

  return {
    left, lanes, lane:want, dish:d, dishes:pool, steps, rows, sideRows, dessert,
    plate: plateM.map(v=>Math.round(v)), total: totalM.map(v=>Math.round(v)),
    gap, short, oneSitting: left[0] <= 1700,
    covers: SLOT_SEQ.filter(k=> !((store.get('qpcut.eaten',{}))[ld]||{})[k]),
  };
}
