<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Cut">
<meta name="theme-color" content="#171915">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>The Cut</title>
</head>
<body style="margin:0">

<style>
  /* ============ THE CUT v14 · design tokens ============ */
  :root{
    --ink:#15170f; --ink2:#101208;
    --panel:#20231b; --panel2:#292c22; --panel3:#31342a; --line:#363a2e; --line2:#42462f;
    --text:#ece8db; --muted:#a09d8e; --faint:#6f6d60;
    --brass:#d9a441; --brass-hi:#ecc06a; --brass-dim:#8a6a2e; --brass-ink:#241c08;
    --meat:#c4674f; --dairy:#7fa8c9; --pareve:#8faa72;
    --ok:#8faa72; --warn:#d9a441; --danger:#c4674f;
    --disp:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
    --body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
    --r-card:16px; --r-ctl:11px;
    --card-grad:linear-gradient(180deg,#23261d 0%,#1e211a 100%);
    --card-hi:inset 0 1px 0 rgba(255,255,255,.045);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{background:
        radial-gradient(1200px 400px at 50% -100px, #1d2016 0%, var(--ink) 60%);
       background-color:var(--ink);color:var(--text);font-family:var(--body);
       font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
       -webkit-tap-highlight-color:transparent}
  .app{max-width:520px;margin:0 auto;padding:0 14px 118px}

  /* ---- header ---- */
  header.top{padding:calc(12px + env(safe-area-inset-top,0px)) 2px 8px;
       display:flex;flex-direction:column;gap:10px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:19px;margin:0;letter-spacing:.4px}
  .brand h1 span{color:var(--brass)}
  .brand .coach{font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
  .macrostrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .mcell{background:var(--card-grad);border:1px solid var(--line);border-radius:12px;
         box-shadow:var(--card-hi);padding:8px 10px;text-align:center}
  .mcell .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;
            font-size:17px;color:var(--brass)}
  .mcell .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:1px}

  /* ---- zone bar (sticky chip subnav, lives outside #view) ---- */
  .zonebar{position:sticky;top:0;z-index:9;margin:0 -14px;padding:8px 14px;
       background:color-mix(in srgb,var(--ink) 82%,transparent);
       backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;
       border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
  .zonebar::-webkit-scrollbar{display:none}
  .zonebar:empty{display:none}
  .zchip{flex-shrink:0;border:1px solid var(--line);background:var(--panel);color:var(--muted);
       border-radius:99px;padding:6px 12px;font-size:12px;font-weight:650;letter-spacing:.02em}
  .zchip.hot{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,transparent)}
  .zbrest{margin-left:auto;flex-shrink:0;font-family:var(--mono);font-variant-numeric:tabular-nums;
       font-size:12.5px;font-weight:700;color:var(--brass);padding:6px 10px;border-radius:99px;
       border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);display:none}
  .zbrest.live{display:inline-block}
  .zbrest.go{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .zonebar input.zsearch{flex:1;min-width:120px;font-family:var(--body);font-size:15px;
       border-radius:99px;padding:7px 14px}

  /* ---- section & zone headers ---- */
  h2.sec{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
         margin:22px 2px 8px;font-weight:650;display:flex;align-items:baseline;gap:8px}
  .zone{margin:0}
  .zhead{display:flex;align-items:center;gap:8px;margin:26px 2px 10px}
  .zhead .zt{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.02em}
  .zhead::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--line) 70%,transparent)}
  .zhead .zn{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* ---- cards ---- */
  .card{background:var(--card-grad);border:1px solid var(--line);border-radius:var(--r-card);
        box-shadow:var(--card-hi);padding:14px 16px;margin-bottom:12px}
  .card h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
  .card .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .statline{display:flex;align-items:center;gap:8px;color:var(--muted);
        font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;margin-left:auto;
        flex-shrink:0;padding-right:2px;white-space:nowrap}
  /* let a long title + statline wrap instead of overflowing the card edge */
  details.acc summary{flex-wrap:wrap;row-gap:2px}
  details.acc summary h3{min-width:0;overflow-wrap:anywhere}
  details.acc summary .statline b{color:var(--brass);font-weight:700}

  /* ---- chips ---- */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
        letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;
        border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--muted)}
  .chip.meat{color:var(--meat);border-color:color-mix(in srgb,var(--meat) 45%,transparent)}
  .chip.meat::before{background:var(--meat)}
  .chip.dairy{color:var(--dairy);border-color:color-mix(in srgb,var(--dairy) 45%,transparent)}
  .chip.dairy::before{background:var(--dairy)}
  .chip.pareve{color:var(--pareve);border-color:color-mix(in srgb,var(--pareve) 45%,transparent)}
  .chip.pareve::before{background:var(--pareve)}
  .chip.time{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 40%,transparent);
             white-space:normal;overflow-wrap:anywhere;max-width:100%}
  .chip.time::before{display:none}
  .chip.notetag::before{display:none}
  .chip.off{color:var(--meat);border-color:color-mix(in srgb,var(--meat) 45%,transparent)}
  .chip.hw{color:var(--dairy);border-color:color-mix(in srgb,var(--dairy) 45%,transparent)}
  .chip.kf{cursor:pointer}
  .chip.kf.on{background:var(--panel3);color:var(--text)}

  /* ---- meal options / ingredients ---- */
  .opt{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .opt:first-of-type{border-top:none;margin-top:8px;padding-top:0}
  .opt .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .opt .head b{font-size:15px;font-weight:650}
  .varlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-top:8px}
  .ing{margin:8px 0 0;padding:0;list-style:none}
  .ing li{display:flex;justify-content:space-between;gap:12px;padding:3.5px 0;font-size:14px}
  .ing li .q{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);
             font-size:12.5px;text-align:right;max-width:58%;overflow-wrap:anywhere}
  .totals{display:flex;gap:14px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
          font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
  .totals b{color:var(--brass);font-weight:700}
  .budget{display:flex;gap:14px;font-family:var(--mono);font-variant-numeric:tabular-nums;
          font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
  .budget b{color:var(--text);font-weight:600}

  /* ---- today: hero + strip + timeline ---- */
  .today-date{font-family:var(--disp);font-weight:800;font-size:26px;margin:4px 0 0;letter-spacing:.2px}
  .today-sub{color:var(--brass);font-weight:600;font-size:14px;margin-top:2px;display:flex;
             justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .hero{display:flex;align-items:stretch;gap:14px;margin-top:12px}
  .hero .hleft{flex:1;min-width:0}
  .hero-num{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1.05;
        font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .hero-num small{font-size:14px;font-weight:650;color:var(--muted);letter-spacing:0}
  .depbars{display:flex;flex-direction:column;gap:5px;margin-top:9px}
  .dep{display:grid;grid-template-columns:16px 1fr 74px;gap:8px;align-items:center}
  .dep .dl{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em}
  .dep .dt{height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;display:block}
  .dep .df{display:block;height:100%;border-radius:99px;background:var(--brass)}
  .dep .df.p{background:var(--pareve)} .dep .df.c{background:var(--dairy)} .dep .df.f{background:var(--meat)}
  .dep .dv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10.5px;
        color:var(--muted);text-align:right;white-space:nowrap}
  .glance{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;
        border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);flex-wrap:wrap}
  .glance .gslots{display:flex;gap:5px;align-items:center}
  .gdot{width:17px;height:17px;border-radius:99px;border:1.5px solid var(--line);
        background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;
        font-size:9px;color:var(--faint);font-weight:700}
  .gdot.on{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
  .gdot.skip{border-style:dashed;color:var(--muted)}
  .gstat{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
        font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
  .gwater{width:44px;height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;display:inline-block}
  .gwater i{display:block;height:100%;background:var(--dairy);border-radius:99px}
  .wins{color:var(--faint);font-size:11.5px;margin-top:10px;letter-spacing:.02em}

  .nowstrip{border-left:3px solid var(--brass);padding-left:13px}
  .ns-cur{font-family:var(--disp);font-weight:750;font-size:16.5px}
  .ns-next{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
  .ns-next b{color:var(--brass);font-family:var(--mono);font-weight:700;font-size:12.5px}
  .nact{margin-top:10px;display:inline-flex;align-items:center;gap:7px;
        background:var(--brass);color:var(--brass-ink);border:none;border-radius:99px;
        padding:9px 16px;font-weight:750;font-size:13.5px}
  .nact.ghosted{background:transparent;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 50%,transparent)}
  .nudge{margin-top:9px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
  .nudge .nx{color:var(--faint);background:none;border:none;font-size:14px;padding:0 4px}
  .dayprog{height:3px;border-radius:99px;background:var(--panel3);overflow:hidden;margin-top:12px}
  .dayprog i{display:block;height:100%;background:color-mix(in srgb,var(--brass) 65%,transparent)}

  .sched{margin:10px 0 0;padding:0;list-style:none}
  .sched li{display:flex;gap:10px;padding:4px 0;font-size:14.5px;align-items:baseline}
  .sched li .t{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass);
               font-size:12.5px;min-width:64px;flex-shrink:0}
  .sched li.past{opacity:.42}
  #dayTL:not(.showpast) li.past{display:none}
  #dayTL li.tlpast{cursor:pointer;font-size:12.5px;opacity:.55;user-select:none;-webkit-user-select:none}
  .sched li.cur{position:relative;opacity:1}
  .sched li.cur::before{content:"";position:absolute;left:-13px;top:4px;bottom:4px;width:3px;
        border-radius:2px;background:var(--brass)}
  .sched li.cur .t{color:var(--brass-hi);font-weight:700}
  .sched li.rem .t{color:var(--dairy)}
  .note{background:color-mix(in srgb,var(--brass) 10%,transparent);
        border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);
        color:var(--text);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}

  /* ---- meal tiles ---- */
  .mtiles{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;
        scroll-snap-type:x proximity;scrollbar-width:none}
  .mtiles::-webkit-scrollbar{display:none}
  .mtile{flex:0 0 108px;scroll-snap-align:start;text-align:left;
        background:var(--panel2);border:1px solid var(--line);border-radius:13px;
        padding:9px 10px;color:var(--text);display:flex;flex-direction:column;gap:3px;min-height:78px}
  .mtile .mt-t{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:.04em}
  .mtile .mt-n{font-size:12px;font-weight:650;line-height:1.25;overflow:hidden;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mtile .mt-m{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:auto}
  .mtile.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  .mtile.done .mt-n{color:var(--muted)}
  .mtile.done .mt-t::after{content:" ✓";color:var(--ok)}
  .mtile.next{border-color:var(--brass);box-shadow:0 0 0 1px color-mix(in srgb,var(--brass) 35%,transparent)}
  .mtile.exp{background:var(--panel3)}

  .timer-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  input,textarea,select{
        background:var(--panel2);border:1px solid var(--line);color:var(--text);
        border-radius:var(--r-ctl);padding:8px 10px;font-family:var(--mono);font-size:16px;
        color-scheme:dark}
  textarea{font-family:var(--body);width:100%;min-height:64px;resize:vertical}
  button{font-family:var(--body);cursor:pointer}
  .btn{background:var(--brass);color:var(--brass-ink);border:none;border-radius:var(--r-ctl);
       padding:10px 15px;font-weight:700;font-size:14px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,
  .suppitem:focus-visible,.buyitem:focus-visible,input:focus-visible,textarea:focus-visible,
  select:focus-visible,.xdel:focus-visible,.pgrid button:focus-visible,.mealpick:focus-visible,
  .step:focus-visible,.zchip:focus-visible,.mtile:focus-visible,.tooltile:focus-visible,
  .setdot:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* ---- lift layer (dimensions FROZEN — keypad-stability contract) ---- */
  .setdot{width:26px;height:26px;border-radius:99px;border:1.5px solid var(--line);
       background:var(--panel2);padding:0;flex-shrink:0;transition:background .15s,border-color .15s}
  .setdot.on{background:var(--brass);border-color:var(--brass)}
  input.repin{width:52px;text-align:center;padding:7px 2px;font-size:16px}
  input.prw2{width:72px;text-align:center;padding:6px 2px;font-size:16px}
  .coachline{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
       color:var(--brass);text-align:right;margin-top:6px;line-height:1.5}
  /* coach FORM notes — static, distinct from the brass .coachline weight/rep prescriptions */
  .cuebox{margin:7px 0 2px;padding:7px 9px;background:var(--panel3);border-left:2px solid var(--brass);
       border-radius:4px}
  .cuebox>summary{cursor:pointer;list-style:none;font-size:12px;line-height:1.45;color:var(--text)}
  .cuebox>summary::-webkit-details-marker{display:none}
  .cuebox>summary::after{content:' ▸';color:var(--brass)}
  .cuebox[open]>summary::after{content:' ▾'}
  .cuebox>summary b{color:var(--brass-hi);font-weight:600}
  .cuefrom{font-size:10.5px;color:var(--faint);margin-top:5px}
  .cuebox .sched li{font-size:11.5px}
  /* anything I added that the coach did NOT say — visually separated so he never confuses the two */
  .cuemine{display:block;margin-top:4px;color:var(--muted);font-style:italic}
  .cueoff{color:var(--faint);font-size:10.5px}
  .setrow{display:grid;grid-template-columns:24px 88px 14px 60px;gap:7px;align-items:center;
       justify-content:end;margin-top:6px}
  .setrow.noreps{grid-template-columns:24px 88px}
  .setrow .slab{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
  .setrow .x{color:var(--muted);font-size:11px;text-align:center}
  input.wti{width:88px;text-align:center;padding:7px 2px;font-size:16px}
  input.rpi{width:60px;text-align:center;padding:7px 2px;font-size:16px;
       border-color:color-mix(in srgb,var(--brass) 55%,var(--line))}
  select.exsel{background:var(--panel2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:5px 8px;font-size:16px;font-family:var(--body)}
  .restchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
       font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--brass);
       border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:99px;
       padding:5px 12px}
  .restchip:empty{display:none}
  .restchip.go{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
  body.sesh-on .zone:not(#z-lift){opacity:.35;transition:opacity .25s}
  body.sesh-on .zonebar .zchip:not([data-jump="z-lift"]){opacity:.5}
  .seshsum{border-left:3px solid var(--ok);padding-left:13px}

  /* ---- hydration / dials / stack ---- */
  .water-label{font-size:12px;color:var(--muted);margin-top:8px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);
       border-radius:12px;padding:3px;gap:3px;margin:4px 0 14px}
  .seg button{border:none;background:transparent;color:var(--muted);border-radius:9px;
       padding:9px 0;font-weight:650;font-size:14px}
  .seg button.on{background:var(--brass);color:var(--brass-ink)}
  .seg.mini{margin:0;display:inline-grid;grid-auto-flow:column}
  .seg.mini button{padding:6px 12px;font-size:12px}
  .rules{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 14px;letter-spacing:.02em}
  .ex{margin:8px 0 0;padding:0;list-style:none}
  .ex li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14.5px;
         border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);align-items:center}
  .ex li:first-child{border-top:none}
  .ex li .r{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brass);
            font-size:12.5px;flex-shrink:0;text-align:right}
  .daytag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  /* the single divider between "still to buy" and "got it" in the grocery list. One line in the whole
     card, replacing five section headers — see the note above the grocery <details>. */
  .doneline{display:flex;align-items:center;gap:10px;margin:16px 0 2px;
       font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .doneline::after{content:'';flex:1;height:1px;background:var(--line)}
  .upflag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brass-ink);background:var(--pareve);
          border-radius:6px;padding:2px 6px;margin-left:6px;text-transform:uppercase;white-space:nowrap}

  .suppitem,.buyitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
            background:transparent;border:none;color:var(--text);font-size:15px;min-height:44px;
            padding:9px 2px;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .suppitem:first-of-type,.buyitem:first-of-type{border-top:none}
  .suppitem .box,.buyitem .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
            flex-shrink:0;display:flex;align-items:center;justify-content:center;
            font-size:14px;color:var(--brass-ink);background:var(--panel2)}
  .suppitem.done .box,.buyitem.done .box{background:var(--pareve);border-color:var(--pareve)}
  .suppitem.done .nm,.buyitem.done .nm{color:var(--muted);text-decoration:line-through}

     flex-shrink:0 while .nm had no flex rule at all — so the qty took the row and "Chicken breast —
     regular cut, not thin-sliced" rendered as SIX stacked words in a ~90px column. Identical bug to the

     right-aligned, and the name keeps the width. Scoped to .buyitem: .suppitem's .when is always short
     ("8 PM", "daily") and does not need it. */

     runs, so .q{margin-left:auto} pinned the name at exactly its 16ch basis and never let it fill the
     row — 132px at 390px wide, NARROWER than the same row at 320px. With the name growing, it pushes
     .q to the right edge on its own and the auto margin is not needed. Third time this exact
     interaction has bitten: see the flavor-card note. */

  /* "next ›" flavor stepper on the Today COR + yogurt-bowl cards (his ask Aug 10 2026) */
  /* His report Aug 12 2026: "the next button on the flavor cards keeps moving depending on the length
     of the title. make it not move." The buttons sat inline right after the flavor name, so a long name
     pushed them along. These summaries are already display:flex, so margin-left:auto pins the cluster to
     the right edge and the name can no longer move it. The name truncates instead of shoving the row. */
  .flavnext{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;vertical-align:middle}
  /* ⛔ SECOND REPORT, Aug 13 2026: "it moves evrytime i change the flavor." The Aug 12 fix above was
     not enough — it only addressed the name pushing the row. THREE separate things moved that button,
     and any one of them is enough to see it move:
       ① `.statline` ALSO carries margin-left:auto. Two auto-margin items split the free space between
          them, so the gap before the buttons is a FUNCTION of the title width — change the name and
          the button slides. Here the title takes the slack with flex-grow and statline's auto margin
          is switched off, so nothing depends on the name any more.
       ② `details.acc summary` sets flex-wrap:wrap, and flexbox breaks lines on each item's UNSHRUNK
          size — so a long name wrapped the whole cluster onto a second row before the ellipsis could
          ever apply. That is a vertical jump, and it is why truncation alone did not fix this.
       ③ The ↺ button only existed once a pick existed, and it renders AFTER "next ›" — so the first
          step of the day widened the cluster and shoved both buttons left. Its slot is now always
          reserved (see .nxb.ghost); nextBtns emits the same three buttons either way.
     Guarded by [flavor-btn] in check-app.js, which fails if any of the three comes back. */
  /* ⛔ THIRD ATTEMPT, and the second one BROKE THE CARD — his screenshot showed the flavor name
     truncated to "..." and the BREAKFAST chip crushed into one vertical letter per line.
     WHY: I set flex-wrap:nowrap to stop the cluster jumping to row 2, but on his phone (~400 CSS px)
     the fixed content — chip + statline + 3 buttons + the RATE cluster + the 22px marker — is already
     wider than the row. Forcing one line left the title NEGATIVE space, so flex shrank the title to
     nothing and then started on the chip, which had no flex-shrink:0. The row never fit; wrapping had
     been hiding that fact, and removing the wrap exposed it as a crushed card.
     THE FIX IS TO MAKE THE BREAK DETERMINISTIC INSTEAD OF FIGHTING IT. A zero-height full-width
     .flavbreak spacer puts the stepper at the START of its own row, so "next ›" sits at a constant x
     that cannot depend on the title's length, the macros, or whether ↺ is showing. Row 1 is
     name + chip + statline; row 2 is stepper (left) and rate (right).
     ⚠️ The title uses flex:1 1 0, NOT 1 1 auto: flex line-breaking uses an item's UNSHRUNK size, so a
     basis of auto lets a long name force a wrap before the ellipsis can apply. A basis of 0 never can.
     ⚠️ chip and statline MUST keep flex-shrink:0 or they deform instead of the title. That is the exact
     defect in his screenshot. */
  .flavbreak{flex-basis:100%;height:0;margin:0}
  /* ⚠️ basis 16ch, not 0. A zero basis made the flavor name lose every fight for space: at 320 px it
     rendered as "🥣 Death …" and he could not tell which flavor the card was showing. With a real basis,
     line-breaking knows the name needs room, so the macro chip wraps to its own line and the name keeps
     the width. The ellipsis stays as the last resort, not the normal case. */
  details[data-acc="cor-day"]>summary>b, details[data-acc="bowl-day"]>summary>h3{
       flex:1 1 16ch;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  details[data-acc="cor-day"]>summary>.chip, details[data-acc="bowl-day"]>summary>.chip,
  details[data-acc="cor-day"]>summary>.statline, details[data-acc="bowl-day"]>summary>.statline{

  details[data-acc="cor-day"]>summary>.rate, details[data-acc="bowl-day"]>summary>.rate{

  /* ---- tab bar ---- */
  /* ⚠️ HIS REPORT Aug 16 2026: "the card on the bottom with the 5 tab names starts moving up the screen
     when I scroll." I could NOT reproduce it — driven in Chromium at 390x760 the bar's top sits at 703px
     at every scroll offset tested, spread 0px. So it is an iOS Safari behaviour, and the prime suspect is
     the backdrop-filter: a blurred position:fixed bar is composited separately on iOS and can visibly lag
     or drift during momentum scrolling before snapping back.
     translateZ(0) + will-change promote the bar to its own layer up front, which is the standard fix for
     exactly that lag. ⛔ UNVERIFIED ON HIS DEVICE — I have no iOS here. If it still drifts, the next step
     is dropping the blur for a solid background, which removes the cause rather than mitigating it. */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--ink2) 86%,transparent);
       backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       border-top:1px solid var(--line);z-index:10;
       transform:translateZ(0);will-change:transform;
       padding-bottom:env(safe-area-inset-bottom,0)}
  /* ---- KEYBOARD: the tab bar must get out of the way ----
     He reported it 2026-08-20 with a screenshot: start typing in the add-item box and the tab bar
     appears in the MIDDLE of the screen, over the content, while the keyboard sits below it.
     WHY: position:fixed anchors to the LAYOUT viewport, not the visible one. iOS opens the keyboard by
     shrinking the VISUAL viewport and scrolling to the focused field; the layout viewport does not
     change, so the bar stays pinned to where the old bottom was and visually detaches mid-screen. The
     translateZ(0) + will-change promotion above makes it worse, not better — a promoted layer does not
     reflow with the visual viewport at all. That promotion was added for a different complaint (drift
     during momentum scrolling) and is left alone here.
     FIX: while a text field has focus, the bar is hidden. Deterministic — no geometry to compute and
     nothing to drift — and it is the right behaviour anyway, since a tab bar floating over the content
     is worse than no tab bar while he is typing one line. */
  body.kbdopen nav.tabs{display:none}

       width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}

  details.exfold>summary{cursor:pointer;list-style:none;position:relative;padding-right:20px;

  /* a real flex-basis, not 0: with basis 0 the name collapsed to ~110px at 320 and a 2-badge row
     ("Smith squat or hack squat" + 🎉 GO UP + ⏸ why?) towered to 3 lines. Measured, not reasoned. */
  details.exfold>summary .exnm{flex:1 1 11ch;min-width:0;overflow-wrap:anywhere}
  /* the "lighter because" chips mirror the RIR row. The label that used to sit beside them pushed the
     three chips onto a second line at every width below 430 — the break is deterministic now. */

  /* Meals tab: each SLOT is a big collapsible section; meal cards nest inside it */
  details.slotsec{background:var(--panel);border-color:var(--line2)}
  details.slotsec>summary{min-height:34px}
  details.slotsec>summary b{font-size:16px}
  /* ⛔ HIS SCREENSHOT Aug 13 2026: on the Meals tab every row broke into three lines — "Cream / of /
     Rice" with the DAIRY chip floating beside the middle word, and "Breakfast" sitting next to the
     macros with "· 10:30 AM" dumped onto the next line. Nothing was overlapping: the NAME WAS WRAPPING.
     WHY: the four-macro block is flex-shrink:0 + nowrap (correctly — he asked for all four numbers),
     the kosher chip is fixed, and the name is `flex:1` whose basis is 0. A basis of 0 contributes
     nothing to flex line-breaking, so the numbers never move to a second line no matter how narrow the
     screen; the name absorbs the entire shortfall instead and, having no ellipsis, wraps to 3 lines.
     FIX, and it needs NO breakpoint guess: give the name a real flex-basis. Now line-breaking accounts
     for the space a name actually needs, so when name + chip + macros genuinely do not fit, the MACROS
     wrap to their own line and the name keeps the full width. Wide screens are unchanged — everything
     still fits on one line, so nothing wraps.
     ⚠️ Do NOT "fix" this with a max-width media query. I do not know his CSS pixel width (the app is a
     black-translucent standalone PWA, so a screenshot's pixel size is not his viewport), and a guessed
     breakpoint either misses his phone or restyles everyone else's. Basis-driven wrapping adapts to
     whatever width he actually has.
     ⚠️ min-width:0 must STAY: it lets the name shrink below its basis on the line it does get. */
  details.slotsec>summary>span, details.mealcard>summary>span{flex-wrap:wrap}
  details.slotsec>summary>span>.r, details.mealcard>summary>span>.r{margin-left:auto}
  /* ⭐ AND THE BIGGER HALF OF THE SAME BUG: the row had almost no width to begin with. Measured with
     tools/measure.js at 320 px, a meal row's usable width was 202 px —
       320 − 28 (.app) − 34 (slot card) − 34 (meal card) − 22 (the ▾ marker) = 202
     so 118 px of a small phone was nested chrome. Cards nest three deep on this tab and each level paid
     full 16 px side padding. Trimming the two card levels and .app on small screens hands ~32 px back to
     the content, which is the difference between a name over 2 lines and a name over 3.
     This IS a media query, unlike the basis fix above, and that is deliberate: padding cannot adapt to
     its own content the way a flex basis can. 400 px is not a guess at his device — it is "small phone",
     and tools/measure.js verifies 320 / 360 / 390 / 430 every run. */
  @media (max-width:400px){
    .app{padding-left:10px;padding-right:10px}
    details.slotsec{padding-left:10px;padding-right:10px}
    details.slotsec .mealcard{padding-left:10px;padding-right:10px}
  }
  /* the flex-basis itself lives on the element's INLINE style in viewMeals — an inline style beats a
     stylesheet rule, and these two <b>s carry one. Guarded by [meal-row-wrap] in check-app.js. */
  details.slotsec[open]{padding-bottom:6px}
  details.slotsec .mealcard{background:var(--panel2);margin-top:8px}
  details.slotsec .mealcard:first-of-type{margin-top:10px}

       margin-top:12px;padding-top:12px}
  details.innerrow summary{font-weight:650;font-size:14.5px}

  /* ---- Track archive hierarchy: month > week > days ----
     His note Aug 10 2026: "this is a little hard to read." The cause was not the font — all three
     depths used details.innerrow, and `details.innerrow summary` is a DESCENDANT selector, so every
     level rendered at the same 14.5px/650 at the same indent. Nothing on screen said that a week sits
     inside a month. Each depth now gets its own weight, colour and indent, and the day table tightens
     so a full week fits without scrolling. */
  details.arc-m{margin-top:14px;padding-top:12px;
       border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
  details.arc-m>summary{font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.1em;
       text-transform:uppercase;color:var(--brass);border-left:3px solid var(--brass);padding-left:9px}
  details.arc-m>summary .statline{letter-spacing:0;text-transform:none;font-weight:600}
  /* the week is visibly INSIDE the month: indented, hung off a vertical rule, quieter until opened */

function sleepParse(v){ v=String(v==null?'':v).trim(); if(!v) return null; const p=v.split('.'); const H=parseInt(p[0],10); if(isNaN(H)) return null; const M=(p[1]!=null)?(parseInt(p[1],10)||0):0; return Math.round((H+M/60)*1000)/1000; }

 b1:['Bowl: COR + oats + ~240 mL hot water, stir 60–90 sec until it thickens.','Let it cool 1 min, THEN whisk in the protein — <b>1 serving, WEIGHED from the ziplock</b> (flavors differ, 30–41 g; today’s exact number is on the Today flavors card and next to every combo). Boiling water clumps whey.','Berries on top, almond butter swirled through. This week’s combo is on the Today flavors card.'],

 b4:['The whole point: everything is portioned by the cup/count, so <b>nothing gets weighed</b> — the Shabbat / forgot-the-COR breakfast.','2 Oikos cups into a bowl, stir smooth. Slice the banana in.','Cereal on top (keep it in a baggie till now so it stays crunchy), half an almond-butter packet squeezed over, berries if you have them.','No blending, no toasting, no stove — fully Shabbat-safe. Dead-simple version: 3 Oikos + 1 banana.'],
 b5:['<b>No shaker, no powder.</b> Stir ½ tsp banana extract, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','Stir it all through the 400 g FAGE 2% with a spoon — no powder to smooth out any more, so a spoon is genuinely enough. 2%, not 0%: the little bit of fat is what kills the dry, squeaky nonfat mouthfeel.','2 min in the fridge firms it. <b>There is no 5-minute set step any more</b> — no pudding starch to hydrate, so nothing to wait on.','Fold in 150 g frozen berries + the ½ banana in coins, then 3 Biscoff crushed on top LAST so they stay crisp. The 7 g almond butter goes on as a dollop, not stirred through — it belongs in pockets here.'],
 b6:['<b>No shaker, no powder.</b> Stir ¼ tsp lemon extract, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','Fold in 250 g strawberries (frozen thickens it best), 2 crushed graham sheets on top for the crust — double crust now, almond butter dolloped on top rather than stirred in.','<b>Freeze-dried strawberries instead?</b> Use only ~12 g (they’re ~10× more concentrated than fresh — same ~18 C, don’t do a 1:1 gram swap). Crush half IN + leave half on top for crunch, and add a splash more Fairlife (~15 mL) since freeze-dried soaks up moisture. Don’t stir it all in early or it turns to mush.'],
 b7:['<b>No shaker, no powder.</b> Stir 1 tsp vanilla bean paste + the 2 g cocoa, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','13 Oreo minis crushed over the top — whole, nothing to scrape, Hershey’s Zero Sugar syrup 15 g drizzled, and the 9 g almond butter stirred right in — this one is cookie/chocolate-forward so the AB belongs mixed through.','No fruit in this one on purpose: cookies-and-cream is the vanilla-cookie lane. The chocolate + banana + Oreo version is b18.'],
 b8:['<b>No shaker, no powder.</b> Stir ½ tsp coconut extract, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','Fold in 282 g pineapple, toasted coconut chips on top, almond butter dolloped — don’t stir the AB through, it muddies a clean tropical flavor. Coconut is fine for you (not a tree-nut concern).','Piña Colada is your lowest-calorie tub (110 a scoop), which is why this bowl can carry 12 g of almond butter and still land at 540.'],
 b9:['<b>No shaker, no powder.</b> Stir ½ tsp caramel extract + Golden Lakanto, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','<b>The butterscotch note now comes from the caramel extract + a spoon of Golden Lakanto</b> (brown-sugar flavor, ~0 cal) instead of the pudding mix.','Apples on, 2 Biscoff cookies crumbled over, 9 g almond butter stirred right in — cinnamon, apple and AB all belong together.'],
 b10:['<b>No shaker, no powder.</b> Stir ¼ tsp lemon extract, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','Fold in 251 g blueberries, 3 crushed Nilla on top, almond butter dolloped on top (bright and tangy — don’t stir the AB through this one).'],
 b11:['<b>No shaker, no powder.</b> Stir 3 g cocoa powder + ¼ tsp almond extract, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','Stir in 24 g <b>almond butter</b> (your safe nut) until smooth, banana coins on top, Hershey’s Zero Sugar syrup 15 g drizzled. Rich chocolate — like a frosty in a bowl. No cookie in this one; that’s b18.'],
 b12:['<b>No shaker, no powder.</b> Stir a pinch of Lakanto — the cereal carries the flavor, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm. The salt and the Lakanto are doing the work here — plain FAGE is tart, and they cost nothing. It comes out THICKER than the old version because the 60 mL of milk is gone.','Stir until there are no streaks. Should look like soft-serve. 2%, not 0% — the bit of fat is what kills the squeaky nonfat mouthfeel.','<b>2 min in the fridge</b> to firm. No set step, nothing to wait on. Frozen fruit firms it more. <b>Too thick:</b> a splash of water, 10 mL at a time — the Fairlife is gone from these bowls. <b>Too loose:</b> nothing to do tonight — next time shake ⅛ tsp xanthan in DRY with the powder (0 cal, you keep it for the Creami; never past ⅛ or it goes slimy). Then fold in the fruit, crunch on top LAST so it stays crisp.','<b>This bowl:</b> ½ banana in coins folded in, <b>30 g</b> Fruity Pebbles on top — three times what it used to carry, because the powder is not eating the calories any more.','Dollop the 15 g almond butter on top, do NOT stir it through — this is a fruit-and-cereal bowl and stirring the AB muddies it. It belongs in pockets.'],

 l6:['Pat the salmon bone-dry with paper towel, then press the rub onto every side (cumin ½ · paprika ½ · turmeric ¼ · garlic ¼ · salt ¼ tsp).','<b>Air fryer 400°F, 12–14 min</b> (best for one portion — crispier edges, no preheat wait). Done = flakes apart with light fork pressure + opaque, not glossy-raw, in the thickest part.','Rice: 48 g dry, rinsed till the water runs clear, + 108 mL water + a pinch of salt. Boil (8/10), then low (3/10), lid on, 12 min, off the heat 5 min.','Edamame: 85 g + a splash of water, microwave 90 sec from frozen.','Israeli salad — PILE it: 150 g tomato + 150 g cucumber in ¼" dice, lemon + a little sumac + pinch of salt. Veg is ~15 cal/100g, so a big salad is the free volume that fills the bowl.','Build: rice → flaked salmon → edamame + big salad. <b>OVEN alt (prepping 3–4 at once):</b> 400°F, middle rack, parchment, 12–14 min. <b>Meal-prep:</b> Sunday box the cooked salmon over rice+edamame; day-of splash water + microwave 60–90 sec, add fresh salad then.'],
 l7:['Rice from the batch: ~10 mL water on top, 45–60 sec microwave, fluff.','Sauce: mayo (Hellmann’s Real 8 g weighed, or light 20 g) + sriracha 5 g. Drain the tuna WELL, fold in — that’s spicy tuna, same as the roll.','Build: rice → spicy tuna → edamame + cucumber → soy over → 1 rice cake CRUSHED on top, last. Eat immediately — the crunch dies in minutes.','No rice / no microwave? That’s the Cold Crunch Stacks — its own meal below, zero cooking.'],
 l8:['Sunday: pulse 12 oz skinned salmon in the processor 5–6 taps with 30 g egg whites + 1 tsp garlic + 1 tsp paprika + ½ tsp salt — chunky mince, not paste. (No processor: chop with a knife till it clumps, then mix in whites + spices. Skip the blender.)','Wet hands, 4 patties ~¾" thick, parchment between, fridge (2 days) or freeze.','Day of: nonstick medium-high (7/10), 3 sprays. 3 min untouched → flip once → 3 min. Opaque through = done.','Keto bun + hummus-sriracha schmear (30 g + 3 g) + pickles + crispy-cube potatoes.'],
 l10:['Cucumber first: dice it, salt it, and leave it in a colander while you do everything else. 300 g is a lot of water and it all ends up in the bowl otherwise.',
   '<b>Seed the tomato.</b> Halve it, thumb the jelly and seeds out, dice the walls only — this is the difference between a bowl and a puddle.',
   'Celery and scallion small and uniform. Leave the cucumber a touch bigger so it still reads as crunch.',
   '<b>Mash the guac with the vinegar and sriracha in the bottom of the bowl first</b>, until it is a dressing rather than lumps. You cannot smooth avocado out once the salad is sitting on it.',
   'Pat the cucumber properly dry, then turn it through the dressing with the celery, scallion and tomato.',
   'Fold the tuna in LAST, a few turns with a fork. Worked harder than that it turns to paste.',
   'Taste before you salt — the tuna and the bagel are both already salty.',
   'Bagel split and toasted dark. The crust is doing real work against a soft creamy salad, and its sesame/garlic/onion is why this needs no sesame oil.',
   'Lettuce torn into a bed, salad piled on, bagel halves alongside. Lettuce stays UNDER — dressed lettuce is wilted lettuce in ten minutes.',
   'Eat it soon after mixing; mashed avocado browns.'],
 l9:['Pickle first: cucumber in thin coins, toss with rice vinegar 15 g (none? lemon juice 15 g or white vinegar 15 g — same job) + a pinch of Lakanto + a pinch of salt. Set aside — it pickles itself while you build.','The sauce, made right in your BIGGEST bowl: mayo (Hellmann’s Real 10 g weighed, or light 15 g) + sriracha 5 g + toasted sesame oil 2 g. Should be a loose creamy drizzle — ONLY if it’s too thick to fold, thin with rice vinegar or water, 2–3 g at a time. Watery sauce = too much liquid or wet tuna.','Drain 3 tuna packets WELL (squeeze the pouch), fold into the sauce with the sliced scallion.','Guac in as dollops (don’t fully mix — you want pockets of it), pickled cucumbers piled in, everything-bagel seasoning over the top.','LAST: break 5 rice cakes into big chip-sized shards. Fold half through the bowl, stand the rest up top like chips. Max-crunch variant: 4 cakes + 1 roasted seaweed snack pack crushed in (~same cals, more volume). Spoon in hand, eat immediately — the crunch fades after ~10 minutes, that’s the show.'],
 s1:['Spin AT eat time, not ahead — pre-spun refreezes icy. Tonight’s cup + topping are on the Today flavors card; the batch recipes live in Prep.','Crumbly after the spin? Splash of Fairlife, re-spin. No machine tonight? Bark: spread the spun cup thin on parchment, freeze, snap.'],
 s2:['Mix everything into one dough — it’ll be sticky; wet hands help.','Form a thick disc on parchment. Air fryer 350°F, 6–8 min: edges set, center still soft (it firms as it cools).','Eat warm. Under-bake beats over-bake, every time.'],
 s4:['<b>PAN MATTERS MOST (this is what dried the old one out).</b> Use a SHALLOW wide pan so the batter sits ~1" deep — a 5" springform, a small pie plate, or spread it wide in any dish. A deep container (3"+) bakes the top dry long before the center sets — if that’s all you have, see the deep-pan note below.','Brownie: whisk the egg whites + pumpkin + Oikos + vanilla, then fold in the brownie dry. <b>It should be a THICK, spreadable batter — like frosting, NOT pourable.</b> The old recipe had Fairlife on top of all this = a flood (that’s why yours was watery); this has none. If it still pours, add flour 1 tsp at a time until it holds a spoon-trail. Spread flat in the greased pan.','Cookie DOUGH (a real dough, not a batter): mash the softened 3 g butter with the 14 g Golden Lakanto (Golden = brown-sugar flavor, the thing that makes it taste like cookie), add egg white + vanilla, then the oat flour + AP flour + vanilla whey + soda + salt. <b>It should be a THICK scoopable dough</b> — if it’s runny, add a pinch more oat flour. Drop it in CHUNKS across the brownie (do NOT swirl — swirling thins it and kills the cookie).','<b>Shallow pan (~1" deep): 325°F, 18–22 min.</b> Pull when the edges are set and the center has a slight jiggle + a toothpick comes out with a few moist crumbs (not wet batter). Whey bakes dry — pull EARLY, the center finishes as it cools.','<b>Deep glass pan (like your 5.5"×3"): 325°F, tent foil loosely over the top after 18 min, bake ~30–35 total.</b> The foil stops the top drying while the deep center catches up. Same toothpick cue.','Cool IN the pan 20–30 min (carryover sets the middle). <b>If the top ever comes out dry: poke 6–8 holes, spoon 15 mL Fairlife + a little Lakanto syrup over, rest 60 sec — tres-leches rescue.</b> FF whip 15 g fits the budget.'],
 d1:['Season the beef gently (10 squeezes max), one ¾" patty, deep thumb-dimple in the middle.','Pan/grill medium-high (7/10), 3-min preheat, 3 sprays. 4 min untouched → flip once → 4 min. 160°F or clear juices. Never press it.','Keto bun, egg on top, 32 g SF ketchup. Potatoes + asparagus by this week’s side recipes (Prep → Recipes).'],
 d15:['Medium pot, medium-high (7/10), no oil, 2-min preheat. Beef in, crumbled small, 4–5 min to zero pink.','This week’s spices 30 sec → tomato paste + 60 mL water, stir till dissolved → LOW (2/10) 10–12 min till thick.','Over potatoes, egg on top, asparagus on the side (side methods: Prep → Recipes).'],
 d2:['Rice revived: ~10 mL water, 45–60 sec microwave, fluff. Salmon stays fridge-cold till now: ¾" cubes.','Build: rice → salmon, edamame, cucumber in piles → 30 mL soy over → seaweed crumbled on top.','This week’s twist (jalapeño-lime, dill, scallion…) is on the Prep recipe card. Eat immediately.'],
 d3:['Pat the salmon dry. Rub: paprika ½ tsp + garlic ¼ tsp + salt ¼ tsp + pinch cayenne, pressed on.','Air fryer 390°F, 7–9 min — flakes under a fork. Any salmon works; it’s cooked.','Plate with crispy-cube potatoes (micro 4 min → fryer 390°F 12–14), asparagus (fryer 7 min), edamame (2-min micro from frozen). SF ketchup if you want it.'],
 d17:['Air fryer to 400°F, empty, 3 min. Potatoes in a bowl: 5 sprays, then paprika ½ tsp + garlic powder ¼ tsp + salt ¼ tsp, tossed by hand until every cube is coated.','Potatoes into the basket in a SINGLE layer — piled up they steam instead of crisping. 16 min, shake the basket hard at minute 8.','Glaze while they cook: whisk the five glaze ingredients, then microwave 30 sec. It goes from watery to a thin syrup — that is what makes it cling.','Drizzle in a second bowl: almond butter 10 sec in the microwave, stir the Lakanto in while warm, then sriracha, then lemon, then the water a little at a time until it ribbons off a fork. It will SEIZE stiff first — keep going, it comes back. Usually takes 4–5 tsp, not 2.','Pat the salmon completely dry with paper towels — that is the difference between a crust and grey steamed fish. 3 sprays, pinch of salt.','At minute 16: push the potatoes to one half, salmon on the other, broccoli scattered over the potatoes (5 sprays + pinch of salt on it first). 8 min.','At minute 5 of those 8, NOT sooner: brush the glaze on the salmon. Lakanto burns — early it goes black and bitter, last 3 minutes it lacquers.','Done = the thickest part flakes under light fork pressure, glaze looks glossy, a potato cube crunches. Drizzle over the salmon and broccoli at the table, not the potatoes.'],
 d16:['Defrost frozen cubes fast + safe: sealed ziplock, air pushed out, submerged in COLD water ~10 min. Weigh 7 oz, pat bone-dry — wet fish steams instead of searing.','Rice first: 50 g dry, rinsed till the water runs clear, + 105 mL water + a pinch of salt. Boil 8/10, then low (3/10), lid on, 12 min, off the heat 5 min — don’t peek.','Glaze in a small bowl while the rice cooks: soy 20 mL + rice vinegar 5 mL + Lakanto 8 g + ½ tsp sriracha + ¼ tsp garlic. Stir till the Lakanto dissolves.','Salmon: nonstick pan medium-high (7/10), 2-min preheat, 3 sprays. Dry cubes spread out, not touching. 2 min untouched for a brown edge → turn → 2 more min. Done = opaque, browned, flakes with a fork.','Glaze in: pour over the cubes, drop to low (2/10), toss 60–90 sec till it thickens to a sticky coat — pull it the moment it clings.','Edamame: 80 g microwaved with a splash of water, 90 sec. Build: rice → glazed cubes → edamame + cucumber → scallion + everything seasoning. Warm, seared — nothing like cold poke.'],
 b20:['<b>No shaker, no powder.</b> Stir ¾ tsp cookie butter extract, Lakanto to taste and a pinch of salt straight into the 400 g FAGE 2% until smooth, then 2 min in the fridge to firm.','Banana coins folded in, 3 Biscoff crushed on top LAST so they stay crisp, 9 g almond butter dolloped — not stirred. The cookie butter extract and the real Biscoff hit the same note from two directions, which is why this one does not need chocolate.'],
 b21:['<b>No shaker, no powder.</b> Stir ½ tsp coffee extract + the 5 g cocoa, Lakanto to taste and a pinch of salt into the 400 g FAGE 2% until there are no streaks. 2 min in the fridge.','Banana coins in, 9 Oreo minis crushed over the top, 6 g almond butter stirred right through — this one is chocolate-forward so the AB belongs mixed in. Coffee extract is what turns cocoa into mocha; without it this is just a chocolate bowl.'],
 b22:['<b>No shaker, no powder.</b> Stir ½ tsp orange extract + ½ tsp vanilla bean paste, Lakanto to taste and a pinch of salt into the 400 g FAGE 2%. Orange and vanilla together IS the creamsicle — orange alone reads like juice.','Berries folded in, 6 crushed Nilla on top, then the FF whip 30 g spooned over at the very end and the 8 g almond butter dolloped. Whip last or it collapses into the yogurt.'],
 b23:['<b>No shaker, no powder.</b> Stir the 150 g pumpkin purée + ¾ tsp pumpkin spice extract + ¼ tsp maple extract, Lakanto to taste and a pinch of salt into the 400 g FAGE 2% until it is one even color. 2 min in the fridge.','2 graham sheets crushed over the top as the crust, 14 g almond butter dolloped. Maple behind the pumpkin spice is what makes it read as PIE rather than as spiced yogurt — it is doing the job the brown sugar would.'],
 b24:['<b>No shaker, no powder.</b> Stir ¾ tsp velvet cake extract + the 6 g cocoa, Lakanto to taste and a pinch of salt into the 400 g FAGE 2% until it is one even color. 2 min in the fridge.','Strawberries folded in, 7 crushed Nilla over the top as the white crumb, 10 g almond butter stirred right through.','<b>Why this works without food coloring:</b> red velvet is cocoa plus a sharp dairy tang, and FAGE 2% IS the tang — it is doing the job the buttermilk does in the cake. Only a LITTLE cocoa: past about 8 g it stops being velvet and turns into a chocolate bowl.'],
 b25:['<b>No shaker, no powder.</b> Stir ½ tsp blueberry extract + ¼ tsp lemon extract, Lakanto to taste and a pinch of salt into the 400 g FAGE 2%. The lemon is not optional — every blueberry muffin worth eating has citrus in it, and without it the blueberry reads flat.','<b>Toast the 25 g of dry Kodiak oats first</b> — dry pan, 3 min, shaking, until they smell nutty. That is the muffin-top crumb; untoasted they are just wet oats.','200 g blueberries folded in, toasted oats over the top LAST, 11 g almond butter dolloped — do not stir it through, this one wants the fruit clean.'],
 b26:['<b>No shaker, no powder.</b> Stir 1 tsp cinnamon spice extract + ½ tsp vanilla bean paste, Golden Lakanto to taste and a pinch of salt into the 400 g FAGE 2%. <b>Golden, not white</b> — the brown-sugar note is what separates a snickerdoodle from a cinnamon bowl.','Banana coins in, 2 graham sheets crushed over the top, 7 g almond butter dolloped. Salt matters more here than in any other bowl — a snickerdoodle is a salt-and-cinnamon cookie.'],
 b27:['<b>No shaker, no powder.</b> Stir ¾ tsp almond extract + ½ tsp vanilla bean paste, Lakanto to taste and a pinch of salt into the 400 g FAGE 2%. 2 min in the fridge.','<b>Stir the 18 g almond butter right through</b> — this bowl is the almond, so it belongs everywhere, not in pockets. Berries folded in, 6 crushed Nilla on top.','Almond extract plus almond butter is the whole trick: the extract is the bitter-almond marzipan note a croissant filling has, and the butter is the body. Either alone falls short. <b>Almonds are his one safe nut</b> — no other nut goes in this or any bowl.'],

/* rep-scheme parsing + double-progression verdicts */
function parseTargets(r){
  if(/failure/i.test(r)) return null;
  const parts = r.replace('×','x').split('x');
  const sets = parseInt(parts[0])||3;
  const nums = ((parts[1]||'').match(/\d+/g)||[]).map(Number);
  if(!nums.length) return null;
  if(nums.length>=3 || (nums.length===2 && nums[0]>nums[1]))
    return {sets, per:nums, type:'ladder'};
  if(nums.length===2) return {sets, lo:nums[0], hi:nums[1], type:'range'};
  return {sets, lo:nums[0], hi:nums[0], type:'range'};
}
function verdict(reps, t){
  if(!t) return null;
  const rs = (reps||[]).slice(0,t.sets);
  if(rs.filter(v=>v!=null).length < t.sets) return null;
  if(t.type==='ladder')
    return rs.every((v,i)=>v >= (t.per[i]!=null?t.per[i]:t.per[t.per.length-1])) ? 'up' : 'hold';
  if(rs.every(v=>v>=t.hi)) return 'up';
  if(rs.every(v=>v<t.lo)) return 'down';
  return 'hold';
}

function prItemById(id){
  for(const grp of [...PRS, ...PRS_BK]) for(const it of grp.items) if(it[0]===id) return it;
  return null;
}
function prWeightsFor(ids){
  const pset = store.get('qpcut.prset',{});
  const legacy = store.get('qpcut.prs',{});
  return (ids||[]).map(id=>{
    const it = prItemById(id); if(!it) return null;
    const arr = (pset[id]||[]).filter(v=>v!=null&&v!=='');
    const val = arr.length? arr.join(' / ') : (legacy[id]!=null&&legacy[id]!==''? legacy[id] : it[2]);
    if(!val) return null;
    return `${ids.length>1? it[1].split(' ')[0].replace(',','')+' ':''}${val}`;
  }).filter(Boolean).join(' · ');
}
function prLoc(id, loc){
  const m = WMAP[loc==='deal'?'deal':'bk'];
  for(const d in m) for(let i=0;i<m[d].length;i++) if(m[d][i].includes(id)) return {day:+d, idx:i};
  return null;
}
/* progression coaching helpers */
function jumpFor(w){ return w>=100? 10 : 5; } /* his gym: bars & DBs move in 5s — no 2.5s exist */
function r25(x){ return Math.round(x/5)*5; } /* round every prescribed load to the nearest 5 */
/* Which PR row a program slot is actually showing. exBlockHTML, the rep logger and the box prefill
   MUST agree on this — otherwise wlog snapshots a load under a different id than the card displays,
   and the next session prescribes off a history that belongs to another exercise. */
function resolvePrId(ids, selKey){
  if(!ids || !ids.length) return null;
  const pset = store.get('qpcut.prset',{});
  const legacy = store.get('qpcut.prs',{});
  const sel = store.get('qpcut.exsel',{});
  if(selKey && sel[selKey] && ids.includes(sel[selKey])) return sel[selKey];
  return ids.find(id=>(pset[id]||[]).some(v=>v))
      || ids.find(id=>legacy[id]!=null&&legacy[id]!=='')
      || ids[0];
}
/* Previous sessions of THIS slot, walking back a week at a time from a given date. Date-driven, so it
   answers correctly for a backfilled day too — the old version always walked from THIS week's date. */
function prevSessionOf(exIdx, fromISO, want){
  const out = [];
  for(let k=1;k<=8 && out.length<(want||1);k++){
    const dt = new Date(fromISO+'T12:00:00'); dt.setDate(dt.getDate()-7*k);
    const dISO = iso(dt);
    const rp = (store.get('qpcut.reps.'+dkey(dISO),{}))[exIdx];
    if(rp && rp.some(v=>v!=null)) out.push({date:dISO, reps:rp});
  }
  return out;
}
function lastSessions(dayIdx, exIdx, want){ return prevSessionOf(exIdx, menuWeekDates()[dayIdx], want); }
function lastSessionInfo(dayIdx, exIdx){ return lastSessions(dayIdx, exIdx, 1)[0] || null; }
function loadsOn(isoD, prId){ return (store.get('qpcut.wlog.'+dkey(isoD),{}))[prId] || null; }
/* verdict() scores REPS ONLY, and that is how a hack-squat session which lost a rep AND 10 lb still
   printed 🎉 GO UP (Aug 17 2026: 10/8/7 @ 200/210/230 against 11/8/6 @ 200/220/230). Progress is reps
   at the same-or-more weight, so the LOAD has to be part of the score. */
function loadDrop(cur, prev, sets){
  const c = (cur||[]).slice(0,sets).map(x=>parseFloat(x));
  const p = (prev||[]).slice(0,sets).map(x=>parseFloat(x));
  const hits = [];
  for(let i=0;i<sets;i++){
    if(isNaN(c[i]) || isNaN(p[i])) continue;
    if(c[i] < p[i]-0.01) hits.push({set:i+1, from:p[i], to:c[i]});
  }
  return hits;
}
/* a load that cannot be real. 2224 lb went into the adductor machine's log (wlog 2026-7-24) and fed a
   −2000 lb delta into every comparison downstream, silently. */
function loadWild(cur, prev, sets){
  const c = (cur||[]).slice(0,sets).map(x=>parseFloat(x));
  const p = (prev||[]).slice(0,sets).map(x=>parseFloat(x)).filter(n=>!isNaN(n));
  if(!p.length) return [];
  const ref = Math.max(...p);
  return c.map((v,i)=>({set:i+1, v})).filter(o=>!isNaN(o.v) && o.v > ref*3);
}
/* ⭐ THE ONE ANSWER to "what goes on the bar today". The pre-session target, the post-session
   prescription and the box prefill all come from here, so they can no longer disagree. They used to
   read different stores — pre-session took last session's wlog, post-session took whatever was in the
   boxes — which is why one card said 210/220/240 when the honest answer off his real loads was
   210/230/240. The basis is ALWAYS what he actually lifted (wlog), never the boxes: boxes drift. */
function plannedLoads(exIdx, prId, t, sets, isoD){
  const ls = prevSessionOf(exIdx, isoD, 1)[0];
  if(!ls) return null;
  const base = loadsOn(ls.date, prId);
  if(!base || !base.slice(0,sets).some(x=>!isNaN(parseFloat(x)))) return {from:'noload', last:ls, loads:null};
  const rir = (store.get('qpcut.rir.'+dkey(ls.date),{}))[exIdx];
  const why = (store.get('qpcut.ldrop.'+dkey(ls.date),{}))[exIdx];
  let v = verdict(ls.reps, t);
  /* a load he flagged as MISTYPED and never corrected cannot be built on — prescribing off it would
     launder the bad number into every week that follows */
  if(why==='typo') return {from:'typo', last:ls, loads:null, base, rir, why, verdict:v};
  /* a drop he called a BAD DAY is not a new baseline — he goes back to the weight he had before it.
     a drop he called ON PURPOSE (Q's depth cue) keeps the lighter load and builds from there. */
  let src = base, pend = false;
  const prior = prevSessionOf(exIdx, ls.date, 1)[0];
  const priorL = prior? loadsOn(prior.date, prId) : null;
  if(why==='bad'){
    v = 'hold';
    if(priorL && priorL.slice(0,sets).some(x=>!isNaN(parseFloat(x)))) src = priorL;
  } else if(!why && priorL && loadDrop(base, priorL, sets).length){
    /* the drop was never explained, so that session was never scored — it cannot pay out a GO UP now.
       Hold at what he actually lifted and keep the question open. */
    v = 'hold'; pend = true;
  }
  const sn = src.slice(0,sets).map(x=>parseFloat(x));
  const step = (v==='up')? (rir===0? (n=>n+5) : (n=>n+jumpFor(n)))
             : (v==='down')? (n=>n*0.9) : (n=>n);
  const loads = src.slice(0,sets).map((x,i)=> isNaN(sn[i])? '' : String(r25(step(sn[i]))));
  return { from:(why==='bad'? 'back' : pend? 'pending' : (v||'hold')), loads, base:src, last:ls, rir, why, verdict:v };
}
/* Today's verdict, load-aware. `gate` means "I will not score this until he says WHY the load
   dropped" — his call, Aug 17 2026: ask every time, never guess. */
function sessionScore(exIdx, prId, t, sets, isoD){
  const reps = (store.get('qpcut.reps.'+dkey(isoD),{}))[exIdx]||[];
  const rv = verdict(reps, t);
  if(rv===null) return {v:null};
  const ls = prevSessionOf(exIdx, isoD, 1)[0];
  const cur = loadsOn(isoD, prId), prev = ls? loadsOn(ls.date, prId) : null;
  if(!cur || !prev) return {v:rv};
  const wild = loadWild(cur, prev, sets);
  if(wild.length) return {v:null, wild, cur, prev, last:ls};
  const drops = loadDrop(cur, prev, sets);
  if(!drops.length) return {v:rv};
  const why = (store.get('qpcut.ldrop.'+dkey(isoD),{}))[exIdx];
  if(!why) return {v:null, gate:drops, cur, prev, last:ls, repv:rv};
  if(why==='typo') return {v:null, fixme:drops, cur, prev, last:ls};
  if(why==='bad') return {v:'hold', drops, why, cur, prev, last:ls};
  return {v:rv, drops, why, cur, prev, last:ls}; /* 'purpose' → reps decide; today's load is the new baseline */

/* Gated verdict for one logged exercise, resolving the PR row itself. The wins strip, the session

  if(!t) return {v:verdict(reps, t)};

  const pid = resolvePrId(ids, `${L}|${wd}|${exIdx}`);

const PLATEMATH = {

function plateCombo(v){
  let rem = v; const out = [];
  for(const p of [45,35,25,10,5]){ while(rem >= p-0.01){ out.push(p); rem -= p; } }
  return out.length? out.join('+') + (rem>0.01? ` +${rem.toFixed(1)}`:'') : 'empty';

const loadStr = ls => (ls||[]).filter(x=>x!=='' && x!=null).join(' / ');

function targetLine(pl, boxes, sets){
  if(!pl) return null;

  if(pl.from==='typo')
    return `✎ Last ${pl.last.date.slice(5).replace('-','/')} was logged at ${loadStr(pl.base)} and you flagged that as mistyped, so I will not build on it. Type today's real load and it becomes the baseline.`;
  const L = loadStr(pl.loads);

    return `🎉 <b>GO UP → ${L}</b>${seal} · same rep targets, 1–2 in the tank${pl.rir===0?' · smallest jump only — last week was true failure':''}`;
  if(pl.from==='down')
    return `⬇ <b>LIGHTEN → ${L}</b>${seal} · rebuild one rep a week from here`;
  if(pl.from==='back')
    return `↩ <b>BACK TO ${L}</b>${seal} — you called last week's lighter load a bad day, so it was never a new baseline`;
  if(pl.from==='pending')

/* ⭐ PUT THE PRESCRIBED LOAD IN THE BOXES. His ask, Aug 17 2026: "when im supposed to go up, make it
   that the weight i should do is already in the boxes." Before this the card printed "load 90/90/90"
   beside three boxes reading 85, and he retyped all three at the gym — wlog 2026-8-17 pr_hip proves it.
   Fills on every verdict, not just GO UP (his call): up · hold · lighten · back-off all land.
   THREE SAFETIES, because this writes to his live log:
     · never touches an exercise that already has a rep logged that day — a session under way is his
     · fills once per day per exercise (qpcut.wfill), so an edit of his is never overwritten on re-render
     · writes wlog at the same time, which also fixes the hole where logging reps without touching a
       box recorded a session with NO weight at all (leg curl, 2026-8-17) */
function prefillLoads(ld, wo, wmap, loc){
  /* TODAY ONLY. qpcut.prset is one array per exercise shared across every day, so prefilling a
     backfilled date would stamp that day's prescription onto the box today's card reads — and pr_hack
     sits in BOTH Monday's and Friday's program, so the two would trade numbers every time he backfilled.
     Backfilling is data entry anyway: there he types what he actually lifted. */
  if(ld !== isoToday()) return;
  const fkey = 'qpcut.wfill.'+dkey(ld);
  const filled = store.get(fkey,{});
  const repLog = store.get('qpcut.reps.'+dkey(ld),{});
  const pset = store.get('qpcut.prset',{});
  const wkey = 'qpcut.wlog.'+dkey(ld);
  const wl = store.get(wkey,{});
  const wd = new Date(ld+'T12:00:00').getDay();
  let touched = false;
  wo.ex.forEach(([n,r],i)=>{
    const t = parseTargets(r); if(!t) return;
    const prId = resolvePrId(wmap[i]||[], `${loc}|${wd}|${i}`);
    if(!prId || filled[prId]) return;
    if((repLog[i]||[]).some(v=>v!=null)) return; /* already lifting — hands off */
    const pl = plannedLoads(i, prId, t, t.sets, ld);
    if(!pl || !pl.loads || !pl.loads.some(x=>x!=='')) return;
    const arr = pset[prId] = pset[prId]||[];
    pl.loads.forEach((v,s)=>{ if(v!=='') arr[s] = v; });
    wl[prId] = arr.slice(0,t.sets);
    filled[prId] = pl.loads.slice();
    touched = true;
  });
  if(touched){ store.set('qpcut.prset',pset); store.set(wkey,wl); store.set(fkey,filled); }
}

          else if(prev>=o.t.hi) msg = `${prev} ✓ top of range. Set ${idx+1}: SAME weight — do it again. Every set at ${o.t.hi}+ locks the GO UP. 1–2 in the tank.`;
          else if(prev>=o.t.lo) msg = `${prev} in range. Set ${idx+1}: SAME weight — beat ${Math.min(prev+1,o.t.hi)} if it’s there, ${o.t.lo} is the floor. Fatigue pushes back now; brace and grind. Staying at this weight IS the plan — chasing more mid-exercise costs sets.`;
          else if(prev>=o.t.lo-2) msg = `${prev} — just under range. One more set at the SAME weight, fight for ${o.t.lo}+. If it lands under ${o.t.lo} again → drop ~10%${isNaN(wNum)?'':` (${r25(wNum*0.9)})`} for the last set.`;
          else msg = `${prev} vs ${o.t.lo}–${o.t.hi} — too heavy today. Drop ~10%${isNaN(wNum)?'':` (${r25(wNum*0.9)})`} for the remaining sets and log honest reps. A bad day isn’t a bad plan.`;
        }
        guide = `<div class="coachline">▶ ${msg}</div>`;
      }
    } else {
      const sc = sessionScore(o.ex, prId, o.t, o.sets, o.rd);
      /* Next session's number comes from the SAME function next week's card will call, seeded one week
         forward — so the verdict here and the target there are physically incapable of disagreeing. */
      const nx = (()=>{ const d=new Date(o.rd+'T12:00:00'); d.setDate(d.getDate()+7); return iso(d); })();
      const np = plannedLoads(o.ex, prId, o.t, o.sets, nx);
      const nxL = (np && np.loads)? loadStr(np.loads) : null;
      const chips = on => [['purpose','on purpose'],['bad','bad day'],['typo','mistyped']]
        .map(([k,lab])=>`<button class="mealpick${on===k?' on':''}" style="padding:3px 10px;font-size:12px" data-ldrop="${o.rd}|${o.ex}|${k}">${lab}</button>`).join('');
      const askRow = on => `<div class="whyrow">${chips(on)}</div>`;
      const dropTxt = ds => ds.map(d=>`S${d.set} ${d.from}→${d.to}`).join(' · ');
      if(sc.wild){
        guide = `<div class="coachline" style="color:var(--meat)">⚠ ${sc.wild.map(w=>`S${w.set} reads <b>${w.v}</b>`).join(' · ')} — more than 3× anything you have ever lifted on this. Fix the weight box above; I am not scoring a session off a number that cannot be real.</div>`;
      } else if(sc.gate){
        guide = `<div class="coachline" style="color:var(--meat)">⏸ The weight went DOWN — ${dropTxt(sc.gate)}. On reps alone this would read ${sc.repv==='up'?'GO UP':sc.repv==='down'?'lighten':'hold'}, but I am not calling it until you tell me why.</div>${askRow(null)}`;
      } else if(sc.fixme){
        guide = `<div class="coachline" style="color:var(--meat)">✎ Mistyped — fix the weight boxes above (${dropTxt(sc.fixme)}) and I will score it. Nothing gets recorded off a wrong number.</div>${askRow('typo')}`;
      } else {
        let line;
        if(sc.v==='up'){
          line = sc.why==='purpose'
            ? `🎉 GO UP — every target hit, and you called the lighter load deliberate, so <b>${loadStr(sc.cur)||'today’s load'}</b> is the new baseline. Next session → <b>${nxL||'the smallest jump'}</b>.`
            : (rir===0
              ? `🎉 GO UP — but that was true failure (0 in the tank), so next session takes the SMALLEST jump only → <b>${nxL||'+5 lb'}</b>.`
              : `🎉 GO UP → next session <b>${nxL||'the smallest solid jump'}</b>. It will already be in the boxes.`);
        } else if(sc.v==='down'){
          line = `⬇ LIGHTEN → next session <b>${nxL||'~10% down'}</b>, rebuild from there. It will already be in the boxes.`;
        } else if(sc.why==='bad'){
          line = `HOLD — a bad day, so the lighter load does not stick. Next session goes BACK to <b>${nxL||'the weight before it'}</b>.`;
        } else {
          line = (rir!=null && rir>=3)
            ? `HOLD <b>${nxL||'the same weight'}</b> next session — but 3+ in the tank means the reps are there. Take every set to 1–2 left and it is a GO UP.`
            : `HOLD <b>${nxL||'the same weight'}</b> next session — beat today by one rep anywhere. That’s the whole game.`;
        }
        guide = `<div class="coachline">${line}</div>` + (sc.why? askRow(sc.why) : '');
      }
    }
    guide = lastLine + guide; /* last session stays visible in every state — that's the reference point */
  }
  /* RIR chips — tap after the final set */
  let rirHTML = '';
  if(doneCount>0){
    rirHTML = `<div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px">
      <span class="ingmac">last set — reps left in tank:</span>
      ${[0,1,2,3].map(n=>`<button class="mealpick${rir===n?' on':''}" style="padding:3px 10px;font-size:12px" data-rir="${o.rd}|${o.ex}|${n}">${n===3?'3+':n}</button>`).join('')}
    </div>`;
  }
  return guide + rirHTML;
}

function renderWhenIdle(){

    if(a && a.tagName && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ idleTimer = setTimeout(tick, 400); return; }
    render();
  };
  idleTimer = setTimeout(tick, 300);
}

function wireReps(){
  /* [data-rir] chips are bound by DELEGATION at boot (see v14 boot block) — refreshGuides()
     swaps the guide innerHTML, so per-element bindings here would die after the first tap */
  document.querySelectorAll('input.repin').forEach(inp=>inp.addEventListener('change',()=>{
    const key = 'qpcut.reps.'+dkey(inp.dataset.rd);
    const rp = store.get(key,{});
    const arr = rp[inp.dataset.ex] = rp[inp.dataset.ex]||[];
    const v = parseInt(inp.value);
    arr[+inp.dataset.set] = isNaN(v)? null : v;
    store.set(key,rp);
    /* Snapshot the load he is lifting, if nothing has recorded it yet. wlog USED to be written only when
       he edited a weight box, so a session where the box was already right recorded reps with NO weight
       (leg curl, 2026-8-17) — and the next session then prescribed off a drifted box instead of history. */
    if(!isNaN(v) && !/^core/.test(String(inp.dataset.ex))){
      const d = inp.dataset.rd, wdS = new Date(d+'T12:00:00').getDay(), locS = store.get('qpcut.loc','deal');
      const exIdx = parseInt(String(inp.dataset.ex),10);
      const idsS = ((WMAP[locS==='deal'?'deal':'bk']||{})[wdS]||[])[exIdx]||[];
      const pidS = resolvePrId(idsS, `${locS}|${wdS}|${exIdx}`);
      if(pidS){
        const wkS = 'qpcut.wlog.'+dkey(d), wlS = store.get(wkS,{});
        if(!wlS[pidS] || !wlS[pidS].some(x=>x)){
          const cur = (store.get('qpcut.prset',{}))[pidS]||[];
          if(cur.some(x=>x)){ wlS[pidS] = cur.slice(); store.set(wkS,wlS); }
        }
      }
    }
    /* logging a real set TODAY auto-starts the rest clock — compounds get 120 s.
       parseInt strips the 'R' off right-arm ids so both arms rest the same. */
    if(!isNaN(v) && inp.dataset.rd===isoToday() && !/^core/.test(String(inp.dataset.ex))){
      const wd = new Date().getDay();
      const wo = workoutFor(wd, store.get('qpcut.loc','deal'));
      const exIdx = parseInt(String(inp.dataset.ex),10);
      const nm = wo && wo.ex[exIdx]? wo.ex[exIdx][0] : '';
      armRest(/squat|press|row|deadlift|thrust|dip|pull/i.test(nm)? 120 : 90);
    }
    refreshGuides(); renderWhenIdle();
  }));
}
function workoutFor(dayIdx, loc){
  const plan = loc==='deal' ? GYM : HOME;
  if(dayIdx===1) return plan.mon;
  if(dayIdx===2) return plan.tue;
  if(dayIdx===3) return plan.wed;
  if(dayIdx===5) return plan.fri;
  if(dayIdx===6) return loc==='deal' ? SAT_GRANDMA : SAT_HOME;
  return null;
}
